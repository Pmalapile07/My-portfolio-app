<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream Black · Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu,chevron_right,explore_nearby&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            min-height: 100vh;
        }

        .site-header {
            background-color: #FF286F;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
            margin-left: -8px;
        }

        .brand-logo {
            display: block;
            height: 65px;
            width: auto;
            object-fit: contain;
            object-position: left center;
        }

        .hamburger {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: background 0.15s ease;
            margin-right: -8px;
        }

        .hamburger .material-symbols-outlined {
            color: #FFFCF5;
        }

        .hamburger:hover {
            background-color: rgba(255, 252, 245, 0.1);
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 400;
            font-style: normal;
            font-size: 48px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }

        @media (max-width: 480px) {
            .site-header {
                padding: 0 16px;
            }
            .logo-container {
                margin-left: -4px;
            }
            .hamburger {
                margin-right: -4px;
            }
            .brand-logo {
                height: 55px;
            }
            .hamburger .material-symbols-outlined {
                font-size: 42px;
            }
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 600;
            color: #045B92;
            margin-bottom: 1rem;
            max-width: 900px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .hero-subhead {
            font-size: 1.5rem;
            color: #045B92;
            max-width: 700px;
            line-height: 1.5;
            margin-bottom: 2.5rem;
            font-weight: 400;
        }

        .button-group {
            display: flex;
            gap: 1.25rem;
            justify-content: center;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.875rem 2rem;
            border-radius: 20px;
            font-size: 1.125rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 2px solid;
            text-decoration: none;
            display: inline-block;
            width: auto;
            min-width: 160px;
        }

        .btn-outline {
            background: transparent;
            border-color: #045B92;
            color: #045B92;
        }

        .btn-outline:hover {
            background: rgba(4, 91, 146, 0.05);
        }

        .btn-primary {
            background: #FF286F;
            border-color: #FF286F;
            color: white;
        }

        .btn-primary:hover {
            background: #e02060;
            border-color: #e02060;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 2rem;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 1.25rem 2rem;
            border: 2px solid #045B92;
            border-radius: 40px;
            font-size: 1.125rem;
            color: #1a1a1a;
            background: white;
            outline: none;
            transition: box-shadow 0.2s ease;
        }

        .search-input::placeholder {
            color: rgba(4, 91, 146, 0.5);
            font-weight: 400;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(4, 91, 146, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .search-icon .material-symbols-outlined {
            color: #045B92;
            font-size: 32px;
            font-weight: 400;
        }

        .location-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #045B92;
            font-size: 1.125rem;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s ease;
            margin-top: 0.5rem;
        }

        .location-link:hover {
            opacity: 0.8;
        }

        .location-link .material-symbols-outlined {
            color: #FF286F;
            font-size: 28px;
            font-weight: 400;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 60px 20px;
            }
            .hero h1 {
                font-size: 2.75rem;
            }
            .hero-subhead {
                font-size: 1.25rem;
            }
            .button-group {
                gap: 1rem;
            }
            .btn {
                padding: 0.75rem 1.5rem;
                min-width: 140px;
                font-size: 1rem;
            }
            .search-input {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
            .search-icon .material-symbols-outlined {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            .hero h1 {
                font-size: 2.25rem;
            }
            .hero-subhead {
                font-size: 1.125rem;
            }
            .button-group {
                flex-direction: row;
                width: 100%;
            }
            .btn {
                width: auto;
                min-width: 130px;
                flex: 0 1 auto;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img  
                class="brand-logo"
                src="Cream Black Typography Loop Brand Logo (500 x 180 px).png" 
                alt="Cream Black Typography Loop Brand Logo"
                onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%2265%22%20viewBox%3D%220%200%20200%2065%22%3E%3Crect%20width%3D%22200%22%20height%3D%2265%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2212%22%20y%3D%2244%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
            >
        </div>
        <button class="hamburger" aria-label="Menu" aria-expanded="false">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </header>

    <section class="hero">
        <h1>Turn your free time into paid time</h1>
        <p class="hero-subhead">Small jobs around you or remote. Your free time just got an upgrade.</p>
        
        <div class="button-group">
            <button class="btn btn-outline">Post a task</button>
            <button class="btn btn-primary">Learn more</button>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search task by city or postal code"
                >
                <span class="search-icon">
                    <span class="material-symbols-outlined">chevron_right</span>
                </span>
            </div>
            <a href="#" class="location-link">
                <span class="material-symbols-outlined">explore_nearby</span>
                or use current location
            </a>
        </div>
    </section>

    <script>
        (function() {
            const hamburgerBtn = document.querySelector('.hamburger');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function(e) {
                    const expanded = this.getAttribute('aria-expanded') === 'true' ? false : true;
                    this.setAttribute('aria-expanded', expanded);
                });
            }
        })();
    </script>
</body>
</html>
