<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Cream Black · Hero</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Load Material Symbols Outlined with all needed icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_forward_ios,close,explore_nearby,menu&display=swap">
    <!-- Load Roboto Regular 400 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap">
    <!-- Load Unbounded Regular for heading -->
    <style>
        @font-face {
            font-family: 'Unbounded';
            src: url('Unbounded-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.5;
            color: #1a1a1a;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        /* Mobile tap highlight removal */
        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        .site-header {
            background-color: #FF286F;
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .header-container {
            width: 100%;
            max-width: 1200px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-logo {
            display: block;
            max-height: 65px;
            width: auto;
            object-fit: contain;
        }

        .hamburger {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
            border-radius: 8px;
        }

        .hamburger .material-symbols-outlined {
            color: #FFFCF5;
            font-size: 36px;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 40;
        }

        @media (max-width: 480px) {
            .header-container {
                height: 80px;
                padding: 0 20px;
            }
            .brand-logo {
                max-height: 55px;
            }
            .hamburger .material-symbols-outlined {
                font-size: 32px;
            }
        }

        /* Ensure minimum touch target size */
        @media (max-width: 768px) {
            .hamburger, .close-btn, .btn, .signin-btn, .nav-link, .location-link {
                min-height: 44px;
                min-width: 44px;
            }
        }

        .hero {
            width: 100%;
            max-width: 1200px;
            padding: 100px 24px 60px 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            text-align: left;
        }

        .hero h1 {
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: clamp(2.75rem, 9vw, 4.75rem);
            font-weight: 400;
            color: #045B92;
            margin-bottom: 1.25rem;
            max-width: 900px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-transform: lowercase;
            text-align: left;
            word-break: break-word;
        }

        .hero h1::first-letter {
            text-transform: uppercase;
        }

        .hero-subhead {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1.125rem;
            font-weight: 400;
            color: #045B92;
            max-width: 700px;
            line-height: 1.5;
            margin-bottom: 2rem;
            text-align: left;
            word-break: break-word;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            width: 100%;
            max-width: 700px;
        }

        .btn {
            padding: 0.875rem 1.5rem;
            border-radius: 5px;
            font-size: 1.125rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid;
            text-decoration: none;
            display: inline-block;
            flex: 1;
            min-width: 140px;
            text-align: center;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-outline {
            background: transparent;
            border-color: #045B92;
            color: #045B92;
            /* 🔹 Post a task button: explicit 2px solid border (already solid via .btn) */
        }

        .btn-outline:hover {
            background: rgba(4, 91, 146, 0.05);
        }

        .btn-primary {
            background: #FF286F;
            border-color: #FF286F;
            color: white;
        }

        .btn-primary:hover {
            background: #e02060;
            border-color: #e02060;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            margin-bottom: 0.5rem;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 1rem 2rem;
            border: 1px solid #045B92;
            border-radius: 40px;
            font-size: 1rem;
            color: #1a1a1a;
            background: white;
            outline: none;
            transition: box-shadow 0.2s ease;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 400;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input::placeholder {
            color: rgba(4, 91, 146, 0.5);
            font-weight: 400;
            opacity: 1;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(4, 91, 146, 0.1);
        }

        .search-icon {
            position: absolute;
            /* 🔹 Icon moved slightly to the right: increased from 1.5rem to 2rem */
            right: 3rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 300;
            font-style: normal;
            font-size: 28px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            color: #045B92;
        }

        .location-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #FF286F;
            font-size: 1rem;
            font-weight: 400;
            text-decoration: none;
            transition: opacity 0.2s ease;
            margin-top: 0.25rem;
            width: 100%;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 8px;
        }

        .location-link:hover {
            opacity: 0.8;
        }

        .location-link .material-symbols-outlined {
            color: #FF286F;
            font-size: 24px;
        }

        /* Navigation Menu Overlay */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .nav-container {
            width: 100%;
            max-width: 700px;
            padding: 2rem 24px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .nav-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 2rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        .close-btn .material-symbols-outlined {
            color: #FF286F;
            font-size: 40px;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }

        .signin-btn {
            width: 100%;
            padding: 1rem 2rem;
            background-color: #FF286F;
            border: 2px solid #FF286F;
            /* 🔹 Sign in button border-radius changed to 5px */
            border-radius: 5px;
            color: white;
            font-size: 1.125rem;
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 2.5rem;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-appearance: none;
            appearance: none;
        }

        .signin-btn:hover {
            background: #e02060;
            border-color: #e02060;
        }

        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .nav-link {
            font-size: 1.25rem;
            color: #045B92;
            text-decoration: none;
            font-weight: 400;
            transition: opacity 0.2s ease;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 4px 0;
            display: inline-block;
        }

        .nav-link:hover {
            opacity: 0.7;
        }

        .nav-divider {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(4, 91, 146, 0.2);
            margin: 1.5rem 0;
        }

        /* Improved mobile styles */
        @media (max-width: 768px) {
            .hero {
                padding: 80px 20px 40px 20px;
            }
            
            .hero h1 {
                font-size: clamp(2.5rem, 8.5vw, 4rem);
            }
            
            .hero-subhead {
                font-size: 1rem;
                margin-bottom: 1.75rem;
            }
            
            .btn {
                font-size: 1rem;
                padding: 0.75rem 1.25rem;
                min-width: 130px;
                border-width: 2px;
            }
            
            .search-input {
                padding: 0.875rem 1.5rem;
                font-size: 0.9375rem;
                border-width: 2px;
            }

            .search-icon {
                right: 3rem;  /* maintain same right position on mobile */
            }
            
            .nav-container {
                padding: 1.5rem 20px;
            }
            
            .nav-link {
                font-size: 1.125rem;
            }
            
            .signin-btn {
                padding: 0.875rem 1.5rem;
                font-size: 1rem;
                margin-bottom: 2rem;
                border-width: 2px;
                /* 🔹 keep 5px radius on mobile */
                border-radius: 5px;
            }
            
            .nav-links {
                gap: 0.625rem;
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 60px 16px 30px 16px;
            }
            
            .hero h1 {
                font-size: clamp(2.25rem, 7.5vw, 2.75rem);
            }
            
            .hero-subhead {
                font-size: 0.9375rem;
                margin-bottom: 1.5rem;
            }
            
            .button-group {
                gap: 0.375rem;
                margin-bottom: 0.75rem;
            }
            
            .btn {
                font-size: 0.9375rem;
                min-width: 120px;
                padding: 0.75rem 0.5rem;
                border-width: 2px;
            }
            
            .search-input {
                padding: 0.875rem 1.25rem;
                font-size: 0.875rem;
                border-width: 2px;
            }
            
            .search-icon {
                /* 🔹 keep right shift on small screens */
                right: 1.75rem;
            }
            
            .location-link {
                font-size: 0.875rem;
                margin-top: 0.125rem;
            }
            
            .nav-container {
                padding: 1rem 16px;
            }
            
            .close-btn .material-symbols-outlined {
                font-size: 36px;
            }
            
            .signin-btn {
                padding: 0.75rem 1.25rem;
                margin-bottom: 1.75rem;
                font-size: 0.9375rem;
                border-width: 2px;
                border-radius: 5px;
            }
            
            .nav-links {
                gap: 0.5rem;
            }
            
            .nav-link {
                font-size: 1rem;
            }
            
            .nav-divider {
                margin: 1.25rem 0;
            }
        }

        /* Landscape mode optimization */
        @media (max-height: 600px) and (orientation: landscape) {
            .hero {
                padding: 40px 24px 30px 24px;
            }
            
            .nav-container {
                min-height: auto;
                padding: 1rem 24px;
            }
            
            .signin-btn {
                margin-bottom: 1.5rem;
                border-radius: 5px;
            }
            
            .nav-links {
                gap: 0.5rem;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .btn-outline {
                border-width: 2px;
            }
            
            .search-input {
                border-width: 2px;
            }
            
            .signin-btn {
                border-width: 2px;
            }
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="logo-container">
                <img  
                    class="brand-logo"
                    src="Cream Black Typography Loop Brand Logo (500 x 180 px).png" 
                    alt="Cream Black Typography Loop Brand Logo"
                    loading="eager"
                    onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%2265%22%20viewBox%3D%220%200%20200%2065%22%3E%3Crect%20width%3D%22200%22%20height%3D%2265%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2212%22%20y%3D%2244%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
                >
            </div>
            <button class="hamburger" id="menuBtn" aria-label="Open menu" aria-expanded="false">
                <span class="material-symbols-outlined" aria-hidden="true">menu</span>
            </button>
        </div>
    </header>

    <section class="hero">
        <h1>Turn your<br>free time into<br>paid time</h1>
        <p class="hero-subhead">Small jobs around you or remote. Your free time just got an upgrade.</p>
        
        <div class="button-group">
            <button class="btn btn-outline">Post a task</button>
            <button class="btn btn-primary">Learn more</button>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search task by city or postal code"
                    aria-label="Search tasks by city or postal code"
                >
                <span class="search-icon" aria-hidden="true">
                    <span class="material-symbols-outlined">arrow_forward_ios</span>
                </span>
            </div>
            <a href="#" class="location-link">
                <span class="material-symbols-outlined" aria-hidden="true">explore_nearby</span>
                use current location
            </a>
        </div>
    </section>

    <!-- Navigation Menu Overlay -->
    <div class="nav-overlay" id="navOverlay" aria-hidden="true">
        <div class="nav-container">
            <div class="nav-header">
                <button class="close-btn" id="closeBtn" aria-label="Close menu">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>
            
            <button class="signin-btn">Sign in</button>
            
            <div class="nav-links">
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">How it works</a>
                <a href="#" class="nav-link">Safety</a>
                <a href="#" class="nav-link">Pricing</a>
                <a href="#" class="nav-link">Post a task</a>
                <a href="#" class="nav-link">Find a task</a>
            </div>
            
            <hr class="nav-divider" aria-hidden="true">
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            const menuBtn = document.getElementById('menuBtn');
            const navOverlay = document.getElementById('navOverlay');
            const closeBtn = document.getElementById('closeBtn');
            
            if (menuBtn && navOverlay && closeBtn) {
                // Open menu
                menuBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    navOverlay.classList.add('active');
                    navOverlay.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                    menuBtn.setAttribute('aria-expanded', 'true');
                });
                
                // Close menu
                function closeMenu() {
                    navOverlay.classList.remove('active');
                    navOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
                
                closeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    closeMenu();
                });
                
                // Close menu when clicking outside
                navOverlay.addEventListener('click', function(e) {
                    if (e.target === navOverlay) {
                        closeMenu();
                    }
                });
                
                // Close menu with Escape key
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && navOverlay.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }
        })();
    </script>
</body>
</html>
