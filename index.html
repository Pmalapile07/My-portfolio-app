<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream Black · Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fefaf2;
            min-height: 100vh;
        }

        .site-header {
            background-color: #FF286F;
            width: 100%;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .logo-container {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            height: 100%;
        }

        .brand-logo {
            display: block;
            max-height: 74px;
            width: auto;
            object-fit: contain;
        }

        .hamburger {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 52px;
            height: 52px;
            background: transparent;
            border: 2px solid #FFFCF5;
            border-radius: 10px;
            cursor: pointer;
            padding: 10px 6px;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .hamburger:hover {
            background-color: rgba(255, 252, 245, 0.1);
        }

        .hamburger svg {
            width: 30px;
            height: 30px;
            display: block;
        }

        .hamburger svg line {
            stroke: #FFFCF5;
            stroke-width: 2.8;
            stroke-linecap: round;
        }

        @media (max-width: 480px) {
            .site-header {
                padding: 0 20px;
                height: 80px;
            }
            .brand-logo {
                max-height: 64px;
            }
            .hamburger {
                width: 48px;
                height: 48px;
            }
        }

        .page-content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img  
                class="brand-logo"
                src="Cream Black Typography Loop Brand Logo.png" 
                alt="Cream Black Typography Loop Brand Logo"
                onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22220%22%20height%3D%2274%22%20viewBox%3D%220%200%20220%2074%22%3E%3Crect%20width%3D%22220%22%20height%3D%2274%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2220%22%20y%3D%2248%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
            >
        </div>

        <button class="hamburger" aria-label="Menu" aria-expanded="false">
            <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <line x1="6" y1="10.5" x2="26" y2="10.5" stroke="#FFFCF5" stroke-width="2.8" stroke-linecap="round"/>
                <line x1="6" y1="16.5" x2="26" y2="16.5" stroke="#FFFCF5" stroke-width="2.8" stroke-linecap="round"/>
                <line x1="6" y1="22.5" x2="26" y2="22.5" stroke="#FFFCF5" stroke-width="2.8" stroke-linecap="round"/>
            </svg>
        </button>
    </header>

    <main class="page-content">
        <h1>Cream Black Loop header</h1>
        <p>Background #FF286F · Hamburger #FFFCF5 with outline · Logo zoomed in</p>
    </main>

    <script>
        (function() {
            const hamburgerBtn = document.querySelector('.hamburger');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function(e) {
                    const expanded = this.getAttribute('aria-expanded') === 'true' ? false : true;
                    this.setAttribute('aria-expanded', expanded);
                });
            }
        })();
    </script>
</body>
</html>
