<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Cream Black · Hero · centered · 1px · refined nav</title>
    <!-- Preconnect + Google Fonts: all visible -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400&display=swap">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.5;
            color: #1a1a1a;
            background-color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        button, a {
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ANNOUNCEMENT BAR: only one close (removed duplicate X) --- */
        .announcement-bar {
            width: 100%;
            background: #045B92;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 20;
        }
        .announcement-container {
            width: 100%;
            max-width: 1200px;
            padding: 0.5rem 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 48px;
        }
        .announcement-message {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: white;
            font-size: 0.9rem;
            font-weight: 400;
        }
        /* only the functional close button remains — the extra "close" icon is removed from HTML */
        .store-badge-group {
            display: flex;
            align-items: center;
        }
        .close-announcement {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 3px;
            transition: opacity 0.2s;
        }
        .close-announcement:hover {
            opacity: 0.7;
        }
        .close-announcement .material-symbols-outlined {
            color: white;
            font-size: 22px;
            font-variation-settings: 'FILL' 0, 'wght' 300;
        }

        /* --- SITE HEADER --- */
        .site-header {
            background-color: #FF286F;
            width: 100%;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .header-container {
            width: 100%;
            max-width: 1200px;
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .brand-logo {
            display: block;
            max-height: 65px;
            width: auto;
            object-fit: contain;
        }

        .desktop-cta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .desktop-cta-btn {
            background: white;
            border-radius: 5px;
            padding: 0.6rem 1.8rem;
            color: #FF286F;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Roboto', sans-serif;
            -webkit-appearance: none;
            appearance: none;
            border: 1px solid white;
            background: white;
            color: #FF286F;
            font-weight: 500;
        }
        .desktop-cta-btn:hover {
            background: #ffe5ec;
        }

        .hamburger {
            display: none;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
            border-radius: 5px;
        }
        .hamburger .material-symbols-outlined {
            color: #FFFCF5;
            font-size: 36px;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 40;
        }

        /* --- HERO: CENTERED + BIGGER ELEMENTS ON LARGE SCREENS --- */
        .hero {
            width: 100%;
            max-width: 1200px;
            padding: 100px 24px 50px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h1 {
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: clamp(2.75rem, 9vw, 5rem);   /* larger on big screens */
            font-weight: 400;
            color: #045B92;
            margin-bottom: 1.5rem;
            max-width: 1000px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            text-transform: lowercase;
            text-align: center;
            word-break: break-word;
        }

        .hero h1::first-letter {
            text-transform: uppercase;
        }

        .hero-subhead {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 1.25rem;        /* slightly larger base */
            font-weight: 400;
            color: #045B92;
            max-width: 750px;
            line-height: 1.5;
            margin-bottom: 2rem;
            text-align: center;
        }

        /* BUTTON GROUP: bigger on desktop */
        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 0.8rem;      /* REDUCED gap between buttons & search */
            flex-wrap: wrap;
            width: 100%;
            max-width: 800px;
        }

        .btn {
            padding: 1rem 2rem;          /* increased padding → bigger buttons */
            border-radius: 5px !important;
            font-size: 1.25rem;          /* larger font */
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid;
            text-decoration: none;
            display: inline-block;
            flex: 1;
            min-width: 170px;
            text-align: center;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-appearance: none;
            appearance: none;
        }

        .btn-outline {
            background: transparent;
            border-color: #045B92;
            color: #045B92;
        }
        .btn-outline:hover {
            background: rgba(4, 91, 146, 0.05);
        }
        .btn-primary {
            background: #FF286F;
            border-color: #FF286F;
            color: white;
        }
        .btn-primary:hover {
            background: #e02060;
            border-color: #e02060;
        }

        /* SEARCH – 55px radius, 1px border, bigger on large screens */
        .search-container {
            width: 100%;
            max-width: 750px;
            margin-bottom: 0.5rem;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 1.2rem 2.2rem;      /* taller input */
            border: 1px solid #045B92;
            border-radius: 55px !important;
            font-size: 1.2rem;            /* bigger placeholder text */
            color: #1a1a1a;
            background: white;
            outline: none;
            transition: box-shadow 0.2s ease;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 400;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input::placeholder {
            color: rgba(4, 91, 146, 0.5);
            font-weight: 400;
            opacity: 1;
        }

        .search-input:focus {
            box-shadow: 0 0 0 3px rgba(4, 91, 146, 0.1);
        }

        .search-icon {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 400;
            font-style: normal;
            font-size: 30px;              /* slightly larger icon */
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
            color: #045B92;
        }

        .location-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: #FF286F;
            font-size: 1.1rem;
            font-weight: 400;
            text-decoration: none;
            transition: opacity 0.2s ease;
            margin-top: 0.25rem;
            width: 100%;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 8px;
            border-radius: 5px;
        }

        .location-link .material-symbols-outlined {
            color: #FF286F;
            font-size: 26px;
        }

        /* --- NAV OVERLAY: reduced list size & compact sign-in button --- */
        .nav-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .nav-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .nav-container {
            width: 100%;
            max-width: 600px;
            padding: 1.5rem 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .nav-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;                /* reduced close button size */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .close-btn .material-symbols-outlined {
            color: #FF286F;
            font-size: 28px;             /* smaller close icon */
        }

        /* Sign-in button: exactly the same as hero buttons (padding, font) */
        .signin-btn {
            width: 100%;
            padding: 1rem 2rem;           /* identical to .btn on desktop */
            background-color: #FF286F;
            border: 1px solid #FF286F;
            border-radius: 5px;
            color: white;
            font-size: 1.25rem;           /* same as hero buttons */
            font-weight: 400;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-bottom: 1.5rem;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-appearance: none;
            appearance: none;
        }

        /* Nav links: reduced size, tighter */
        .nav-links {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;                /* minimal gap */
            margin-bottom: 1.5rem;
        }

        .nav-link {
            font-size: 1.1rem;            /* smaller than before */
            color: #045B92;
            text-decoration: none;
            font-weight: 400;
            transition: opacity 0.2s ease;
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 0.2rem 0;
            display: inline-block;
            border-radius: 5px;
        }

        .nav-divider {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(4, 91, 146, 0.2);
            margin: 0.8rem 0;
        }

        /* --- DESKTOP: everything bigger, perfect spacing --- */
        @media (min-width: 1024px) {
            .hero {
                padding-top: 110px;
                padding-bottom: 60px;
            }
            .hero h1 {
                font-size: 5rem;           /* explicitly larger on big screens */
                max-width: 1100px;
            }
            .hero-subhead {
                font-size: 1.35rem;
                max-width: 800px;
                margin-bottom: 2rem;
            }
            .btn {
                padding: 1.1rem 2.2rem;
                font-size: 1.3rem;
                min-width: 190px;
            }
            .search-input {
                padding: 1.3rem 2.4rem;
                font-size: 1.3rem;
            }
            .search-container {
                max-width: 800px;
            }
        }

        /* Mobile adjustments (keeping elements appropriately sized) */
        @media (max-width: 768px) {
            .desktop-cta {
                display: none;
            }
            .hamburger {
                display: flex;
            }
            .header-container {
                height: 80px;
            }
            .brand-logo {
                max-height: 55px;
            }
            .hero {
                padding: 80px 20px 40px 20px;
            }
            .hero h1 {
                font-size: clamp(2.5rem, 8.5vw, 4rem);
            }
            .hero-subhead {
                font-size: 1.1rem;
                margin-bottom: 1.8rem;
            }
            .btn {
                padding: 0.85rem 1.5rem;
                font-size: 1.1rem;
                min-width: 150px;
            }
            .search-input {
                padding: 1rem 1.8rem;
                font-size: 1.1rem;
            }
            .search-icon {
                right: 1.5rem;
            }
            .close-btn .material-symbols-outlined {
                font-size: 28px;          /* keep smaller close on mobile */
            }
            .signin-btn {
                padding: 0.85rem 1.5rem;   /* match mobile button size */
                font-size: 1.1rem;
            }
            .nav-link {
                font-size: 1rem;           /* smaller on mobile */
            }
        }

        @media (max-width: 480px) {
            .hero {
                padding: 70px 16px 30px 16px;
            }
            .hero h1 {
                font-size: clamp(2.4rem, 7vw, 2.8rem);
            }
            .hero-subhead {
                font-size: 1rem;
            }
            .btn {
                padding: 0.75rem 1rem;
                font-size: 1rem;
                min-width: 130px;
            }
            .search-input {
                padding: 0.9rem 1.3rem;
                font-size: 1rem;
            }
            .close-btn .material-symbols-outlined {
                font-size: 26px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .hero {
                padding: 50px 24px 30px 24px;
            }
        }
        @media (prefers-contrast: high) {
            .btn, .search-input, .signin-btn, .desktop-cta-btn {
                border-width: 1px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
    <!-- Flaticon attribution kept as comment -->
</head>
<body>
    <!-- ANNOUNCEMENT BAR: only one functional X (removed duplicate message icon) -->
    <div class="announcement-bar" id="announcementBar">
        <div class="announcement-container">
            <div class="announcement-message">
                <!-- ONLY ONE visual element: the sparkle + text, no extra "close" icon -->
                <span>✨ Upcoming soon – available on iOS & Android</span>
            </div>
            <div class="store-badge-group">
                <button class="close-announcement" id="closeAnnouncementBtn" aria-label="Close announcement">
                    <span class="material-symbols-outlined">close_small</span>
                </button>
            </div>
        </div>
    </div>

    <header class="site-header">
        <div class="header-container">
            <div class="logo-container">
                <img  
                    class="brand-logo"
                    src="Cream Black Typography Loop Brand Logo (500 x 180 px).png" 
                    alt="Cream Black Loop"
                    loading="eager"
                    onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%2265%22%20viewBox%3D%220%200%20200%2065%22%3E%3Crect%20width%3D%22200%22%20height%3D%2265%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2212%22%20y%3D%2244%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
                >
            </div>
            <div class="desktop-cta">
                <button class="desktop-cta-btn">Get started</button>
            </div>
            <button class="hamburger" id="menuBtn" aria-label="Open menu" aria-expanded="false">
                <span class="material-symbols-outlined" aria-hidden="true">menu</span>
            </button>
        </div>
    </header>

    <!-- HERO: everything bigger, centered, tighter button–search gap -->
    <section class="hero">
        <h1>Turn your<br>free time into<br>paid time</h1>
        <p class="hero-subhead">Small jobs around you or remote. Your free time just got an upgrade.</p>
        
        <div class="button-group">
            <button class="btn btn-outline">Post a task</button>
            <button class="btn btn-primary">Learn more</button>
        </div>

        <div class="search-container">
            <div class="search-wrapper">
                <input 
                    type="text" 
                    class="search-input" 
                    placeholder="Search task by city or postal code"
                    aria-label="Search tasks"
                >
                <span class="search-icon" aria-hidden="true">
                    <span class="material-symbols-outlined">arrow_forward_ios</span>
                </span>
            </div>
            <a href="#" class="location-link">
                <span class="material-symbols-outlined" aria-hidden="true">explore_nearby</span>
                or use current location
            </a>
        </div>
    </section>

    <!-- Mobile Navigation Overlay – smaller list, compact sign-in, reduced close -->
    <div class="nav-overlay" id="navOverlay" aria-hidden="true">
        <div class="nav-container">
            <div class="nav-header">
                <button class="close-btn" id="closeBtn" aria-label="Close menu">
                    <span class="material-symbols-outlined" aria-hidden="true">close</span>
                </button>
            </div>
            
            <button class="signin-btn">Sign in</button>
            
            <div class="nav-links">
                <a href="#" class="nav-link">About</a>
                <a href="#" class="nav-link">How it works</a>
                <a href="#" class="nav-link">Safety</a>
                <a href="#" class="nav-link">Pricing</a>
                <a href="#" class="nav-link">Post a task</a>
                <a href="#" class="nav-link">Find a task</a>
            </div>
            <hr class="nav-divider" aria-hidden="true">
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            const annBar = document.getElementById('announcementBar');
            const closeAnnBtn = document.getElementById('closeAnnouncementBtn');
            if (annBar && closeAnnBtn) {
                closeAnnBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    annBar.style.display = 'none';
                });
            }

            const menuBtn = document.getElementById('menuBtn');
            const navOverlay = document.getElementById('navOverlay');
            const closeBtn = document.getElementById('closeBtn');
            
            if (menuBtn && navOverlay && closeBtn) {
                menuBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    navOverlay.classList.add('active');
                    navOverlay.setAttribute('aria-hidden', 'false');
                    document.body.style.overflow = 'hidden';
                    document.body.style.position = 'fixed';
                    document.body.style.width = '100%';
                    menuBtn.setAttribute('aria-expanded', 'true');
                });
                
                function closeMenu() {
                    navOverlay.classList.remove('active');
                    navOverlay.setAttribute('aria-hidden', 'true');
                    document.body.style.overflow = '';
                    document.body.style.position = '';
                    document.body.style.width = '';
                    menuBtn.setAttribute('aria-expanded', 'false');
                }
                
                closeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    closeMenu();
                });
                
                navOverlay.addEventListener('click', function(e) {
                    if (e.target === navOverlay) {
                        closeMenu();
                    }
                });
                
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Escape' && navOverlay.classList.contains('active')) {
                        closeMenu();
                    }
                });
            }

            const desktopCta = document.querySelector('.desktop-cta-btn');
            if (desktopCta) {
                desktopCta.addEventListener('click', function() {
                    console.log('Get started clicked');
                });
            }
        })();
    </script>
</body>
</html>
