<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream Black · Header</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: white;
            min-height: 100vh;
        }

        .site-header {
            background-color: #FF286F;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0;
        }

        .logo-container {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            height: 100%;
            margin-left: 48px;
        }

        .brand-logo {
            display: block;
            height: 65px;
            width: auto;
            object-fit: contain;
            object-position: left center;
        }

        .hamburger {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
            border-radius: 12px;
            transition: background 0.15s ease;
            margin-right: 48px;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 300;
            font-style: normal;
            font-size: 48px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
            color: #FFFCF5;
        }

        .hamburger:hover {
            background-color: rgba(255, 252, 245, 0.1);
        }

        @media (max-width: 480px) {
            .logo-container {
                margin-left: 24px;
            }
            .hamburger {
                margin-right: 24px;
            }
            .brand-logo {
                height: 55px;
            }
            .material-symbols-outlined {
                font-size: 42px;
            }
        }

        .hero {
            background-color: white;
            width: 100%;
            padding: 80px 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 1rem;
            max-width: 800px;
        }

        .hero p {
            font-size: 1.25rem;
            color: #4a4a4a;
            max-width: 600px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .hero {
                padding: 60px 24px;
            }
            .hero h1 {
                font-size: 2.25rem;
            }
            .hero p {
                font-size: 1.125rem;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img  
                class="brand-logo"
                src="Cream Black Typography Loop Brand Logo (500 x 180 px).png" 
                alt="Cream Black Typography Loop Brand Logo"
                onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22200%22%20height%3D%2265%22%20viewBox%3D%220%200%20200%2065%22%3E%3Crect%20width%3D%22200%22%20height%3D%2265%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2212%22%20y%3D%2244%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2224%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
            >
        </div>

        <button class="hamburger" aria-label="Menu" aria-expanded="false">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </header>

    <section class="hero">
        <h1>Cream Black Loop</h1>
        <p>Typography meets bold design. Clean, modern, and unmistakably pink.</p>
    </section>

    <script>
        (function() {
            const hamburgerBtn = document.querySelector('.hamburger');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function(e) {
                    const expanded = this.getAttribute('aria-expanded') === 'true' ? false : true;
                    this.setAttribute('aria-expanded', expanded);
                });
            }
        })();
    </script>
</body>
</html>
