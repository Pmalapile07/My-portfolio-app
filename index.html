<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cream Black · Hero</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ✅ FIXED: Proper Material Symbols load -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400&display=swap" rel="stylesheet">

<style>
@font-face {
    font-family: 'Unbounded';
    src: url('Unbounded-Regular.ttf') format('truetype');
    font-weight: 400;
    font-display: swap;
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Roboto',sans-serif;
    background:#fff;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ---------------- HERO ---------------- */

.hero{
    width:100%;
    max-width:1200px;
    padding:70px 24px 40px 24px;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    margin-left:auto;
    margin-right:auto;
}

.hero h1{
    font-family:'Unbounded',sans-serif;
    font-size:clamp(2.75rem,9vw,4.75rem);
    color:#045B92;
    line-height:1.2;
    margin-bottom:1rem;
}

.hero-subhead{
    font-size:1.125rem;
    color:#045B92;
    max-width:700px;
    margin-bottom:1.5rem;
}

/* -------- BUTTON GROUP -------- */

.button-group{
    display:flex;
    gap:0.5rem;
    margin-bottom:0.75rem;
    flex-wrap:wrap;
    width:100%;
    max-width:700px;
}

.btn{
    padding:0.875rem 1.5rem;
    border-radius:5px;
    font-size:1.125rem;
    cursor:pointer;
    border:2px solid;
    text-decoration:none;
    flex:1;
    min-width:140px;
    text-align:center;
}

.btn-outline{
    background:transparent;
    border-color:#045B92;
    color:#045B92;
}

.btn-primary{
    background:#FF286F;
    border-color:#FF286F;
    color:white;
}

/* -------- SEARCH -------- */

.search-container{
    width:100%;
    max-width:700px;
}

.search-wrapper{
    position:relative;
    width:100%;
}

.search-input{
    width:100%;
    padding:1rem 2rem;
    border:2px solid #045B92;
    border-radius:5px;
    font-size:1rem;
}

.search-icon{
    position:absolute;
    right:1.5rem;
    top:50%;
    transform:translateY(-50%);
}

/* -------- ICON FIX -------- */

.material-symbols-outlined{
    font-family:'Material Symbols Outlined';
    font-weight:400;
    font-style:normal;
    font-size:28px;
    line-height:1;
    display:inline-block;
    white-space:nowrap;
    direction:ltr;
}

/* -------- DESKTOP CENTER FIX -------- */

@media (min-width:1024px){

    /* ONLY center buttons + search on desktop */
    .button-group{
        justify-content:center;
        align-items:center;
        margin-left:auto;
        margin-right:auto;
    }

    .search-container{
        margin-left:auto;
        margin-right:auto;
    }
}

/* -------- MOBILE -------- */

@media (max-width:768px){

    .hero{
        padding:60px 20px 30px 20px;
    }

    .btn{
        font-size:1rem;
    }

    .search-input{
        font-size:0.9375rem;
    }
}
</style>
</head>

<body>

<section class="hero">
    <h1>Turn your<br>free time into<br>paid time</h1>

    <p class="hero-subhead">
        Small jobs around you or remote. Your free time just got an upgrade.
    </p>

    <div class="button-group">
        <button class="btn btn-outline">Post a task</button>
        <button class="btn btn-primary">Learn more</button>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <input 
                type="text"
                class="search-input"
                placeholder="Search task by city or postal code"
            >
            <span class="search-icon">
                <span class="material-symbols-outlined">arrow_forward_ios</span>
            </span>
        </div>
    </div>

</section>

</body>
</html>
