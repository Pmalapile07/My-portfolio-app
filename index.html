<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cream Black · Header</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #fefaf2;
            min-height: 100vh;
        }

        .site-header {
            background-color: #FF286F;
            width: 100%;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .logo-container {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            height: 100%;
        }

        .brand-logo {
            display: block;
            max-height: 130px;
            width: auto;
            object-fit: contain;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: 300;
            font-style: normal;
            font-size: 48px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 48;
            color: #FFFCF5;
        }

        .hamburger {
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            flex-shrink: 0;
            border-radius: 12px;
            transition: background 0.15s ease;
        }

        .hamburger:hover {
            background-color: rgba(255, 252, 245, 0.1);
        }

        @media (max-width: 480px) {
            .site-header {
                padding: 0 24px;
                height: 90px;
            }
            .brand-logo {
                max-height: 76px;
            }
            .material-symbols-outlined {
                font-size: 32px;
            }
        }

        .page-content {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 24px;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="logo-container">
            <img  
                class="brand-logo"
                src="Cream Black Typography Loop Brand Logo.png" 
                alt="Cream Black Typography Loop Brand Logo"
                onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22260%22%20height%3D%2292%22%20viewBox%3D%220%200%20260%2092%22%3E%3Crect%20width%3D%22260%22%20height%3D%2292%22%20fill%3D%22%23FF286F%22%2F%3E%3Ctext%20x%3D%2224%22%20y%3D%2258%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2230%22%20font-weight%3D%22500%22%20fill%3D%22%23FFFCF5%22%3ECream%20Black%20Loop%3C%2Ftext%3E%3C%2Fsvg%3E';"
            >
        </div>

        <button class="hamburger" aria-label="Menu" aria-expanded="false">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </header>

    <main class="page-content">
        <h1>Cream Black Loop header</h1>
        <p>Background #FF286F · Material Symbols outlined menu · Logo enlarged</p>
    </main>

    <script>
        (function() {
            const hamburgerBtn = document.querySelector('.hamburger');
            if (hamburgerBtn) {
                hamburgerBtn.addEventListener('click', function(e) {
                    const expanded = this.getAttribute('aria-expanded') === 'true' ? false : true;
                    this.setAttribute('aria-expanded', expanded);
                });
            }
        })();
    </script>
</body>
</html>
