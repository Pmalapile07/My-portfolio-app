<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #f8fafd;
            min-height: 100vh;
            color: #1e293b;
        }

        /* Header - Pink matching login button */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 3rem; /* Increased padding for desktop */
            background: #FF286F;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(255, 40, 111, 0.2);
        }

        .header-content {
            max-width: 1400px; /* Wider for desktop */
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            height: 70px; /* Increased significantly */
            width: auto;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .logo img {
            height: 100%;
            width: auto;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .debug-toggle {
            background: white;
            color: #FF286F;
            border: none;
            padding: 0.75rem 1.5rem; /* Larger for desktop */
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .debug-toggle:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.05);
        }

        .debug-panel {
            position: fixed;
            top: 100px;
            right: 3rem;
            background: #1e293b;
            color: #94a3b8;
            padding: 1.5rem;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.85rem;
            max-width: 500px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            border-left: 4px solid #FF286F;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .debug-panel.show {
            display: block;
        }

        .debug-error {
            color: #FF286F;
        }

        .debug-success {
            color: #10b981;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8rem 2rem 2rem; /* More padding for desktop */
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            padding: 3rem; /* More padding for desktop */
            width: 100%;
            max-width: 500px; /* Slightly wider for desktop */
            box-shadow: 0 20px 60px rgba(4, 91, 146, 0.15);
            border: 1px solid rgba(4, 91, 146, 0.1);
        }

        /* Desktop-specific adjustments */
        @media (min-width: 1024px) {
            .auth-card {
                padding: 3.5rem;
                max-width: 520px;
            }
            
            .form-group input {
                padding: 1rem 1.5rem;
                font-size: 1rem;
            }
            
            .auth-button {
                padding: 1.2rem;
                font-size: 1.1rem;
            }
        }

        .auth-tabs {
            display: flex;
            gap: 2.5rem; /* More gap for desktop */
            margin-bottom: 2.5rem;
            border-bottom: 2px solid rgba(4, 91, 146, 0.1);
            padding-bottom: 0.75rem;
        }

        .auth-tab {
            font-size: 1.2rem; /* Larger for desktop */
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
            padding: 0.5rem 0;
            position: relative;
            transition: color 0.2s;
        }

        .auth-tab.active {
            color: #045B92;
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -0.75rem;
            left: 0;
            right: 0;
            height: 3px;
            background: #FF286F;
            border-radius: 3px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 2rem; /* More spacing for desktop */
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #045B92;
            font-weight: 600;
            font-size: 0.95rem; /* Slightly larger */
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid rgba(4, 91, 146, 0.15);
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
            background: #f8fafd;
        }

        .form-group input:focus {
            border-color: #FF286F;
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 40, 111, 0.1);
        }

        .form-group input.error {
            border-color: #FF286F;
            background: rgba(255, 40, 111, 0.02);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94a3b8;
            font-size: 1.5rem !important;
        }

        .toggle-password:hover {
            color: #FF286F;
        }

        .error-message {
            color: #FF286F;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        /* Role Selector - Text Only */
        .role-selector {
            display: flex;
            gap: 1.5rem; /* More gap for desktop */
            margin-top: 0.75rem;
        }

        .role-option {
            flex: 1;
            cursor: pointer;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-card {
            border: 2px solid rgba(4, 91, 146, 0.15);
            border-radius: 12px;
            padding: 1.5rem 1rem; /* More padding */
            text-align: center;
            transition: all 0.2s;
            background: #f8fafd;
        }

        .role-option input[type="radio"]:checked + .role-card {
            border-color: #FF286F;
            background: white;
            box-shadow: 0 4px 12px rgba(255, 40, 111, 0.1);
        }

        .role-title {
            font-weight: 700;
            color: #045B92;
            font-size: 1.1rem; /* Larger for desktop */
            margin-bottom: 0.5rem;
        }

        .role-desc {
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .auth-button {
            width: 100%;
            padding: 1.2rem; /* Larger for desktop */
            background: #FF286F;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem; /* Larger for desktop */
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 2rem;
        }

        .auth-button:hover {
            background: #d61e5b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 40, 111, 0.2);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth-button.loading {
            color: transparent;
            position: relative;
        }

        .auth-button.loading::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            top: 50%;
            left: 50%;
            margin-left: -12px;
            margin-top: -12px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.75rem;
        }

        .forgot-password a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
            font-weight: 500;
        }

        .forgot-password a:hover {
            color: #FF286F;
        }

        .terms-text {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.6;
        }

        .terms-text a {
            color: #FF286F;
            text-decoration: none;
            font-weight: 600;
        }

        .terms-text a:hover {
            text-decoration: underline;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            z-index: 1000;
            display: none;
            animation: slideUp 0.3s ease;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
        }

        .toast.show {
            display: block;
        }

        .toast.error {
            background: #ef4444;
        }

        /* Responsive for mobile */
        @media (max-width: 768px) {
            .header {
                padding: 1rem 1.5rem;
            }
            
            .logo {
                height: 45px;
            }
            
            .auth-card {
                padding: 2rem;
            }
            
            .auth-tabs {
                gap: 1.5rem;
            }
            
            .auth-tab {
                font-size: 1rem;
            }
            
            .role-card {
                padding: 1rem;
            }
            
            .role-title {
                font-size: 0.95rem;
            }
            
            .role-desc {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .header {
                padding: 0.75rem 1rem;
            }
            
            .logo {
                height: 35px;
            }
            
            .debug-toggle {
                padding: 0.5rem 1rem;
                font-size: 0.85rem;
            }
            
            .auth-card {
                padding: 1.5rem;
            }
            
            .role-selector {
                flex-direction: column;
                gap: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header - Logo now clickable -->
    <header class="header">
        <div class="header-content">
            <div class="logo" onclick="window.location.href='/index.html'">
                <img src="Cream Black Typography Loop Brand Logo (500 x 180 px).png" alt="TaskMart" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span style="display: none; font-weight: 700; color: white; font-size: 1.8rem;">TaskMart</span>
            </div>
            <button class="debug-toggle" id="debugBtn">Debug</button>
        </div>
    </header>

    <!-- Debug Panel -->
    <div class="debug-panel" id="debugPanel"></div>

    <!-- Main Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Tabs - Now "Login" and "Sign Up" -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Login</div>
                <div class="auth-tab" data-tab="signup">Sign Up</div>
            </div>

            <!-- Login Form -->
            <form class="auth-form active" id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" value="pmalapile07@gmail.com">
                    <div class="error-message" id="loginEmailError"></div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="loginPassword" placeholder="••••••••" value="password123">
                        <span class="material-symbols-outlined toggle-password" id="toggleLoginPassword">visibility_off</span>
                    </div>
                    <div class="error-message" id="loginPasswordError"></div>
                </div>

                <div class="forgot-password">
                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="auth-button" id="loginBtn">Log In</button>
            </form>

            <!-- Signup Form - Without Icons -->
            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signupName" placeholder="Pearl Malapile">
                    <div class="error-message" id="signupNameError"></div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signupEmail" placeholder="your@email.com">
                    <div class="error-message" id="signupEmailError"></div>
                </div>

                <div class="form-group">
                    <label>I want to:</label>
                    <div class="role-selector">
                        <label class="role-option">
                            <input type="radio" name="role" value="poster" checked>
                            <div class="role-card">
                                <div class="role-title">Get Help</div>
                                <div class="role-desc">Post tasks</div>
                            </div>
                        </label>
                        <label class="role-option">
                            <input
