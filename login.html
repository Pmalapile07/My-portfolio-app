<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;800&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(4, 91, 146, 0.15);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            background: #045B92;
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .auth-header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .auth-header .material-symbols-outlined {
            font-size: 48px !important;
            color: white;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 50%;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid rgba(4, 91, 146, 0.1);
            background: white;
        }

        .auth-tab {
            flex: 1;
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: rgba(4, 91, 146, 0.5);
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .auth-tab.active {
            color: #FF286F;
            border-bottom-color: #FF286F;
        }

        .auth-form-container {
            padding: 2rem;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #045B92;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid rgba(4, 91, 146, 0.1);
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #FF286F;
            box-shadow: 0 0 0 4px rgba(255, 40, 111, 0.1);
        }

        .form-group input.error {
            border-color: #FF286F;
            background-color: rgba(255, 40, 111, 0.02);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(4, 91, 146, 0.5);
        }

        .toggle-password:hover {
            color: #FF286F;
        }

        .error-message {
            color: #FF286F;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        .auth-button {
            width: 100%;
            padding: 1rem;
            background: #FF286F;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        .auth-button:hover {
            background: #d61e5b;
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
        }

        .forgot-password a {
            color: #045B92;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .forgot-password a:hover {
            opacity: 1;
            color: #FF286F;
        }

        .terms-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(4, 91, 146, 0.5);
        }

        .terms-text a {
            color: #FF286F;
            text-decoration: none;
        }

        .demo-credentials {
            background: rgba(4, 91, 146, 0.05);
            border-radius: 8px;
            padding: 1rem;
            margin-top: 1.5rem;
        }

        .demo-credentials p {
            color: #045B92;
            font-size: 0.8rem;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .demo-credentials code {
            display: block;
            color: #FF286F;
            font-size: 0.75rem;
            background: white;
            padding: 0.5rem;
            border-radius: 4px;
            border: 1px solid rgba(4, 91, 146, 0.1);
            margin-bottom: 0.25rem;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(4, 91, 146, 0.1);
            border-top-color: #FF286F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="material-symbols-outlined">task_alt</span>
                <h1>Welcome to TaskMart</h1>
                <p>Connect with trusted helpers in your area</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Log In</div>
                <div class="auth-tab" data-tab="signup">Sign Up</div>
            </div>

            <!-- Forms Container -->
            <div class="auth-form-container">
                <!-- LOGIN FORM -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" value="pearl@example.com">
                        <div class="error-message" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="loginPassword" placeholder="••••••••" value="password123">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('loginPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-button" id="loginBtn">Log In</button>

                    <div class="demo-credentials">
                        <p>✨ Demo credentials (pre-filled)</p>
                        <code>Email: pearl@example.com</code>
                        <code>Password: password123</code>
                    </div>
                </form>

                <!-- SIGNUP FORM -->
                <form class="auth-form" id="signupForm">
                    <div class="form-group">
                        <label>Full name</label>
                        <input type="text" id="signupName" placeholder="Pearl Smith">
                        <div class="error-message" id="signupNameError"></div>
                    </div>

                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com">
                        <div class="error-message" id="signupEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupPassword" placeholder="••••••••">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('signupPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="signupPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label>Confirm password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupConfirmPassword" placeholder="••••••••">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('signupConfirmPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="signupConfirmError"></div>
                    </div>

                    <button type="submit" class="auth-button" id="signupBtn">Create Account</button>

                    <div class="terms-text">
                        By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <script>
        // Toggle between login and signup tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // Update tabs
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                // Show corresponding form
                const tabName = this.dataset.tab;
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                document.getElementById(tabName + 'Form').classList.add('active');
                
                // Clear errors
                clearAllErrors();
            });
        });

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        // Clear all error messages
        function clearAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('visible');
            });
            document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
        }

        // Show error
        function showError(inputId, message) {
            const input = document.getElementById(inputId);
            const errorEl = document.getElementById(inputId + 'Error');
            input.classList.add('error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('visible');
            }
        }

        // Validate email
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // Simulate API call
        function simulateApiCall(delay = 1500) {
            return new Promise(resolve => setTimeout(resolve, delay));
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAllErrors();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            let isValid = true;

            // Validation
            if (!email) {
                showError('loginEmail', 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('loginEmail', 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showError('loginPassword', 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showError('loginPassword', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            document.getElementById('loadingOverlay').classList.add('active');

            // Simulate login API call
            await simulateApiCall();

            // Demo credentials check
            if (email === 'pearl@example.com' && password === 'password123') {
                // Create user session
                const user = {
                    name: 'Pearl Smith',
                    email: email,
                    initials: 'PS',
                    loggedIn: true,
                    loginTime: new Date().toISOString()
                };
                
                // Save to localStorage
                localStorage.setItem('taskmart_user', JSON.stringify(user));
                
                // Check if we were redirected from task planner
                const returnUrl = sessionStorage.getItem('returnUrl') || '/task-planner.html';
                sessionStorage.removeItem('returnUrl');
                
                // Redirect
                window.location.href = returnUrl;
            } else {
                // Hide loading
                document.getElementById('loadingOverlay').classList.remove('active');
                showError('loginEmail', 'Invalid email or password');
            }
        });

        // Handle Signup
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAllErrors();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            let isValid = true;

            // Validation
            if (!name) {
                showError('signupName', 'Name is required');
                isValid = false;
            } else if (name.length < 2) {
                showError('signupName', 'Name must be at least 2 characters');
                isValid = false;
            }

            if (!email) {
                showError('signupEmail', 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showError('signupEmail', 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showError('signupPassword', 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showError('signupPassword', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showError('signupConfirm', 'Passwords do not match');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            document.getElementById('loadingOverlay').classList.add('active');

            // Simulate signup API call
            await simulateApiCall();

            // Create new user (in real app, this would be saved to database)
            const user = {
                name: name,
                email: email,
                initials: name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase(),
                loggedIn: true,
                signupTime: new Date().toISOString()
            };
            
            // Save to localStorage
            localStorage.setItem('taskmart_user', JSON.stringify(user));
            
            // Check if we were redirected from task planner
            const returnUrl = sessionStorage.getItem('returnUrl') || '/task-planner.html';
            sessionStorage.removeItem('returnUrl');
            
            // Redirect
            window.location.href = returnUrl;
        });

        // Handle Forgot Password
        document.getElementById('forgotPassword').addEventListener('click', function(e) {
            e.preventDefault();
            alert('Password reset link would be sent to your email. (Demo functionality)');
        });

        // Check if user is already logged in
        const user = localStorage.getItem('taskmart_user');
        if (user) {
            // If already logged in and trying to access login page, redirect back
            const returnUrl = sessionStorage.getItem('returnUrl');
            if (returnUrl) {
                sessionStorage.removeItem('returnUrl');
                window.location.href = returnUrl;
            }
        }

        // Check for return URL in query parameters
        const urlParams = new URLSearchParams(window.location.search);
        const returnTo = urlParams.get('returnTo');
        if (returnTo) {
            sessionStorage.setItem('returnUrl', returnTo);
        }
    </script>
</body>
</html>
