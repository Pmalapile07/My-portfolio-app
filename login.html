<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Sign in</title>
    
    <!-- Fonts - Keeping Manrope, removing the ugly ones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Firebase Web SDK (safe for frontend) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    
    <style>
        /* Clean, modern aesthetic - no more ugly fonts */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: #1a1a1a;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 24px;
            padding: 2rem;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1a1a1a;
        }

        .tab-container {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: #f5f5f5;
            padding: 0.25rem;
            border-radius: 12px;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .tab.active {
            background: white;
            color: #1a1a1a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            color: #4a4a4a;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-icon .material-symbols-outlined {
            font-size: 20px;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 3rem;
            background: #f5f5f5;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #1a1a1a;
            background: white;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
        }

        .role-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .role-option {
            flex: 1;
            padding: 0.75rem;
            background: #f5f5f5;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            color: #666;
        }

        .role-option.selected {
            background: #1a1a1a;
            border-color: #1a1a1a;
            color: white;
        }

        .skills-container {
            margin-bottom: 1.5rem;
            display: none;
        }

        .skills-container.show {
            display: block;
        }

        .skills-wrapper {
            position: relative;
        }

        .skills-input {
            width: 100%;
            padding: 0.875rem;
            background: #f5f5f5;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-align: left;
        }

        .skills-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .skills-dropdown.active {
            display: block;
        }

        .skill-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .skill-item:hover {
            background: #f5f5f5;
        }

        .selected-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .selected-skill-tag {
            background: #1a1a1a;
            color: white;
            padding: 0.4rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selected-skill-tag .material-symbols-outlined {
            font-size: 16px;
            cursor: pointer;
        }

        .phone-wrapper {
            position: relative;
        }

        .country-code {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #4a4a4a;
            font-weight: 500;
            z-index: 2;
        }

        .phone-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 4rem;
            background: #f5f5f5;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
        }

        .auth-btn {
            width: 100%;
            padding: 0.875rem;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }

        .auth-btn:hover {
            background: #333;
        }

        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .social-auth {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }

        .social-btn {
            width: 100%;
            padding: 0.75rem;
            background: white;
            border: 1px solid #eaeaea;
            border-radius: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #1a1a1a;
        }

        .social-btn:hover {
            background: #f5f5f5;
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #eaeaea;
        }

        .divider span {
            padding: 0 1rem;
        }

        .error-message {
            background: #fee;
            color: #e00;
            padding: 0.875rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #e4f5e4;
            color: #0a5;
            padding: 0.875rem;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .switch-auth {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
        }

        .switch-auth a {
            color: #1a1a1a;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }

        .auth-btn.loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-area">
            <span class="logo-text">taskmart</span>
        </div>

        <!-- Tabs -->
        <div class="tab-container">
            <div class="tab active" id="loginTab">Sign in</div>
            <div class="tab" id="signupTab">Sign up</div>
        </div>

        <!-- Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Login Form -->
        <form id="loginForm">
            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">mail</span>
                    </span>
                    <input type="email" id="loginEmail" class="form-input" placeholder="hello@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                Sign in
            </button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-auth">
                <button type="button" class="social-btn" onclick="handleGoogleSignIn()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="handleAppleSignIn()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.5-2.09-.52-3.24 0-1.44.66-2.2.47-3.12-.38-3.78-4.04-3.21-10.21 1.16-10.43 1.22.03 2.06.64 2.77.68 1.06-.2 2.07-.82 3.18-.74 1.41.12 2.48.67 3.18 1.66-2.84 1.7-2.36 5.43.47 6.48-.4 1.06-.93 2.08-1.92 2.75zM12.03 9.35c-.18-2.07 1.57-3.85 3.45-4.03.36 2.06-1.65 3.93-3.45 4.03z"/>
                    </svg>
                    Apple
                </button>
            </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label>Full name</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">person</span>
                    </span>
                    <input type="text" id="signupName" class="form-input" placeholder="Alex Chen" required>
                </div>
            </div>

            <div class="form-group">
                <label>Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">mail</span>
                    </span>
                    <input type="email" id="signupEmail" class="form-input" placeholder="hello@example.com" required>
                </div>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <div class="phone-wrapper">
                    <span class="country-code">+27</span>
                    <input type="tel" id="signupPhone" class="phone-input" placeholder="12 345 6789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">
                        <span class="material-symbols-outlined">visibility</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>I want to</label>
                <div class="role-selector">
                    <div class="role-option selected" id="posterRole">Find help</div>
                    <div class="role-option" id="helperRole">Become a helper</div>
                </div>
            </div>

            <!-- Skills (for helpers) -->
            <div class="skills-container" id="skillsContainer">
                <label>What can you do?</label>
                <div class="skills-wrapper">
                    <input type="text" class="skills-input" id="skillsInput" placeholder="Select skills" readonly>
                    <div class="skills-dropdown" id="skillsDropdown"></div>
                </div>
                <div class="selected-skills" id="selectedSkills"></div>
            </div>

            <button type="submit" class="auth-btn" id="signupBtn">
                Create account
            </button>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-auth">
                <button type="button" class="social-btn" onclick="handleGoogleSignUp()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Google
                </button>
                <button type="button" class="social-btn" onclick="handleAppleSignUp()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.5-2.09-.52-3.24 0-1.44.66-2.2.47-3.12-.38-3.78-4.04-3.21-10.21 1.16-10.43 1.22.03 2.06.64 2.77.68 1.06-.2 2.07-.82 3.18-.74 1.41.12 2.48.67 3.18 1.66-2.84 1.7-2.36 5.43.47 6.48-.4 1.06-.93 2.08-1.92 2.75zM12.03 9.35c-.18-2.07 1.57-3.85 3.45-4.03.36 2.06-1.65 3.93-3.45 4.03z"/>
                    </svg>
                    Apple
                </button>
            </div>
        </form>

        <div class="switch-auth" id="switchText">
            <span>Don't have an account? <a>Sign up</a></span>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG (NO SECRETS - SAFE FOR FRONTEND) =====
        const firebaseConfig = {
            apiKey: "AIzaSyB...", // Get this from Firebase Console > Project Settings
            authDomain: "taskmartapp-74d6b.firebaseapp.com",
            projectId: "taskmartapp-74d6b",
            storageBucket: "taskmartapp-74d6b.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abc123def456"
        };

        // Initialize Firebase (this is safe - these are public config values)
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // ===== STATE =====
        let selectedRole = 'poster';
        let selectedSkills = [];

        // ===== SKILL OPTIONS =====
        const skillOptions = [
            "Cleaning", "Plumbing", "Electrical", "Moving", "Gardening",
            "Painting", "Furniture Assembly", "Delivery", "Shopping",
            "Pet Care", "Babysitting", "Elderly Care", "Tutoring",
            "Web Development", "Graphic Design", "Photography",
            "Car Wash", "Event Setup", "Handyman", "Other"
        ];

        // ===== UI HELPERS =====
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // ===== TAB SWITCHING =====
        document.getElementById('loginTab').addEventListener('click', () => switchTab('login'));
        document.getElementById('signupTab').addEventListener('click', () => switchTab('signup'));

        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const switchText = document.getElementById('switchText');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                switchText.innerHTML = `Don't have an account? <a>Sign up</a>`;
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
                switchText.innerHTML = `Already have an account? <a>Sign in</a>`;
            }
            
            // Re-attach listeners
            switchText.querySelector('a').addEventListener('click', () => 
                switchTab(tab === 'login' ? 'signup' : 'login')
            );
        }

        // ===== ROLE SELECTION =====
        document.getElementById('posterRole').addEventListener('click', () => selectRole('poster'));
        document.getElementById('helperRole').addEventListener('click', () => selectRole('helper'));

        function selectRole(role) {
            selectedRole = role;
            const posterRole = document.getElementById('posterRole');
            const helperRole = document.getElementById('helperRole');
            const skillsContainer = document.getElementById('skillsContainer');
            
            if (role === 'poster') {
                posterRole.classList.add('selected');
                helperRole.classList.remove('selected');
                skillsContainer.classList.remove('show');
            } else {
                helperRole.classList.add('selected');
                posterRole.classList.remove('selected');
                skillsContainer.classList.add('show');
                initSkillsDropdown();
            }
        }

        // ===== SKILLS DROPDOWN =====
        function initSkillsDropdown() {
            const input = document.getElementById('skillsInput');
            const dropdown = document.getElementById('skillsDropdown');

            if (dropdown.children.length === 0) {
                dropdown.innerHTML = skillOptions.map(skill => 
                    `<div class="skill-item">${skill}</div>`
                ).join('');

                input.addEventListener('click', () => {
                    dropdown.classList.add('active');
                });

                dropdown.querySelectorAll('.skill-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const skill = item.textContent;
                        if (!selectedSkills.includes(skill)) {
                            selectedSkills.push(skill);
                            updateSelectedSkills();
                        }
                        dropdown.classList.remove('active');
                    });
                });

                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.classList.remove('active');
                    }
                });
            }
        }

        function updateSelectedSkills() {
            const container = document.getElementById('selectedSkills');
            container.innerHTML = selectedSkills.map(skill => 
                `<span class="selected-skill-tag">
                    ${skill}
                    <span class="material-symbols-outlined" onclick="removeSkill('${skill}')">close</span>
                </span>`
            ).join('');
        }

        window.removeSkill = function(skill) {
            selectedSkills = selectedSkills.filter(s => s !== skill);
            updateSelectedSkills();
        };

        // ===== AUTH FUNCTIONS =====
        async function callBackend(endpoint, data) {
            const token = await auth.currentUser?.getIdToken();
            const response = await fetch(`https://your-backend.onrender.com${endpoint}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(data)
            });
            return response.json();
        }

        // Email/Password Signup
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            
            const btn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            // Validate
            if (selectedRole === 'helper' && selectedSkills.length === 0) {
                errorDiv.textContent = 'Please select at least one skill';
                errorDiv.classList.add('show');
                return;
            }

            // Show loading
            btn.innerHTML = '<span class="loading-spinner"></span> Creating...';
            btn.disabled = true;
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                // Create Firebase user
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update profile
                await user.updateProfile({ displayName: name });

                // Send user data to your backend (which uses Admin SDK)
                await callBackend('/api/users/create', {
                    uid: user.uid,
                    name,
                    email,
                    phone: `+27${phone.replace(/\s/g, '')}`,
                    role: selectedRole,
                    skills: selectedSkills,
                    photoURL: null
                });

                // Store in localStorage
                localStorage.setItem('taskmart_user', JSON.stringify({
                    uid: user.uid,
                    name,
                    email,
                    role: selectedRole,
                    skills: selectedSkills
                }));
                localStorage.setItem('taskmart_token', await user.getIdToken());

                successDiv.textContent = 'Account created! Redirecting...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = selectedRole === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                btn.innerHTML = 'Create account';
                btn.disabled = false;
            }
        });

        // Email/Password Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            btn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
            btn.disabled = true;
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;

                // Get user data from backend (where Admin SDK is used)
                const userData = await callBackend('/api/users/me', {});

                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());

                successDiv.textContent = 'Welcome back! Redirecting...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = userData.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                btn.innerHTML = 'Sign in';
                btn.disabled = false;
            }
        });

        // Google Sign In
        window.handleGoogleSignIn = window.handleGoogleSignUp = async function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Check if user exists in backend
                let userData;
                try {
                    userData = await callBackend('/api/users/me', {});
                } catch {
                    // New user - create via backend
                    userData = await callBackend('/api/users/create', {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        phone: null,
                        role: 'poster', // Default, can be changed later
                        skills: [],
                        photoURL: user.photoURL
                    });
                }

                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());

                successDiv.textContent = 'Success! Redirecting...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = userData.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            }
        };

        // Apple Sign In
        window.handleAppleSignIn = window.handleAppleSignUp = async function() {
            const provider = new firebase.auth.OAuthProvider('apple.com');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;

                // Same flow as Google
                let userData;
                try {
                    userData = await callBackend('/api/users/me', {});
                } catch {
                    userData = await callBackend('/api/users/create', {
                        uid: user.uid,
                        name: user.displayName || 'Apple User',
                        email: user.email,
                        phone: null,
                        role: 'poster',
                        skills: [],
                        photoURL: user.photoURL
                    });
                }

                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());

                successDiv.textContent = 'Success! Redirecting...';
                successDiv.classList.add('show');

                setTimeout(() => {
                    window.location.href = userData.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
                }, 1000);

            } catch (error) {
                console.error(error);
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
            }
        };

        // Check existing session
        auth.onAuthStateChanged(async (user) => {
            if (user && window.location.pathname.includes('login')) {
                const userData = JSON.parse(localStorage.getItem('taskmart_user') || '{}');
                if (userData.role) {
                    window.location.href = userData.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
                }
            }
        });
    </script>
</body>
</html>
