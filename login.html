<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login · TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            padding: 2rem 1.5rem;
            background: white;
            position: relative;
            z-index: 10;
            margin: 2rem auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-family: 'Codec Cold News', sans-serif;
            font-size: 2.5rem;
            color: #000;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .tab-container {
            display: flex;
            margin-bottom: 2rem;
            background: #f0f0f0;
            padding: 0.25rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            background: transparent;
        }

        .tab.active {
            background: #000;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #000;
            font-size: 0.8rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            transition: all 0.2s;
            outline: none;
            color: rgba(0,0,0,0.8);
        }

        .form-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .form-input::placeholder {
            color: rgba(0,0,0,0.4);
            font-weight: 200;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
        }

        .password-toggle:hover {
            color: #000;
        }

        .password-toggle .material-symbols-outlined {
            font-size: 20px !important;
        }

        .role-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .role-option {
            flex: 1;
            padding: 0.85rem 0.5rem;
            background: #f0f0f0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-weight: 300;
            color: #666;
        }

        .role-option.selected {
            background: #000;
            color: white;
        }

        /* Skills dropdown for helpers */
        .skills-container {
            margin-bottom: 1.5rem;
            display: none;
        }

        .skills-container.show {
            display: block;
        }

        .skills-label {
            display: block;
            color: #000;
            font-size: 0.8rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .skills-wrapper {
            position: relative;
        }

        .skills-input {
            width: 100%;
            padding: 1rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            cursor: pointer;
            color: rgba(0,0,0,0.8);
        }

        .skills-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .skills-dropdown-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }

        .skills-dropdown-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .skills-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .skills-dropdown.active {
            display: block;
        }

        .skill-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-family: 'Manrope', sans-serif;
            font-weight: 300;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .skill-item:last-child {
            border-bottom: none;
        }

        .skill-item:hover {
            background-color: #f5f5f5;
        }

        .selected-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .selected-skill-tag {
            background: #000;
            color: white;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 200;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selected-skill-tag .material-symbols-outlined {
            font-size: 14px !important;
            cursor: pointer;
            color: white;
        }

        .phone-wrapper {
            position: relative;
        }

        .country-code {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
            font-weight: 300;
            font-size: 0.95rem;
            z-index: 2;
        }

        .phone-input {
            width: 100%;
            padding: 1rem 1rem 1rem 4.5rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            outline: none;
        }

        .phone-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .phone-input::placeholder {
            color: rgba(0,0,0,0.4);
            font-weight: 200;
        }

        .remember-forgot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #000;
        }

        .remember-me label {
            color: #666;
            font-size: 0.85rem;
            font-weight: 200;
            cursor: pointer;
        }

        .forgot-password {
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 200;
        }

        .forgot-password:hover {
            color: #000;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: #000;
            color: white;
            border: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
            font-family: 'Manrope', sans-serif;
        }

        .auth-btn:hover {
            background: #222;
        }

        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.05);
            color: #ef4444;
            padding: 0.75rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-weight: 200;
        }

        .error-message.show {
            display: block;
        }

        .switch-auth {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin-top: 1rem;
            font-weight: 200;
        }

        .switch-auth a {
            color: #000;
            text-decoration: none;
            font-weight: 400;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .switch-auth a:hover {
            border-bottom-color: #000;
        }

        .terms {
            text-align: center;
            color: #999;
            font-size: 0.7rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            font-weight: 200;
        }

        .terms a {
            color: #666;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .terms a:hover {
            border-bottom-color: #666;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .auth-btn .loading-spinner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .auth-btn .loading-spinner .material-symbols-outlined {
            font-size: 20px !important;
            animation: spin 1s linear infinite;
            color: white;
        }

        .auth-btn.loading .btn-text {
            display: none;
        }

        .auth-btn.loading .loading-spinner {
            display: inline-flex !important;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem 1rem;
                margin: 1rem;
            }

            .logo-text {
                font-size: 2rem;
            }

            .role-selector {
                flex-direction: column;
                gap: 0.5rem;
            }
        }

        /* Quick login buttons for testing */
        .quick-login {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .quick-btn {
            background: #f0f0f0;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: 'Manrope', sans-serif;
            font-weight: 300;
        }

        .quick-btn:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-area">
            <span class="logo-text">taskmart</span>
        </div>

        <!-- Tabs -->
        <div class="tab-container">
            <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign in</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign up</div>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Login Form -->
        <form id="loginForm" style="display: block;">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">email</span>
                    </span>
                    <input type="email" id="loginEmail" class="form-input" placeholder="Your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', 'loginToggleIcon')">
                        <span class="material-symbols-outlined" id="loginToggleIcon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password" onclick="showForgotMessage()">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                <span class="btn-text">Sign in</span>
                <span class="loading-spinner" style="display: none;">
                    <span class="material-symbols-outlined">progress_activity</span>
                </span>
            </button>

            <!-- Quick login buttons for testing -->
            <div class="quick-login">
                <button type="button" class="quick-btn" onclick="quickLogin('poster')">Quick Poster</button>
                <button type="button" class="quick-btn" onclick="quickLogin('helper')">Quick Helper</button>
            </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label for="signupName">Full name</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">person</span>
                    </span>
                    <input type="text" id="signupName" class="form-input" placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">email</span>
                    </span>
                    <input type="email" id="signupEmail" class="form-input" placeholder="Your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPhone">Phone number</label>
                <div class="phone-wrapper">
                    <span class="country-code">+27</span>
                    <input type="tel" id="signupPhone" class="phone-input" placeholder="12 345 6789" pattern="[0-9\s]{9,}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', 'signupToggleIcon')">
                        <span class="material-symbols-outlined" id="signupToggleIcon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>I want to</label>
                <div class="role-selector">
                    <div class="role-option selected" id="posterRole" onclick="selectRole('poster')">
                        Find help
                    </div>
                    <div class="role-option" id="helperRole" onclick="selectRole('helper')">
                        Become a helper
                    </div>
                </div>
            </div>

            <!-- Skills dropdown for helpers (hidden by default) -->
            <div class="skills-container" id="skillsContainer">
                <label class="skills-label">What can you do?</label>
                <div class="skills-wrapper">
                    <input type="text" class="skills-input" id="skillsInput" placeholder="Select skills" readonly>
                    <span class="skills-dropdown-icon">
                        <span class="material-symbols-outlined">expand_more</span>
                    </span>
                    <div class="skills-dropdown" id="skillsDropdown"></div>
                </div>
                <div class="selected-skills" id="selectedSkills"></div>
            </div>

            <button type="submit" class="auth-btn" id="signupBtn">
                <span class="btn-text">Create account</span>
                <span class="loading-spinner" style="display: none;">
                    <span class="material-symbols-outlined">progress_activity</span>
                </span>
            </button>
        </form>

        <!-- Switch between forms -->
        <div class="switch-auth" id="switchText">
            <span id="switchMessage">Don't have an account? <a onclick="switchTab('signup')">Sign up</a></span>
        </div>

        <!-- Terms of Service -->
        <div class="terms">
            By continuing, you agree to taskmart's <a href="#">Terms of service</a> and <a href="#">Privacy policy</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = ''; // Same server
        let selectedRole = 'poster';
        let selectedSkills = [];

        // ===== TASK SUGGESTIONS DATA =====
        const skillOptions = [
            "laundry", "ironing", "grocery shopping", "cooking / meal prep", "cleaning / tidying",
            "dog walking / pet care", "babysitting / child care", "elderly care / companionship",
            "plumbing (minor fixes)", "electrical work (minor)", "furniture assembly", "gardening / lawn care",
            "painting walls / touch-ups", "moving / lifting heavy objects", "website setup",
            "software troubleshooting", "device setup (phones/laptops)", "graphic design / logo design",
            "social media support", "picking up parcels", "delivery of small items", "car washing / cleaning",
            "running personal errands", "house sitting", "pet sitting", "event setup / decorating",
            "photography / videography", "tutoring / lessons", "moving / relocation help",
            "assembling electronics", "minor car maintenance", "package wrapping / gift prep",
            "shopping for gifts / items", "plant care / watering", "cleaning windows", "packing / unpacking",
            "minor sewing / clothing repair", "furniture moving", "appliance setup", "data entry / admin support",
            "email / inbox management", "basic accounting / bookkeeping", "errand planning / scheduling",
            "toy / small item repair", "basic sewing / mending", "recycling / trash pickup",
            "inventory check / organizing", "pet training / basic commands", "tech device troubleshooting",
            "gift wrapping / decoration", "small handyman tasks"
        ];

        // Toggle password visibility
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Forgot password message
        function showForgotMessage() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Password reset would be sent to your email.';
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        // Switch between login and signup tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const switchText = document.getElementById('switchText');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                switchText.innerHTML = `Don't have an account? <a onclick="switchTab('signup')">Sign up</a>`;
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
                switchText.innerHTML = `Already have an account? <a onclick="switchTab('login')">Sign in</a>`;
            }
        }

        // Select role for signup
        function selectRole(role) {
            selectedRole = role;
            const posterRole = document.getElementById('posterRole');
            const helperRole = document.getElementById('helperRole');
            const skillsContainer = document.getElementById('skillsContainer');
            
            if (role === 'poster') {
                posterRole.classList.add('selected');
                helperRole.classList.remove('selected');
                skillsContainer.classList.remove('show');
            } else {
                helperRole.classList.add('selected');
                posterRole.classList.remove('selected');
                skillsContainer.classList.add('show');
                initializeSkillsDropdown();
            }
        }

        // Initialize skills dropdown
        function initializeSkillsDropdown() {
            const skillsInput = document.getElementById('skillsInput');
            const skillsDropdown = document.getElementById('skillsDropdown');

            skillsDropdown.innerHTML = skillOptions.map(skill => 
                `<div class="skill-item" data-skill="${skill}">${skill.charAt(0).toUpperCase() + skill.slice(1)}</div>`
            ).join('');

            skillsInput.addEventListener('click', () => {
                skillsDropdown.classList.add('active');
            });

            document.querySelectorAll('.skill-item').forEach(item => {
                item.addEventListener('click', function() {
                    const skill = this.dataset.skill;
                    if (!selectedSkills.includes(skill)) {
                        selectedSkills.push(skill);
                        updateSelectedSkills();
                    }
                    skillsDropdown.classList.remove('active');
                });
            });

            document.addEventListener('click', (e) => {
                if (!skillsInput.contains(e.target) && !skillsDropdown.contains(e.target)) {
                    skillsDropdown.classList.remove('active');
                }
            });
        }

        // Update selected skills display
        function updateSelectedSkills() {
            const selectedSkillsDiv = document.getElementById('selectedSkills');
            selectedSkillsDiv.innerHTML = selectedSkills.map(skill => 
                `<span class="selected-skill-tag">
                    ${skill}
                    <span class="material-symbols-outlined" onclick="removeSkill('${skill}')">close</span>
                </span>`
            ).join('');
        }

        // Remove skill
        function removeSkill(skill) {
            selectedSkills = selectedSkills.filter(s => s !== skill);
            updateSelectedSkills();
        }

        // ===== REAL LOGIN USING YOUR BACKEND =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Store user data and token
                localStorage.setItem('taskmart_user', JSON.stringify(data.user));
                localStorage.setItem('taskmart_token', data.token);

                // Show success message
                errorDiv.textContent = 'Login successful! Redirecting...';
                errorDiv.style.color = '#28a745';
                errorDiv.classList.add('show');

                // Redirect based on role
                setTimeout(() => {
                    if (data.user.role === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // ===== REAL SIGNUP USING YOUR BACKEND =====
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            
            // Format phone number with +27
            const formattedPhone = `+27${phone.replace(/\s/g, '')}`;
            
            const signupBtn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            signupBtn.classList.add('loading');
            signupBtn.disabled = true;
            errorDiv.classList.remove('show');
            
            // Validate skills for helper
            if (selectedRole === 'helper' && selectedSkills.length === 0) {
                errorDiv.textContent = 'Please select at least one skill';
                errorDiv.classList.add('show');
                signupBtn.classList.remove('loading');
                signupBtn.disabled = false;
                return;
            }
            
            try {
                const userData = { 
                    name, 
                    email, 
                    password, 
                    phone: formattedPhone,
                    role: selectedRole,
                    skills: selectedRole === 'helper' ? selectedSkills : []
                };

                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(userData)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Registration failed');
                }

                // Store user data and token
                localStorage.setItem('taskmart_user', JSON.stringify(data.user));
                localStorage.setItem('taskmart_token', data.token);

                // Show success message
                errorDiv.textContent = 'Account created successfully! Redirecting...';
                errorDiv.style.color = '#28a745';
                errorDiv.classList.add('show');

                // Redirect based on role
                setTimeout(() => {
                    if (selectedRole === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);

            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                signupBtn.classList.remove('loading');
                signupBtn.disabled = false;
            }
        });

        // ===== QUICK LOGIN FOR TESTING (still fake, but now with proper role routing) =====
        function quickLogin(role) {
            const userData = {
                name: role === 'helper' ? 'Helper User' : 'Poster User',
                email: role === 'helper' ? 'helper@example.com' : 'poster@example.com',
                role: role,
                verified: true,
                profileImage: 'https://via.placeholder.com/150',
                emailVerified: true,
                adminVerified: true,
                phone: '+27721234567',
                skills: role === 'helper' ? ['cleaning', 'laundry'] : [],
                createdAt: new Date().toISOString()
            };

            const token = btoa(`${userData.email}:${Date.now()}`);

            localStorage.setItem('taskmart_user', JSON.stringify(userData));
            localStorage.setItem('taskmart_token', token);

            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Quick login successful! Redirecting...';
            errorDiv.style.color = '#28a745';
            errorDiv.classList.add('show');

            setTimeout(() => {
                if (role === 'helper') {
                    window.location.href = '/helper-dashboard.html';
                } else {
                    window.location.href = '/task-planner.html';
                }
            }, 1000);
        }

        // Check if already logged in
        function checkExistingSession() {
            const user = localStorage.getItem('taskmart_user');
            const token = localStorage.getItem('taskmart_token');
            
            if (user && token) {
                const userData = JSON.parse(user);
                if (userData.role === 'helper') {
                    window.location.href = '/helper-dashboard.html';
                } else {
                    window.location.href = '/task-planner.html';
                }
            }
        }

        checkExistingSession();
    </script>
