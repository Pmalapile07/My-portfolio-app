<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        h2 {
            color: #045B92;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #64748b;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .input-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: #FF286F;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #94a3b8;
        }

        .password-toggle:hover {
            color: #FF286F;
        }

        .remember-forgot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #FF286F;
        }

        .remember-me label {
            color: #64748b;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .forgot-password {
            color: #FF286F;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #FF286F, #d61e5b);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1.5rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 40, 111, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #ef4444;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .register-link {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }

        .register-link a {
            color: #FF286F;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            margin-top: 2rem;
            padding: 1rem;
            background: #f8fafc;
            border-radius: 12px;
        }

        .demo-credentials p {
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }

        .demo-credentials small {
            display: block;
            color: #94a3b8;
            font-size: 0.75rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 1.5rem;
            }

            .logo-text {
                font-size: 1.75rem;
            }

            h2 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <span class="logo-text">taskmart</span>
        </div>

        <h2>Welcome back!</h2>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">email</span>
                    </span>
                    <input type="email" id="email" class="form-input" placeholder="your@email.com" value="pmalapile07@gmail.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" value="admin123" required>
                    <button type="button" class="password-toggle" onclick="togglePassword()">
                        <span class="material-symbols-outlined" id="passwordToggleIcon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember" checked>
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="btn-text">Sign In</span>
                <span class="loading-spinner" style="display: none;">
                    <span class="material-symbols-outlined" style="animation: spin 1s linear infinite;">progress_activity</span>
                </span>
            </button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="/register.html">Sign up</a>
        </div>

        <div class="demo-credentials">
            <p>Demo Credentials:</p>
            <small>Email: pmalapile07@gmail.com</small>
            <small>Password: admin123</small>
        </div>
    </div>

    <style>
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-btn .loading-spinner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .login-btn .loading-spinner .material-symbols-outlined {
            font-size: 20px !important;
        }

        .login-btn.loading .btn-text {
            display: none;
        }

        .login-btn.loading .loading-spinner {
            display: inline-flex !important;
        }
    </style>

    <script>
        const API_BASE_URL = 'https://taskmartapp.onrender.com';

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Handle form submission
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            
            // Show loading state
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            errorDiv.classList.remove('show');
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // ===== THIS IS WHERE WE STORE BOTH USER AND TOKEN =====
                // Store user data
                localStorage.setItem('taskmart_user', JSON.stringify(data.user));
                
                // Store authentication token (CRITICAL FOR UPLOADS!)
                localStorage.setItem('taskmart_token', data.token);
                
                // If "Remember me" is checked, we can also store with expiry
                if (remember) {
                    // Token already stored in localStorage (persists)
                } else {
                    // For session only - we could use sessionStorage, but we'll keep as is
                    // The token will still be removed when browser closes if user doesn't check remember
                }

                // Add a small delay to show success state
                setTimeout(() => {
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                }, 500);
                
            } catch (error) {
                // Show error message
                errorDiv.textContent = error.message;
                errorDiv.classList.add('show');
                
                // Reset button state
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Check if user is already logged in
        function checkExistingSession() {
            const user = localStorage.getItem('taskmart_user');
            const token = localStorage.getItem('taskmart_token');
            
            if (user && token) {
                // Optional: Auto-redirect to dashboard
                // window.location.href = '/dashboard.html';
            }
        }

        // Run on page load
        checkExistingSession();

        // Add demo credentials quickly (optional)
        document.querySelectorAll('.demo-credentials small').forEach(el => {
            el.addEventListener('click', function() {
                const text = this.textContent;
                if (text.includes('Email:')) {
                    document.getElementById('email').value = text.replace('Email: ', '');
                } else if (text.includes('Password:')) {
                    document.getElementById('password').value = text.replace('Password: ', '');
                }
            });
        });
    </script>
</body>
</html>
