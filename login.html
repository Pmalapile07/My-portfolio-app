<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Sign in</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<!-- Phosphor Icons -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --black: #000000;
        --white: #ffffff;
        --grey: #e9e9e9;
        --grey-text: #6b6b6b;
        --error: #d93025;
        --success: #1a7a40;
        --radius: 14px;
    }

    html, body { height: 100%; }

    body {
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--white);
        color: var(--black);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
    }

    /* ── HEADER ── */
    .site-header {
        background: var(--black);
        width: 100%;
        padding: 0 1.5rem;
        height: 64px;
        display: flex;
        align-items: center;
        flex-shrink: 0;
    }

    .site-header a { display: flex; align-items: center; text-decoration: none; }

    .site-header img {
        height: 36px;
        width: auto;
        display: block;
        object-fit: contain;
    }

    /* ── PAGE BODY ── */
    .page-body {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 2.5rem 1.5rem 2rem;
        max-width: 440px;
        width: 100%;
        margin: 0 auto;
    }

    /* ── TABS ── */
    .tab-container {
        display: flex;
        gap: 0.4rem;
        margin-bottom: 2rem;
        background: var(--grey);
        padding: 0.25rem;
        border-radius: 12px;
    }

    .tab {
        flex: 1;
        text-align: center;
        padding: 0.75rem;
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--grey-text);
        cursor: pointer;
        border-radius: 10px;
        transition: all 0.2s;
        user-select: none;
    }

    .tab.active {
        background: var(--white);
        color: var(--black);
        box-shadow: 0 1px 6px rgba(0,0,0,0.08);
    }

    /* ── FORM GROUPS ── */
    .form-group { margin-bottom: 1.1rem; }

    .field-label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--grey-text);
        margin-bottom: 0.5rem;
    }

    .field-hint {
        display: block;
        font-size: 0.78rem;
        font-weight: 400;
        color: #b0b0b0;
        margin-top: 0.35rem;
    }

    /* ── INPUTS ── */
    .field-input {
        width: 100%;
        padding: 0.95rem 1.1rem;
        background: var(--grey);
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        font-family: 'Manrope', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        color: var(--black);
        outline: none;
        transition: border-color 0.18s, background 0.18s;
        -webkit-appearance: none;
    }

    .field-input::placeholder { color: #b0b0b0; font-weight: 400; }
    .field-input:focus { border-color: var(--black); background: var(--white); }

    .input-wrapper { position: relative; }
    .input-wrapper .field-input { padding-right: 3rem; }

    .toggle-pw {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #aaa;
        display: flex;
        align-items: center;
    }

    .toggle-pw .material-symbols-outlined { font-size: 20px; }

    /* ── PHONE ── */
    .phone-wrapper { position: relative; }

    .country-code {
        position: absolute;
        left: 1.1rem;
        top: 50%;
        transform: translateY(-50%);
        font-weight: 700;
        font-size: 1rem;
        color: var(--black);
        z-index: 2;
    }

    .phone-input {
        width: 100%;
        padding: 0.95rem 1.1rem 0.95rem 3.8rem;
        background: var(--grey);
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        font-family: 'Manrope', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        color: var(--black);
        outline: none;
        transition: border-color 0.18s, background 0.18s;
        -webkit-appearance: none;
    }

    .phone-input:focus { border-color: var(--black); background: var(--white); }

    /* ── ROLE CARDS ── */
    .role-cards {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
    }

    .role-card {
        flex: 1;
        padding: 1.1rem 0.75rem;
        background: var(--grey);
        border: 2px solid transparent;
        border-radius: var(--radius);
        text-align: center;
        cursor: pointer;
        transition: all 0.2s;
        user-select: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.4rem;
    }

    .role-card:hover { border-color: #ccc; }

    .role-card.selected {
        background: var(--black);
        border-color: var(--black);
        color: var(--white);
    }

    .role-card i {
        font-size: 1.6rem;
        display: block;
        color: var(--grey-text);
        transition: color 0.2s;
    }

    .role-card.selected i { color: var(--white); }

    .role-card-title {
        font-size: 0.92rem;
        font-weight: 700;
        display: block;
    }

    .role-card-sub {
        font-size: 0.75rem;
        font-weight: 400;
        color: var(--grey-text);
        display: block;
        line-height: 1.4;
    }

    .role-card.selected .role-card-sub { color: #ccc; }

    /* ── SKILLS ── */
    .skills-wrapper { position: relative; }

    .skills-input {
        width: 100%;
        padding: 0.95rem 1.1rem;
        background: var(--grey);
        border: 1.5px solid transparent;
        border-radius: var(--radius);
        font-family: 'Manrope', sans-serif;
        font-size: 1rem;
        font-weight: 500;
        color: #b0b0b0;
        cursor: pointer;
        text-align: left;
        outline: none;
    }

    .skills-dropdown {
        position: absolute;
        top: calc(100% + 4px);
        left: 0; right: 0;
        background: var(--white);
        border: 1.5px solid var(--grey);
        border-radius: var(--radius);
        max-height: 220px;
        overflow-y: auto;
        z-index: 1000;
        display: none;
        box-shadow: 0 12px 30px -6px rgba(0,0,0,0.12);
    }

    .skills-dropdown.active { display: block; }

    .skill-item {
        padding: 0.75rem 1.1rem;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background 0.15s;
    }

    .skill-item:hover { background: var(--grey); }

    .selected-skills { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.65rem; }

    .selected-skill-tag {
        background: var(--black);
        color: var(--white);
        padding: 0.35rem 0.7rem;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
    }

    .selected-skill-tag .material-symbols-outlined { font-size: 15px; cursor: pointer; }

    /* ── PRIMARY BUTTON ── */
    .btn-primary {
        width: 100%;
        padding: 1rem;
        background: var(--black);
        color: var(--white);
        border: none;
        border-radius: var(--radius);
        font-family: 'Manrope', sans-serif;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.18s, transform 0.1s;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-primary:hover { background: #222; }
    .btn-primary:active { transform: scale(0.985); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ── DIVIDER ── */
    .divider { display: flex; align-items: center; margin: 1.5rem 0; }
    .divider-line { flex: 1; height: 1px; background: var(--grey); }

    .divider-or {
        width: 32px; height: 32px;
        border: 1.5px solid var(--grey);
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.7rem; font-weight: 700;
        color: var(--grey-text);
        background: var(--white);
        flex-shrink: 0;
    }

    /* ── SOCIAL ── */
    .social-btns { display: flex; flex-direction: column; gap: 0.75rem; }

    .btn-social {
        width: 100%;
        padding: 0.9rem 1.1rem;
        background: var(--white);
        border: 1.5px solid var(--grey);
        border-radius: var(--radius);
        font-family: 'Manrope', sans-serif;
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--black);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        transition: border-color 0.18s, background 0.18s;
    }

    .btn-social:hover { border-color: #aaa; background: #fafafa; }
    .btn-social svg { width: 20px; height: 20px; flex-shrink: 0; }

    /* ── DISCLAIMER ── */
    .disclaimer {
        margin-top: 1.75rem;
        font-size: 0.75rem;
        font-weight: 400;
        color: #9a9a9a;
        line-height: 1.6;
        text-align: center;
    }

    .disclaimer a {
        color: var(--black);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    /* ── MESSAGES ── */
    .error-message {
        background: #fff0f0;
        color: var(--error);
        padding: 0.85rem 1rem;
        border-radius: var(--radius);
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: none;
    }
    .error-message.show { display: block; }

    .success-message {
        background: #edfaf3;
        color: var(--success);
        padding: 0.85rem 1rem;
        border-radius: var(--radius);
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 1rem;
        display: none;
    }
    .success-message.show { display: block; }

    /* ── SPINNER ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-spinner {
        display: inline-block;
        width: 18px; height: 18px;
        border: 2px solid rgba(255,255,255,0.35);
        border-radius: 50%;
        border-top-color: white;
        animation: spin 0.75s linear infinite;
    }

    .section-divider {
        height: 1px;
        background: var(--grey);
        margin: 1.25rem 0;
    }

    @media (max-width: 400px) {
        .page-body { padding: 2rem 1.1rem 1.5rem; }
    }
</style>


</head>
<body>


<header class="site-header">
    <a href="/index.html">
        <img
            src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Cream%20Black%20Typography%20Loop%20Brand%20Logo%20(500%20x%20180%20px).png"
            alt="TaskMart"
        >
    </a>
</header>

<main class="page-body">

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <!-- TABS -->
    <div class="tab-container">
        <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign in</div>
        <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign up</div>
    </div>

    <!-- ════════════════════════════
         SIGN IN FORM
    ════════════════════════════ -->
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label class="field-label" for="loginEmail">Email</label>
            <input type="email" id="loginEmail" class="field-input" placeholder="hello@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
            <label class="field-label" for="loginPassword">Password</label>
            <div class="input-wrapper">
                <input type="password" id="loginPassword" class="field-input" placeholder="••••••••" required autocomplete="current-password">
                <button type="button" class="toggle-pw" onclick="togglePassword('loginPassword', this)">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    </form>

    <!-- ════════════════════════════
         SIGN UP FORM
    ════════════════════════════ -->
    <form id="signupForm" style="display:none;" onsubmit="handleSignup(event)">

        <!-- Role selection — always first -->
        <label class="field-label" style="margin-bottom: 0.65rem;">I want to</label>
        <div class="role-cards">
            <div class="role-card selected" id="posterCard" onclick="selectRole('poster')">
                <i class="ph ph-check-square-offset" style="font-size:2rem;"></i>
                <span class="role-card-title">Post tasks</span>
                <span class="role-card-sub">I need help getting things done</span>
            </div>
            <div class="role-card" id="helperCard" onclick="selectRole('helper')">
                <i class="ph ph-handshake" style="font-size:2rem;"></i>
                <span class="role-card-title">Help others</span>
                <span class="role-card-sub">I want to earn by doing tasks</span>
            </div>
        </div>

        <!-- Helper only: Skills -->
        <div id="skillsSection" style="display:none;">
            <div class="form-group">
                <label class="field-label">What can you do?</label>
                <div class="skills-wrapper">
                    <input type="text" class="skills-input" id="skillsInput" placeholder="Select your skills" readonly>
                    <div class="skills-dropdown" id="skillsDropdown"></div>
                </div>
                <span class="field-hint">Only list skills you can confidently deliver — you can update this later.</span>
                <div class="selected-skills" id="selectedSkills"></div>
            </div>
            <div class="section-divider"></div>
        </div>

        <!-- Shared fields -->
        <div class="form-group">
            <label class="field-label" for="signupName">Full name</label>
            <input type="text" id="signupName" class="field-input" placeholder="John Smith" required autocomplete="name">
        </div>

        <div class="form-group">
            <label class="field-label" for="signupEmail">Email</label>
            <input type="email" id="signupEmail" class="field-input" placeholder="hello@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
            <label class="field-label" for="signupPhone">Cell phone number</label>
            <div class="phone-wrapper">
                <span class="country-code">+27</span>
                <input type="tel" id="signupPhone" class="phone-input" placeholder="12 345 6789" required autocomplete="tel">
            </div>
        </div>

        <!-- Helper only: Address -->
        <div class="form-group" id="addressGroup" style="display:none;">
            <label class="field-label" for="signupAddress">Address</label>
            <input type="text" id="signupAddress" class="field-input" placeholder="123 Main St, Cape Town" autocomplete="street-address">
        </div>

        <div class="form-group">
            <label class="field-label" for="signupPassword">Password</label>
            <div class="input-wrapper">
                <input type="password" id="signupPassword" class="field-input" placeholder="••••••••" required autocomplete="new-password">
                <button type="button" class="toggle-pw" onclick="togglePassword('signupPassword', this)">
                    <span class="material-symbols-outlined">visibility</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-primary" id="signupBtn">Create account</button>
    </form>

    <!-- DIVIDER + SOCIAL -->
    <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-or">or</div>
        <div class="divider-line"></div>
    </div>

    <div class="social-btns">
        <button class="btn-social" onclick="handleGoogleSignIn()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <p class="disclaimer">
        By continuing, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>
        and allow TaskMart to contact you about your account.
    </p>

</main>

<script>
    // ===== FIREBASE CONFIG =====
    const firebaseConfig = {
        apiKey: "AIzaSyBi_srk36131SlYbhclVqlqsqobJJ917Pg",
        authDomain: "taskmartapp-74d6b.firebaseapp.com",
        databaseURL: "https://taskmartapp-74d6b-default-rtdb.firebaseio.com",
        projectId: "taskmartapp-74d6b",
        storageBucket: "taskmartapp-74d6b.firebasestorage.app",
        messagingSenderId: "52910279328",
        appId: "1:52910279328:web:f49ed0d56a09e5dead17c5",
        measurementId: "G-Z8SPLR0HSL"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const database = firebase.database();

    // ===== SKILLS LIST =====
    const taskSkills = [
        "laundry", "ironing", "house cleaning", "dish washing",
        "grocery shopping", "parcel pickup", "delivery of small items", "running errands", "queue for me",
        "gardening", "lawn mowing", "yard cleanup", "trash removal",
        "babysitting", "elderly companionship", "pet care", "dog walking",
        "car washing",
        "furniture assembly",
        "minor plumbing", "minor electrical", "painting walls", "fix home appliances",
        "install / fix burglar bars", "jojo tank installation", "pest control",
        "gas/petrol bottle refill",
        "in-house hair installation", "haircut at home", "manicure / pedicure at home", "makeup at home"
    ];

    // ===== STATE =====
    let selectedRole = 'poster';
    let selectedSkills = [];

    // ===== UI HELPERS =====
    function showError(msg) {
        const el = document.getElementById('errorMessage');
        el.textContent = msg;
        el.classList.add('show');
    }

    function showSuccess(msg) {
        const el = document.getElementById('successMessage');
        el.textContent = msg;
        el.classList.add('show');
    }

    function clearMessages() {
        document.getElementById('errorMessage').classList.remove('show');
        document.getElementById('successMessage').classList.remove('show');
    }

    window.togglePassword = function(inputId, btn) {
        const input = document.getElementById(inputId);
        const icon = btn.querySelector('.material-symbols-outlined');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    };

    // ===== TABS =====
    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('signupTab').classList.toggle('active', !isLogin);
        document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
        document.getElementById('signupForm').style.display = isLogin ? 'none' : 'block';
        clearMessages();
    }

    // ===== ROLE SELECTION =====
    window.selectRole = function(role) {
        selectedRole = role;
        document.getElementById('posterCard').classList.toggle('selected', role === 'poster');
        document.getElementById('helperCard').classList.toggle('selected', role === 'helper');

        const skillsSection = document.getElementById('skillsSection');
        const addressGroup = document.getElementById('addressGroup');

        if (role === 'helper') {
            skillsSection.style.display = 'block';
            addressGroup.style.display = 'block';
            initSkillsDropdown();
        } else {
            skillsSection.style.display = 'none';
            addressGroup.style.display = 'none';
        }
    };

    // ===== LOGIN =====
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearMessages();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('loginBtn');

        btn.innerHTML = '<span class="loading-spinner"></span> Signing in...';
        btn.disabled = true;

        try {
            const userCredential = await auth.signInWithEmailAndPassword(email, password);
            const user = userCredential.user;

            const snapshot = await database.ref('users/' + user.uid).once('value');
            const userData = snapshot.val();
            if (!userData) throw new Error('User data not found in database.');

            showSuccess('Welcome back! Redirecting...');
            setTimeout(function() {
                window.location.href = userData.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
            }, 1000);

        } catch (error) {
            showError(error.message);
            btn.innerHTML = 'Sign in';
            btn.disabled = false;
        }
    });

    // ===== SIGNUP =====
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        clearMessages();

        const name = document.getElementById('signupName').value;
        const email = document.getElementById('signupEmail').value;
        const phone = document.getElementById('signupPhone').value;
        const address = document.getElementById('signupAddress').value;
        const password = document.getElementById('signupPassword').value;
        const btn = document.getElementById('signupBtn');

        if (selectedRole === 'helper' && selectedSkills.length === 0) {
            showError('Please select at least one skill.');
            return;
        }

        btn.innerHTML = '<span class="loading-spinner"></span> Creating...';
        btn.disabled = true;

        try {
            const userCredential = await auth.createUserWithEmailAndPassword(email, password);
            const user = userCredential.user;

            await database.ref('users/' + user.uid).set({
                uid: user.uid,
                name: name,
                email: email,
                phone: '+27' + phone.replace(/\s/g, ''),
                address: address,
                role: selectedRole,
                skills: selectedRole === 'helper' ? selectedSkills : [],
                createdAt: new Date().toISOString()
            });

            // TODO: uncomment once email verification is configured in Firebase
            // await user.sendEmailVerification();

            showSuccess('Account created! Please check your email to verify your account.');
            setTimeout(function() {
                window.location.href = selectedRole === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
            }, 2000);

        } catch (error) {
            showError(error.message);
            btn.innerHTML = 'Create account';
            btn.disabled = false;
        }
    });

    // ===== GOOGLE SIGN IN =====
    window.handleGoogleSignIn = function() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider)
            .then(async function(result) {
                const user = result.user;
                const snap = await database.ref('users/' + user.uid).once('value');
                if (!snap.exists()) {
                    await database.ref('users/' + user.uid).set({
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        phone: '',
                        address: '',
                        role: 'poster',
                        skills: [],
                        createdAt: new Date().toISOString()
                    });
                }
                const data = (await database.ref('users/' + user.uid).once('value')).val();
                window.location.href = data.role === 'helper' ? '/helper-dashboard.html' : '/task-planner.html';
            })
            .catch(function(error) {
                if (error.code !== 'auth/popup-closed-by-user') {
                    showError(error.message);
                }
            });
    };

    // ===== SKILLS DROPDOWN =====
    function initSkillsDropdown() {
        const input = document.getElementById('skillsInput');
        const dropdown = document.getElementById('skillsDropdown');
        if (dropdown.children.length > 0) return;

        dropdown.innerHTML = taskSkills.map(function(skill) {
            return '<div class="skill-item">' + skill + '</div>';
        }).join('');

        input.addEventListener('click', function() {
            dropdown.classList.add('active');
        });

        dropdown.querySelectorAll('.skill-item').forEach(function(item) {
            item.addEventListener('click', function() {
                const skill = item.textContent;
                if (!selectedSkills.includes(skill)) {
                    selectedSkills.push(skill);
                    updateSelectedSkills();
                }
                dropdown.classList.remove('active');
            });
        });

        document.addEventListener('click', function(e) {
            if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('active');
            }
        });
    }

    function updateSelectedSkills() {
        const container = document.getElementById('selectedSkills');
        container.innerHTML = selectedSkills.map(function(skill) {
            return '<span class="selected-skill-tag">' + skill +
                '<span class="material-symbols-outlined" onclick="removeSkill(\'' + skill + '\')">close</span>' +
                '</span>';
        }).join('');
    }

    window.removeSkill = function(skill) {
        selectedSkills = selectedSkills.filter(function(s) { return s !== skill; });
        updateSelectedSkills();
    };
</script>
