<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login · TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
    
    <!-- Firebase SDK (only the Auth module, which is safe for frontend) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <style>
        /* --- Your existing styles remain exactly the same --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 460px;
            padding: 2rem 1.5rem;
            background: white;
            position: relative;
            z-index: 10;
            margin: 2rem auto;
        }

        .logo-area {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .logo-text {
            font-family: 'Codec Cold News', sans-serif;
            font-size: 2.5rem;
            color: #000;
            letter-spacing: 1px;
            text-transform: lowercase;
        }

        .tab-container {
            display: flex;
            margin-bottom: 2rem;
            background: #f0f0f0;
            padding: 0.25rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            font-weight: 500;
            color: #999;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
            background: transparent;
        }

        .tab.active {
            background: #000;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #000;
            font-size: 0.8rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .input-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            transition: all 0.2s;
            outline: none;
            color: rgba(0,0,0,0.8);
        }

        .form-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .form-input::placeholder {
            color: rgba(0,0,0,0.4);
            font-weight: 200;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
        }

        .password-toggle:hover {
            color: #000;
        }

        .password-toggle .material-symbols-outlined {
            font-size: 20px !important;
        }

        .role-selector {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .role-option {
            flex: 1;
            padding: 0.85rem 0.5rem;
            background: #f0f0f0;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            font-weight: 300;
            color: #666;
        }

        .role-option.selected {
            background: #000;
            color: white;
        }

        /* Skills dropdown for helpers */
        .skills-container {
            margin-bottom: 1.5rem;
            display: none;
        }

        .skills-container.show {
            display: block;
        }

        .skills-label {
            display: block;
            color: #000;
            font-size: 0.8rem;
            font-weight: 300;
            margin-bottom: 0.5rem;
        }

        .skills-wrapper {
            position: relative;
        }

        .skills-input {
            width: 100%;
            padding: 1rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            cursor: pointer;
            color: rgba(0,0,0,0.8);
        }

        .skills-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .skills-dropdown-icon {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }

        .skills-dropdown-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .skills-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .skills-dropdown.active {
            display: block;
        }

        .skill-item {
            padding: 0.75rem 1rem;
            cursor: pointer;
            font-family: 'Manrope', sans-serif;
            font-weight: 300;
            color: #333;
            border-bottom: 1px solid #f0f0f0;
            transition: background 0.2s;
        }

        .skill-item:last-child {
            border-bottom: none;
        }

        .skill-item:hover {
            background-color: #f5f5f5;
        }

        .selected-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .selected-skill-tag {
            background: #000;
            color: white;
            padding: 0.4rem 0.75rem;
            font-size: 0.8rem;
            font-weight: 200;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .selected-skill-tag .material-symbols-outlined {
            font-size: 14px !important;
            cursor: pointer;
            color: white;
        }

        .phone-wrapper {
            position: relative;
        }

        .country-code {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #000;
            font-weight: 300;
            font-size: 0.95rem;
            z-index: 2;
        }

        .phone-input {
            width: 100%;
            padding: 1rem 1rem 1rem 4.5rem;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 200;
            outline: none;
        }

        .phone-input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .phone-input::placeholder {
            color: rgba(0,0,0,0.4);
            font-weight: 200;
        }

        .remember-forgot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #000;
        }

        .remember-me label {
            color: #666;
            font-size: 0.85rem;
            font-weight: 200;
            cursor: pointer;
        }

        .forgot-password {
            color: #666;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 200;
        }

        .forgot-password:hover {
            color: #000;
        }

        .auth-btn {
            width: 100%;
            padding: 1rem;
            background: #000;
            color: white;
            border: none;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
            font-family: 'Manrope', sans-serif;
        }

        .auth-btn:hover {
            background: #222;
        }

        .auth-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .social-auth {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            width: 100%;
            padding: 0.85rem;
            background: white;
            border: 1px solid #e0e0e0;
            font-size: 0.95rem;
            font-weight: 400;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Manrope', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            color: #333;
        }

        .social-btn:hover {
            background: #f5f5f5;
        }

        .social-btn.google {
            color: #333;
        }

        .social-btn.apple {
            color: #000;
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #999;
            font-size: 0.8rem;
            margin: 1rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 0.75rem;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.05);
            color: #ef4444;
            padding: 0.75rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-weight: 200;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.05);
            color: #28a745;
            padding: 0.75rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            border: 1px solid rgba(40, 167, 69, 0.2);
            font-weight: 200;
        }

        .success-message.show {
            display: block;
        }

        .switch-auth {
            text-align: center;
            color: #999;
            font-size: 0.85rem;
            margin-top: 1rem;
            font-weight: 200;
        }

        .switch-auth a {
            color: #000;
            text-decoration: none;
            font-weight: 400;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .switch-auth a:hover {
            border-bottom-color: #000;
        }

        .terms {
            text-align: center;
            color: #999;
            font-size: 0.7rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            font-weight: 200;
        }

        .terms a {
            color: #666;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.2s;
        }

        .terms a:hover {
            border-bottom-color: #666;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .auth-btn .loading-spinner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .auth-btn .loading-spinner .material-symbols-outlined {
            font-size: 20px !important;
            animation: spin 1s linear infinite;
            color: white;
        }

        .auth-btn.loading .btn-text {
            display: none;
        }

        .auth-btn.loading .loading-spinner {
            display: inline-flex !important;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 1.5rem 1rem;
                margin: 1rem;
            }

            .logo-text {
                font-size: 2rem;
            }

            .role-selector {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo-area">
            <span class="logo-text">taskmart</span>
        </div>

        <!-- Tabs -->
        <div class="tab-container">
            <div class="tab active" id="loginTab" onclick="switchTab('login')">Sign in</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign up</div>
        </div>

        <!-- Error & Success Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- Login Form -->
        <form id="loginForm" style="display: block;">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">email</span>
                    </span>
                    <input type="email" id="loginEmail" class="form-input" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', 'loginToggleIcon')">
                        <span class="material-symbols-outlined" id="loginToggleIcon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                </div>
                <a href="#" class="forgot-password" onclick="showForgotMessage()">Forgot password?</a>
            </div>

            <button type="submit" class="auth-btn" id="loginBtn">
                <span class="btn-text">Sign in</span>
                <span class="loading-spinner" style="display: none;">
                    <span class="material-symbols-outlined">progress_activity</span>
                </span>
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-auth">
                <button type="button" class="social-btn google" onclick="handleGoogleSignIn()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Continue with Google
                </button>
                <button type="button" class="social-btn apple" onclick="handleAppleSignIn()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#000000" d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.5-2.09-.52-3.24 0-1.44.66-2.2.47-3.12-.38-3.78-4.04-3.21-10.21 1.16-10.43 1.22.03 2.06.64 2.77.68 1.06-.2 2.07-.82 3.18-.74 1.41.12 2.48.67 3.18 1.66-2.84 1.7-2.36 5.43.47 6.48-.4 1.06-.93 2.08-1.92 2.75zM12.03 9.35c-.18-2.07 1.57-3.85 3.45-4.03.36 2.06-1.65 3.93-3.45 4.03z"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label for="signupName">Full name</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">person</span>
                    </span>
                    <input type="text" id="signupName" class="form-input" placeholder="John Doe" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">email</span>
                    </span>
                    <input type="email" id="signupEmail" class="form-input" placeholder="your@email.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPhone">Phone number</label>
                <div class="phone-wrapper">
                    <span class="country-code">+27</span>
                    <input type="tel" id="signupPhone" class="phone-input" placeholder="12 345 6789" pattern="[0-9\s]{9,}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">
                        <span class="material-symbols-outlined">lock</span>
                    </span>
                    <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                    <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', 'signupToggleIcon')">
                        <span class="material-symbols-outlined" id="signupToggleIcon">visibility</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>I want to</label>
                <div class="role-selector">
                    <div class="role-option selected" id="posterRole" onclick="selectRole('poster')">
                        Find help
                    </div>
                    <div class="role-option" id="helperRole" onclick="selectRole('helper')">
                        Become a helper
                    </div>
                </div>
            </div>

            <!-- Skills dropdown for helpers (hidden by default) -->
            <div class="skills-container" id="skillsContainer">
                <label class="skills-label">What can you do?</label>
                <div class="skills-wrapper">
                    <input type="text" class="skills-input" id="skillsInput" placeholder="Select skills" readonly>
                    <span class="skills-dropdown-icon">
                        <span class="material-symbols-outlined">expand_more</span>
                    </span>
                    <div class="skills-dropdown" id="skillsDropdown"></div>
                </div>
                <div class="selected-skills" id="selectedSkills"></div>
            </div>

            <button type="submit" class="auth-btn" id="signupBtn">
                <span class="btn-text">Create account</span>
                <span class="loading-spinner" style="display: none;">
                    <span class="material-symbols-outlined">progress_activity</span>
                </span>
            </button>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-auth">
                <button type="button" class="social-btn google" onclick="handleGoogleSignUp()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Sign up with Google
                </button>
                <button type="button" class="social-btn apple" onclick="handleAppleSignUp()">
                    <svg class="social-icon" viewBox="0 0 24 24">
                        <path fill="#000000" d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.09-.5-2.09-.52-3.24 0-1.44.66-2.2.47-3.12-.38-3.78-4.04-3.21-10.21 1.16-10.43 1.22.03 2.06.64 2.77.68 1.06-.2 2.07-.82 3.18-.74 1.41.12 2.48.67 3.18 1.66-2.84 1.7-2.36 5.43.47 6.48-.4 1.06-.93 2.08-1.92 2.75zM12.03 9.35c-.18-2.07 1.57-3.85 3.45-4.03.36 2.06-1.65 3.93-3.45 4.03z"/>
                    </svg>
                    Sign up with Apple
                </button>
            </div>
        </form>

        <!-- Switch between forms -->
        <div class="switch-auth" id="switchText">
            <span id="switchMessage">Don't have an account? <a onclick="switchTab('signup')">Sign up</a></span>
        </div>

        <!-- Terms of Service -->
        <div class="terms">
            By continuing, you agree to taskmart's <a href="#">Terms of service</a> and <a href="#">Privacy policy</a>
        </div>
    </div>

    <script>
        // ===== FIREBASE INITIALIZATION (SAFE FOR FRONTEND) =====
        // No API keys needed! Firebase uses your project's security rules and authentication state.
        const firebaseConfig = {
            projectId: "taskmartapp-74d6b",
            databaseURL: "https://taskmartapp-74d6b-default-rtdb.firebaseio.com"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        // ===== CONFIGURATION =====
        let selectedRole = 'poster';
        let selectedSkills = [];

        // ===== TASK SUGGESTIONS DATA =====
        const skillOptions = [
            "laundry", "ironing", "grocery shopping", "cooking / meal prep", "cleaning / tidying",
            "dog walking / pet care", "babysitting / child care", "elderly care / companionship",
            "plumbing (minor fixes)", "electrical work (minor)", "furniture assembly", "gardening / lawn care",
            "painting walls / touch-ups", "moving / lifting heavy objects", "website setup",
            "software troubleshooting", "device setup (phones/laptops)", "graphic design / logo design",
            "social media support", "picking up parcels", "delivery of small items", "car washing / cleaning",
            "running personal errands", "house sitting", "pet sitting", "event setup / decorating",
            "photography / videography", "tutoring / lessons", "moving / relocation help",
            "assembling electronics", "minor car maintenance", "package wrapping / gift prep",
            "shopping for gifts / items", "plant care / watering", "cleaning windows", "packing / unpacking",
            "minor sewing / clothing repair", "furniture moving", "appliance setup", "data entry / admin support",
            "email / inbox management", "basic accounting / bookkeeping", "errand planning / scheduling",
            "toy / small item repair", "basic sewing / mending", "recycling / trash pickup",
            "inventory check / organizing", "pet training / basic commands", "tech device troubleshooting",
            "gift wrapping / decoration", "small handyman tasks"
        ];

        // Toggle password visibility
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Forgot password message
        function showForgotMessage() {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = 'Password reset would be sent to your email.';
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        // Switch between login and signup tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const switchText = document.getElementById('switchText');

            if (tab === 'login') {
                loginTab.classList.add('active');
                signupTab.classList.remove('active');
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                switchText.innerHTML = `Don't have an account? <a onclick="switchTab('signup')">Sign up</a>`;
            } else {
                signupTab.classList.add('active');
                loginTab.classList.remove('active');
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
                switchText.innerHTML = `Already have an account? <a onclick="switchTab('login')">Sign in</a>`;
            }
        }

        // Select role for signup
        function selectRole(role) {
            selectedRole = role;
            const posterRole = document.getElementById('posterRole');
            const helperRole = document.getElementById('helperRole');
            const skillsContainer = document.getElementById('skillsContainer');
            
            if (role === 'poster') {
                posterRole.classList.add('selected');
                helperRole.classList.remove('selected');
                skillsContainer.classList.remove('show');
            } else {
                helperRole.classList.add('selected');
                posterRole.classList.remove('selected');
                skillsContainer.classList.add('show');
                initializeSkillsDropdown();
            }
        }

        // Initialize skills dropdown
        function initializeSkillsDropdown() {
            const skillsInput = document.getElementById('skillsInput');
            const skillsDropdown = document.getElementById('skillsDropdown');

            if (skillsDropdown.children.length === 0) {
                skillsDropdown.innerHTML = skillOptions.map(skill => 
                    `<div class="skill-item" data-skill="${skill}">${skill.charAt(0).toUpperCase() + skill.slice(1)}</div>`
                ).join('');

                skillsInput.addEventListener('click', () => {
                    skillsDropdown.classList.add('active');
                });

                document.querySelectorAll('.skill-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const skill = this.dataset.skill;
                        if (!selectedSkills.includes(skill)) {
                            selectedSkills.push(skill);
                            updateSelectedSkills();
                        }
                        skillsDropdown.classList.remove('active');
                    });
                });

                document.addEventListener('click', (e) => {
                    if (!skillsInput.contains(e.target) && !skillsDropdown.contains(e.target)) {
                        skillsDropdown.classList.remove('active');
                    }
                });
            }
        }

        // Update selected skills display
        function updateSelectedSkills() {
            const selectedSkillsDiv = document.getElementById('selectedSkills');
            selectedSkillsDiv.innerHTML = selectedSkills.map(skill => 
                `<span class="selected-skill-tag">
                    ${skill}
                    <span class="material-symbols-outlined" onclick="removeSkill('${skill}')">close</span>
                </span>`
            ).join('');
        }

        // Remove skill
        function removeSkill(skill) {
            selectedSkills = selectedSkills.filter(s => s !== skill);
            updateSelectedSkills();
        }

        // ===== FIREBASE AUTH FUNCTIONS =====

        // Email/Password Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            try {
                // Sign in with Firebase
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Get user data from Firebase Database
                const userSnapshot = await database.ref(`users/${user.uid}`).once('value');
                let userData = userSnapshot.val();
                
                if (!userData) {
                    // If no user data in database, create basic profile
                    userData = {
                        uid: user.uid,
                        email: user.email,
                        name: user.displayName || email.split('@')[0],
                        role: 'poster',
                        emailVerified: user.emailVerified,
                        createdAt: new Date().toISOString()
                    };
                    
                    await database.ref(`users/${user.uid}`).set(userData);
                }
                
                // Store in localStorage for app compatibility
                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());
                
                successDiv.textContent = 'Login successful! Redirecting...';
                successDiv.classList.add('show');
                
                // Redirect based on role
                setTimeout(() => {
                    if (userData.role === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = 'Login failed. Please try again.';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Try again later.';
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // Email/Password Signup
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            
            const formattedPhone = `+27${phone.replace(/\s/g, '')}`;
            
            const signupBtn = document.getElementById('signupBtn');
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            signupBtn.classList.add('loading');
            signupBtn.disabled = true;
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');
            
            // Validate skills for helper
            if (selectedRole === 'helper' && selectedSkills.length === 0) {
                errorDiv.textContent = 'Please select at least one skill';
                errorDiv.classList.add('show');
                signupBtn.classList.remove('loading');
                signupBtn.disabled = false;
                return;
            }
            
            try {
                // Create user in Firebase Auth
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // Update profile with display name
                await user.updateProfile({
                    displayName: name
                });
                
                // Create user data object
                const userData = {
                    uid: user.uid,
                    name: name,
                    email: email,
                    phone: formattedPhone,
                    role: selectedRole,
                    skills: selectedRole === 'helper' ? selectedSkills : [],
                    emailVerified: user.emailVerified,
                    createdAt: new Date().toISOString(),
                    profileImage: null,
                    initials: name.split(' ').map(n => n[0]).join('').toUpperCase()
                };
                
                // Save to Firebase Database
                await database.ref(`users/${user.uid}`).set(userData);
                
                // Store in localStorage
                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());
                
                successDiv.textContent = 'Account created successfully! Redirecting...';
                successDiv.classList.add('show');
                
                setTimeout(() => {
                    if (selectedRole === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);

            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = 'Signup failed. Please try again.';
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Email already in use.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password should be at least 6 characters.';
                }
                
                errorDiv.textContent = errorMessage;
                errorDiv.classList.add('show');
                signupBtn.classList.remove('loading');
                signupBtn.disabled = false;
            }
        });

        // Google Sign In
        async function handleGoogleSignIn() {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                provider.addScope('profile');
                provider.addScope('email');
                
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if user exists in database
                const userSnapshot = await database.ref(`users/${user.uid}`).once('value');
                let userData = userSnapshot.val();
                
                if (!userData) {
                    // New user - create basic profile
                    userData = {
                        uid: user.uid,
                        name: user.displayName,
                        email: user.email,
                        role: 'poster',
                        emailVerified: user.emailVerified,
                        profileImage: user.photoURL,
                        initials: user.displayName.split(' ').map(n => n[0]).join('').toUpperCase(),
                        createdAt: new Date().toISOString()
                    };
                    
                    await database.ref(`users/${user.uid}`).set(userData);
                    
                    // Show role selection prompt for new users
                    const role = confirm('Do you want to sign up as a helper? Click OK for Helper, Cancel for Poster');
                    if (role) {
                        userData.role = 'helper';
                        await database.ref(`users/${user.uid}/role`).set('helper');
                    }
                }
                
                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());
                
                successDiv.textContent = 'Login successful! Redirecting...';
                successDiv.classList.add('show');
                
                setTimeout(() => {
                    if (userData.role === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Google sign-in error:', error);
                errorDiv.textContent = 'Google sign-in failed. Please try again.';
                errorDiv.classList.add('show');
            }
        }

        // Google Sign Up (same as sign in for social)
        async function handleGoogleSignUp() {
            await handleGoogleSignIn();
        }

        // Apple Sign In
        async function handleAppleSignIn() {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            try {
                const provider = new firebase.auth.OAuthProvider('apple.com');
                provider.addScope('email');
                provider.addScope('name');
                
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if user exists in database
                const userSnapshot = await database.ref(`users/${user.uid}`).once('value');
                let userData = userSnapshot.val();
                
                if (!userData) {
                    // New user - create basic profile
                    userData = {
                        uid: user.uid,
                        name: user.displayName || 'Apple User',
                        email: user.email,
                        role: 'poster',
                        emailVerified: user.emailVerified,
                        profileImage: user.photoURL,
                        initials: (user.displayName || 'AU').split(' ').map(n => n[0]).join('').toUpperCase(),
                        createdAt: new Date().toISOString()
                    };
                    
                    await database.ref(`users/${user.uid}`).set(userData);
                    
                    // Show role selection prompt for new users
                    const role = confirm('Do you want to sign up as a helper? Click OK for Helper, Cancel for Poster');
                    if (role) {
                        userData.role = 'helper';
                        await database.ref(`users/${user.uid}/role`).set('helper');
                    }
                }
                
                localStorage.setItem('taskmart_user', JSON.stringify(userData));
                localStorage.setItem('taskmart_token', await user.getIdToken());
                
                successDiv.textContent = 'Login successful! Redirecting...';
                successDiv.classList.add('show');
                
                setTimeout(() => {
                    if (userData.role === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }, 1000);
                
            } catch (error) {
                console.error('Apple sign-in error:', error);
                errorDiv.textContent = 'Apple sign-in failed. Please try again.';
                errorDiv.classList.add('show');
            }
        }

        // Apple Sign Up
        async function handleAppleSignUp() {
            await handleAppleSignIn();
        }

        // Check if already logged in
        async function checkExistingSession() {
            const user = localStorage.getItem('taskmart_user');
            const token = localStorage.getItem('taskmart_token');
            
            if (user && token) {
                const currentUser = auth.currentUser;
                if (currentUser) {
                    const userData = JSON.parse(user);
                    if (userData.role === 'helper') {
                        window.location.href = '/helper-dashboard.html';
                    } else {
                        window.location.href = '/task-planner.html';
                    }
                }
            }
        }

        // Listen for auth state changes
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                console.log('User is signed in:', user.email);
            } else {
                console.log('User is signed out');
            }
        });

        // Initialize
        checkExistingSession();
    </script>
