<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;800&display=swap">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 480px;
        }

        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            background: linear-gradient(135deg, #045B92 0%, #073b5e 100%);
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .auth-header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95rem;
        }

        .auth-header .material-symbols-outlined {
            font-size: 48px !important;
            color: white;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 50%;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid rgba(4, 91, 146, 0.1);
            background: white;
        }

        .auth-tab {
            flex: 1;
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: rgba(4, 91, 146, 0.5);
            transition: all 0.2s;
            border-bottom: 3px solid transparent;
        }

        .auth-tab.active {
            color: #FF286F;
            border-bottom-color: #FF286F;
        }

        .auth-form-container {
            padding: 2rem;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #045B92;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid rgba(4, 91, 146, 0.1);
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
            transition: all 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #FF286F;
            box-shadow: 0 0 0 4px rgba(255, 40, 111, 0.1);
        }

        .form-group input.error {
            border-color: #FF286F;
            background-color: rgba(255, 40, 111, 0.02);
        }

        .password-input-wrapper {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: rgba(4, 91, 146, 0.5);
        }

        .toggle-password:hover {
            color: #FF286F;
        }

        .error-message {
            color: #FF286F;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: none;
        }

        .error-message.visible {
            display: block;
        }

        /* Role Selector Styles */
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }

        .role-option {
            flex: 1;
            cursor: pointer;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-card {
            border: 2px solid rgba(4, 91, 146, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            transition: all 0.2s;
        }

        .role-option input[type="radio"]:checked + .role-card {
            border-color: #FF286F;
            background-color: rgba(255, 40, 111, 0.05);
            transform: scale(1.02);
        }

        .role-icon {
            font-size: 32px !important;
            color: #045B92;
            margin-bottom: 0.5rem;
        }

        .role-title {
            font-weight: 600;
            color: #045B92;
            margin-bottom: 0.25rem;
        }

        .role-desc {
            font-size: 0.8rem;
            color: rgba(4, 91, 146, 0.6);
        }

        .auth-button {
            width: 100%;
            padding: 1rem;
            background: #FF286F;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            position: relative;
            overflow: hidden;
        }

        .auth-button:hover:not(:disabled) {
            background: #d61e5b;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 40, 111, 0.3);
        }

        .auth-button:active:not(:disabled) {
            transform: translateY(0);
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-button.loading {
            color: transparent;
        }

        .auth-button.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
        }

        .forgot-password a {
            color: #045B92;
            text-decoration: none;
            font-size: 0.85rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .forgot-password a:hover {
            opacity: 1;
            color: #FF286F;
        }

        .terms-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: rgba(4, 91, 146, 0.5);
        }

        .terms-text a {
            color: #FF286F;
            text-decoration: none;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(4, 91, 146, 0.1);
            border-top-color: #FF286F;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Error toast */
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #FF286F;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(255, 40, 111, 0.3);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            max-width: 350px;
        }

        .error-toast.show {
            transform: translateX(0);
        }

        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-family: 'Manrope', sans-serif;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
            z-index: 10000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
            max-width: 350px;
        }

        .success-toast.show {
            transform: translateX(0);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="material-symbols-outlined">task_alt</span>
                <h1>Welcome to TaskMart</h1>
                <p>Connect with trusted helpers in your area</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Log In</div>
                <div class="auth-tab" data-tab="signup">Sign Up</div>
            </div>

            <!-- Forms Container -->
            <div class="auth-form-container">
                <!-- LOGIN FORM -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com">
                        <div class="error-message" id="loginEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="loginPassword" placeholder="••••••••">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('loginPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="loginPasswordError"></div>
                    </div>

                    <div class="forgot-password">
                        <a href="#" id="forgotPassword">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-button" id="loginBtn">Log In</button>
                </form>

                <!-- SIGNUP FORM -->
                <form class="auth-form" id="signupForm">
                    <div class="form-group">
                        <label>Full name</label>
                        <input type="text" id="signupName" placeholder="John Doe">
                        <div class="error-message" id="signupNameError"></div>
                    </div>

                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com">
                        <div class="error-message" id="signupEmailError"></div>
                    </div>

                    <div class="form-group">
                        <label>I want to:</label>
                        <div class="role-selector">
                            <label class="role-option">
                                <input type="radio" name="role" value="poster" checked>
                                <div class="role-card">
                                    <span class="material-symbols-outlined role-icon">assignment</span>
                                    <div class="role-title">Get Help</div>
                                    <div class="role-desc">Post tasks and find helpers</div>
                                </div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="helper">
                                <div class="role-card">
                                    <span class="material-symbols-outlined role-icon">handyman</span>
                                    <div class="role-title">Earn Money</div>
                                    <div class="role-desc">Complete tasks and earn</div>
                                </div>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupPassword" placeholder="••••••••">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('signupPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="signupPasswordError"></div>
                    </div>

                    <div class="form-group">
                        <label>Confirm password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="signupConfirmPassword" placeholder="••••••••">
                            <span class="material-symbols-outlined toggle-password" onclick="togglePassword('signupConfirmPassword')">visibility_off</span>
                        </div>
                        <div class="error-message" id="signupConfirmError"></div>
                    </div>

                    <button type="submit" class="auth-button" id="signupBtn">Create Account</button>

                    <div class="terms-text">
                        By signing up, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Error Toast -->
    <div class="error-toast" id="errorToast"></div>
    
    <!-- Success Toast -->
    <div class="success-toast" id="successToast"></div>

    <script>
        // Configuration
        const API_BASE_URL = window.location.origin; // Your backend URL
        const IS_PRODUCTION = window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1';

        // Toast functions
        function showError(message) {
            const toast = document.getElementById('errorToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function showSuccess(message) {
            const toast = document.getElementById('successToast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Toggle between login and signup tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                
                const tabName = this.dataset.tab;
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                document.getElementById(tabName + 'Form').classList.add('active');
                
                clearAllErrors();
            });
        });

        // Toggle password visibility
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = event.target;
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility_off';
            }
        }

        // Clear all error messages
        function clearAllErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.textContent = '';
                el.classList.remove('visible');
            });
            document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
        }

        // Show error on field
        function showFieldError(inputId, message) {
            const input = document.getElementById(inputId);
            const errorEl = document.getElementById(inputId + 'Error');
            input.classList.add('error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('visible');
            }
        }

        // Validate email
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // Save auth token and user data
        function saveAuth(token, user) {
            localStorage.setItem('auth_token', token);
            localStorage.setItem('user', JSON.stringify(user));
            
            // Set auth header for future requests
            window.authorizationHeader = `Bearer ${token}`;
        }

        // Role-based redirect
        function redirectBasedOnRole(role, returnUrl) {
            if (role === 'poster') {
                window.location.href = returnUrl || '/poster-dashboard.html';
            } else if (role === 'helper') {
                window.location.href = returnUrl || '/helper-dashboard.html';
            } else {
                window.location.href = returnUrl || '/task-planner.html';
            }
        }

        // Get return URL from query parameters
        function getReturnUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('returnTo');
        }

        // Handle Login
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAllErrors();

            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const returnUrl = getReturnUrl();
            
            let isValid = true;

            // Validation
            if (!email) {
                showFieldError('loginEmail', 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showFieldError('loginEmail', 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showFieldError('loginPassword', 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showFieldError('loginPassword', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            try {
                // Real API call to your backend
                const response = await fetch(`${API_BASE_URL}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                // Save auth token and user data
                saveAuth(data.token, data.user);
                
                showSuccess('Login successful! Redirecting...');

                // Role-based redirect
                setTimeout(() => {
                    redirectBasedOnRole(data.user.role, returnUrl);
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
                
                if (error.message.includes('Failed to fetch')) {
                    showError('Cannot connect to server. Please check your internet connection.');
                } else {
                    showError(error.message || 'Login failed. Please try again.');
                    showFieldError('loginEmail', 'Invalid email or password');
                }
            }
        });

        // Handle Signup
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            clearAllErrors();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirmPassword = document.getElementById('signupConfirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked')?.value;
            const returnUrl = getReturnUrl();
            
            let isValid = true;

            // Validation
            if (!name) {
                showFieldError('signupName', 'Name is required');
                isValid = false;
            } else if (name.length < 2) {
                showFieldError('signupName', 'Name must be at least 2 characters');
                isValid = false;
            }

            if (!email) {
                showFieldError('signupEmail', 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email)) {
                showFieldError('signupEmail', 'Please enter a valid email');
                isValid = false;
            }

            if (!password) {
                showFieldError('signupPassword', 'Password is required');
                isValid = false;
            } else if (password.length < 6) {
                showFieldError('signupPassword', 'Password must be at least 6 characters');
                isValid = false;
            }

            if (password !== confirmPassword) {
                showFieldError('signupConfirm', 'Passwords do not match');
                isValid = false;
            }

            if (!role) {
                showError('Please select whether you want to get help or earn money');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            const signupBtn = document.getElementById('signupBtn');
            signupBtn.disabled = true;
            signupBtn.classList.add('loading');

            try {
                // Real API call to your backend
                const response = await fetch(`${API_BASE_URL}/api/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name,
                        email,
                        password,
                        role,
                        initials: name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase()
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }

                // Save auth token and user data
                saveAuth(data.token, data.user);
                
                showSuccess('Account created successfully! Redirecting...');

                // Role-based redirect
                setTimeout(() => {
                    redirectBasedOnRole(role, returnUrl);
                }, 1000);

            } catch (error) {
                console.error('Signup error:', error);
                signupBtn.disabled = false;
                signupBtn.classList.remove('loading');
                
                if (error.message.includes('Failed to fetch')) {
                    showError('Cannot connect to server. Please check your internet connection.');
                } else if (error.message.includes('already exists')) {
                    showFieldError('signupEmail', 'Email already registered');
                    showError('This email is already registered. Please login instead.');
                } else {
                    showError(error.message || 'Signup failed. Please try again.');
                }
            }
        });

        // Handle Forgot Password
        document.getElementById('forgotPassword').addEventListener('click', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            
            if (!email) {
                showError('Please enter your email address first');
                document.getElementById('loginEmail').focus();
                return;
            }

            if (!isValidEmail(email)) {
                showError('Please enter a valid email address');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/auth/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email })
                });

                if (!response.ok) {
                    throw new Error('Failed to send reset email');
                }

                showSuccess('Password reset link sent to your email!');
            } catch (error) {
                console.error('Forgot password error:', error);
                showError('Failed to send reset email. Please try again.');
            }
        });

        // Check for existing session
        async function checkExistingSession() {
            const token = localStorage.getItem('auth_token');
            const user = localStorage.getItem('user');
            const returnUrl = getReturnUrl();
            
            if (token && user) {
                try {
                    // Verify token with backend
                    const response = await fetch(`${API_BASE_URL}/api/auth/verify`, {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        // Token is valid, redirect based on role
                        redirectBasedOnRole(data.user.role, returnUrl);
                    } else {
                        // Token invalid, clear storage
                        localStorage.removeItem('auth_token');
                        localStorage.removeItem('user');
                    }
                } catch (error) {
                    console.error('Session verification failed:', error);
                    // Don't redirect on network error, let user try to login
                }
            }
        }

        // Initialize
        checkExistingSession();

        // Add this to your existing task-planner.html to use the token
        // In task-planner.html, when making API calls:
        // const token = localStorage.getItem('auth_token');
        // headers: { 'Authorization': `Bearer ${token}` }
    </script>
</body>
</html>
