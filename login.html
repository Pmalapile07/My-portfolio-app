<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Test</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
    <h1>Firebase Test</h1>
    <div id="status">Testing Firebase connection...</div>
    
    <script>
        // Your exact Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBi_srk36131SlYbhclVqlqsqobJJ917Pg",
            authDomain: "taskmartapp-74d6b.firebaseapp.com",
            databaseURL: "https://taskmartapp-74d6b-default-rtdb.firebaseio.com",
            projectId: "taskmartapp-74d6b",
            storageBucket: "taskmartapp-74d6b.firebasestorage.app",
            messagingSenderId: "52910279328",
            appId: "1:52910279328:web:f49ed0d56a09e5dead17c5",
            measurementId: "G-Z8SPLR0HSL"
        };

        const statusDiv = document.getElementById('status');

        try {
            // Check if Firebase is loaded
            if (typeof firebase === 'undefined') {
                statusDiv.innerHTML = '❌ Firebase SDK not loaded';
                return;
            }

            statusDiv.innerHTML = '✅ Firebase SDK loaded, initializing...';

            // Initialize Firebase
            const app = firebase.initializeApp(firebaseConfig);
            
            statusDiv.innerHTML = '✅ Firebase initialized successfully!';
            
            // Test auth
            const auth = firebase.auth();
            statusDiv.innerHTML += '<br>✅ Auth service ready';
            
            // Test database
            const database = firebase.database();
            statusDiv.innerHTML += '<br>✅ Database service ready';
            
            // Try a simple auth operation to test the API key
            statusDiv.innerHTML += '<br><br>Testing API key with signInAnonymously...';
            
            auth.signInAnonymously()
                .then(() => {
                    statusDiv.innerHTML += '<br>✅ API key works! Anonymous sign-in successful';
                })
                .catch((error) => {
                    statusDiv.innerHTML += `<br>❌ Auth test failed: ${error.message}`;
                });

        } catch (error) {
            statusDiv.innerHTML = `❌ Error: ${error.message}`;
            console.error('Full error:', error);
        }
    </script>
</body>
</html>
