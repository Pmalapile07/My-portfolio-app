<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskMart</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;800&display=swap">
    <style>
        /* Same styles as before - keep them */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Manrope', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .auth-container {
            width: 100%;
            max-width: 480px;
        }
        .auth-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .auth-header {
            background: linear-gradient(135deg, #045B92 0%, #073b5e 100%);
            padding: 2rem;
            text-align: center;
        }
        .auth-header h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 500;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid rgba(4, 91, 146, 0.1);
        }
        .auth-tab {
            flex: 1;
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            font-weight: 500;
            color: rgba(4, 91, 146, 0.5);
            border-bottom: 3px solid transparent;
        }
        .auth-tab.active {
            color: #FF286F;
            border-bottom-color: #FF286F;
        }
        .auth-form-container {
            padding: 2rem;
        }
        .auth-form {
            display: none;
        }
        .auth-form.active {
            display: block;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #045B92;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 1rem 1.2rem;
            border: 2px solid rgba(4, 91, 146, 0.1);
            border-radius: 10px;
            font-family: 'Manrope', sans-serif;
            font-size: 1rem;
        }
        .form-group input:focus {
            border-color: #FF286F;
            outline: none;
        }
        .role-selector {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .role-option {
            flex: 1;
            cursor: pointer;
        }
        .role-option input[type="radio"] {
            display: none;
        }
        .role-card {
            border: 2px solid rgba(4, 91, 146, 0.1);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
        }
        .role-option input[type="radio"]:checked + .role-card {
            border-color: #FF286F;
            background-color: rgba(255, 40, 111, 0.05);
        }
        .auth-button {
            width: 100%;
            padding: 1rem;
            background: #FF286F;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }
        .auth-button:hover {
            background: #d61e5b;
        }
        .error-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #FF286F;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            display: none;
        }
        .error-toast.show {
            display: block;
        }
        .success-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #10b981;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            display: none;
        }
        .success-toast.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome to TaskMart</h1>
            </div>

            <div class="auth-tabs">
                <div class="auth-tab active" data-tab="login">Log In</div>
                <div class="auth-tab" data-tab="signup">Sign Up</div>
            </div>

            <div class="auth-form-container">
                <!-- LOGIN FORM -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="loginPassword" placeholder="••••••••">
                    </div>
                    <button type="submit" class="auth-button">Log In</button>
                </form>

                <!-- SIGNUP FORM -->
                <form class="auth-form" id="signupForm">
                    <div class="form-group">
                        <label>Full name</label>
                        <input type="text" id="signupName" placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com">
                    </div>
                    <div class="form-group">
                        <label>I want to:</label>
                        <div class="role-selector">
                            <label class="role-option">
                                <input type="radio" name="role" value="poster" checked>
                                <div class="role-card">Get Help (Post Tasks)</div>
                            </label>
                            <label class="role-option">
                                <input type="radio" name="role" value="helper">
                                <div class="role-card">Earn Money (Do Tasks)</div>
                            </label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="signupPassword" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label>Confirm password</label>
                        <input type="password" id="signupConfirmPassword" placeholder="••••••••">
                    </div>
                    <button type="submit" class="auth-button">Create Account</button>
                </form>
            </div>
        </div>
    </div>

    <div class="error-toast" id="errorToast"></div>
    <div class="success-toast" id="successToast"></div>

    <script>
        // This is SIMPLE localStorage-only authentication
        // No backend needed - works immediately!
        
        function showError(msg) {
            const toast = document.getElementById('errorToast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function showSuccess(msg) {
            const toast = document.getElementById('successToast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Tab switching
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                const tabName = this.dataset.tab;
                document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
                document.getElementById(tabName + 'Form').classList.add('active');
            });
        });

        // Get return URL
        function getReturnUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('returnTo') || '/task-planner.html';
        }

        // SIGNUP
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirmPassword').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            // Simple validation
            if (!name || !email || !password) {
                showError('All fields are required');
                return;
            }
            if (password !== confirm) {
                showError('Passwords do not match');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            // Check if user exists
            const users = JSON.parse(localStorage.getItem('taskmart_users') || '[]');
            if (users.find(u => u.email === email)) {
                showError('Email already registered');
                return;
            }

            // Create user
            const initials = name.split(' ').map(n => n[0]).join('').substring(0, 2).toUpperCase();
            const newUser = {
                name,
                email,
                password, // In real app, hash this!
                role,
                initials,
                createdAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('taskmart_users', JSON.stringify(users));
            
            // Create session
            const session = {
                name: newUser.name,
                email: newUser.email,
                role: newUser.role,
                initials: newUser.initials,
                loggedIn: true
            };
            localStorage.setItem('taskmart_user', JSON.stringify(session));
            
            showSuccess('Account created! Redirecting...');
            
            setTimeout(() => {
                window.location.href = getReturnUrl();
            }, 1000);
        });

        // LOGIN
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showError('Email and password required');
                return;
            }

            // Check credentials
            const users = JSON.parse(localStorage.getItem('taskmart_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showError('Invalid email or password');
                return;
            }

            // Create session
            const session = {
                name: user.name,
                email: user.email,
                role: user.role,
                initials: user.initials,
                loggedIn: true
            };
            localStorage.setItem('taskmart_user', JSON.stringify(session));
            
            showSuccess('Login successful! Redirecting...');
            
            setTimeout(() => {
                window.location.href = getReturnUrl();
            }, 1000);
        });

        // Check if already logged in
        if (localStorage.getItem('taskmart_user')) {
            const returnUrl = getReturnUrl();
            if (returnUrl !== '/login.html') {
                window.location.href = returnUrl;
            }
        }
    </script>
</body>
</html>
