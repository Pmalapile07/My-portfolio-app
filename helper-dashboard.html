<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Helper</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=block">
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Config -->
    <script src="/config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #000;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-size: 24px !important;
            line-height: 1 !important;
        }

        /* === FULLSCREEN MAP - DARK STYLE === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* === CUSTOM MARKERS === */
        .helper-marker {
            width: 24px;
            height: 24px;
            background: black;
            border: 2px solid white;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .helper-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: white;
            animation: pulse-white 1.5s infinite;
        }

        .poster-marker {
            width: 24px;
            height: 24px;
            background: black;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .poster-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse-white 1.5s infinite;
        }

        @keyframes pulse-white {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* === ROUTE LINE WITH BEEPING DOTS === */
        .beeping-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            position: absolute;
            animation: beep 1s infinite;
            box-shadow: 0 0 15px white;
        }

        @keyframes beep {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* === HEADER - CLEAN === */
        .helper-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .online-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            pointer-events: auto;
            border: none;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #000;
            transition: background 0.2s;
        }

        .status-dot.offline {
            background: #ccc;
        }

        .status-text {
            color: #000;
            font-size: 0.85rem;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.3px;
        }

        /* === ROUTE INFO - MINIMAL === */
        .route-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 12px 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 16px;
            font-weight: 400;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            white-space: nowrap;
            border: none;
            transition: transform 0.4s ease;
        }

        .route-info.active {
            transform: translateX(-50%) translateY(0);
        }

        .route-info .material-symbols-outlined {
            color: #000 !important;
            font-size: 20px !important;
        }

        .route-info span {
            color: #000;
            font-size: 0.9rem;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.3px;
        }

        /* === TASKS SHEET - CLEAN === */
        .tasks-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            z-index: 10;
            max-height: 35%;
            display: flex;
            flex-direction: column;
            transition: max-height 0.3s ease;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .tasks-sheet.expanded {
            max-height: 70%;
        }

        .sheet-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sheet-header h3 {
            font-size: 1rem;
            font-weight: 400;
            color: #000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .sheet-header .material-symbols-outlined {
            font-size: 20px !important;
            color: #000 !important;
        }

        .sheet-header .expand-icon {
            transition: transform 0.3s;
            color: #000 !important;
        }

        .tasks-sheet.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* === TASK CARDS - CLEAN === */
        .task-card {
            padding: 20px 0;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: flex-start;
            gap: 16px;
            position: relative;
        }

        .task-card:last-child {
            border-bottom: none;
        }

        .task-card:hover {
            opacity: 0.7;
        }

        .task-card.matched {
            border-left: 3px solid #000;
            padding-left: 12px;
        }

        .task-icon {
            width: 48px;
            height: 48px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .task-icon .material-symbols-outlined {
            font-size: 24px !important;
            color: #000 !important;
        }

        .task-content {
            flex: 1;
            min-width: 0;
        }

        .task-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #000;
            margin-bottom: 6px;
            font-family: 'Manrope', sans-serif;
            letter-spacing: -0.02em;
            line-height: 1.3;
        }

        .skill-match {
            font-size: 0.7rem;
            color: #000;
            background: #f0f0f0;
            display: inline-block;
            padding: 2px 8px;
            margin-bottom: 8px;
            font-weight: 300;
        }

        .task-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.85rem;
            color: #666;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-meta .material-symbols-outlined {
            font-size: 14px !important;
            color: #999 !important;
        }

        .task-price {
            font-size: 1.1rem;
            font-weight: 600;
            color: #000;
            font-family: 'Manrope', sans-serif;
            white-space: nowrap;
            letter-spacing: -0.02em;
        }

        .task-price.open {
            font-weight: 400;
            font-size: 0.9rem;
            color: #666;
        }

        .task-expanded {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
            width: 100%;
        }

        .task-card.expanded .task-expanded {
            max-height: 400px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .expanded-content {
            padding-left: 64px;
        }

        .expanded-details {
            background: #fafafa;
            padding: 20px;
            margin-bottom: 16px;
        }

        .expanded-details p {
            font-weight: 300;
            color: #333;
            margin-bottom: 16px;
            line-height: 1.6;
            font-size: 0.9rem;
            font-family: 'Manrope', sans-serif;
        }

        .poster-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .poster-avatar {
            width: 32px;
            height: 32px;
            background: #000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            overflow: hidden;
            font-size: 0.8rem;
            font-family: 'Manrope', sans-serif;
        }

        .poster-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-name {
            font-weight: 400;
            color: #000;
            font-size: 0.85rem;
            font-family: 'Manrope', sans-serif;
        }

        .action-btn {
            width: 100%;
            padding: 16px;
            border: 1px solid #000;
            background: transparent;
            font-weight: 400;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
            color: #000;
            margin-top: 12px;
        }

        .action-btn:hover {
            background: #000;
            color: white;
        }

        .action-btn:hover .material-symbols-outlined {
            color: white !important;
        }

        .action-btn .material-symbols-outlined {
            font-size: 18px !important;
            color: #000 !important;
            transition: color 0.2s;
        }

        .offer-input {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .offer-input input {
            flex: 1;
            padding: 14px 16px;
            background: #f5f5f5;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            outline: none;
        }

        .offer-input input:focus {
            background: #eee;
        }

        .offer-input input::placeholder {
            color: #999;
            font-weight: 300;
        }

        .offer-input button {
            padding: 14px 24px;
            background: #000;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            font-size: 0.9rem;
        }

        .offer-input button:hover {
            background: #333;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #000;
            color: white;
            padding: 16px 24px;
            z-index: 3000;
            display: none;
            font-size: 0.9rem;
            font-weight: 300;
            text-align: center;
            border: none;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.3px;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-tasks {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        .no-tasks {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        @media (min-width: 768px) {
            .tasks-sheet {
                left: 20px;
                right: auto;
                width: 420px;
                bottom: 20px;
                max-height: 70%;
                border: 1px solid rgba(0,0,0,0.1);
            }
        }

        /* Profile menu container */
        #profile-menu-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div class="route-info" id="routeInfo">
        <span class="material-symbols-outlined">swap_driving_apps</span>
        <span id="routeDistance">0 km</span>
        <span class="material-symbols-outlined">fiber_manual_record</span>
        <span id="routeDuration">0 min</span>
    </div>

    <div class="helper-header">
        <div class="online-toggle" id="onlineToggle">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Available</span>
        </div>
    </div>

    <div class="tasks-sheet" id="tasksSheet">
        <div class="sheet-header" id="sheetHeader">
            <h3>
                <span class="material-symbols-outlined">list</span>
                Tasks for you
            </h3>
            <span class="material-symbols-outlined expand-icon">expand_less</span>
        </div>

        <div class="sheet-content" id="sheetContent">
            <div class="loading-tasks">
                <div>Finding tasks for you...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Profile Menu Container -->
    <div id="profile-menu-container"></div>

    <script>
        (function() {
            'use strict';

            const API_BASE_URL = ''; // Same server

            // ===== STATE =====
            let currentUser = null;
            let currentLat = null;
            let currentLng = null;
            let availableTasks = [];
            let markers = [];
            let startMarker = null;
            let endMarker = null;
            let map = null;
            let isOnline = true;
            let selectedTaskId = null;
            let authToken = null;
            let beepingDots = [];
            let animationFrame = null;
            let userSkills = [];

            // ===== DOM ELEMENTS =====
            const tasksSheet = document.getElementById('tasksSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const sheetContent = document.getElementById('sheetContent');
            const toast = document.getElementById('toast');
            const routeInfo = document.getElementById('routeInfo');
            const routeDistance = document.getElementById('routeDistance');
            const routeDuration = document.getElementById('routeDuration');
            const onlineToggle = document.getElementById('onlineToggle');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            // ===== TOAST =====
            function showToast(message) {
                toast.textContent = message;
                toast.className = 'toast show';
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== GET USER =====
            function getCurrentUser() {
                try {
                    const user = localStorage.getItem('taskmart_user');
                    return user ? JSON.parse(user) : null;
                } catch (e) {
                    return null;
                }
            }

            function getAuthToken() {
                return localStorage.getItem('taskmart_token');
            }

            // ===== LOAD PROFILE MENU =====
            fetch('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/profile-menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('profile-menu-container').innerHTML = html;
                    const scripts = document.getElementById('profile-menu-container').getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        const script = document.createElement('script');
                        script.textContent = scripts[i].textContent;
                        document.body.appendChild(script);
                    }
                })
                .catch(error => console.error('Failed to load profile menu:', error));

            // ===== CREATE CUSTOM MARKERS =====
            function createHelperMarker() {
                const el = document.createElement('div');
                el.className = 'helper-marker';
                return el;
            }

            function createPosterMarker() {
                const el = document.createElement('div');
                el.className = 'poster-marker';
                return el;
            }

            // ===== CREATE BEEPING DOTS ALONG ROUTE =====
            function createBeepingDots(coordinates) {
                // Remove existing dots
                beepingDots.forEach(dot => dot.remove());
                beepingDots = [];

                if (!coordinates || coordinates.length < 2) return;

                // Create 5 dots along the route
                for (let i = 1; i <= 5; i++) {
                    const fraction = i / 6;
                    const index = Math.floor(coordinates.length * fraction);
                    if (index < coordinates.length) {
                        const [lng, lat] = coordinates[index];
                        
                        const dot = document.createElement('div');
                        dot.className = 'beeping-dot';
                        
                        // Convert to screen coordinates
                        const point = map.project([lng, lat]);
                        dot.style.left = point.x + 'px';
                        dot.style.top = point.y + 'px';
                        
                        document.getElementById('map').appendChild(dot);
                        beepingDots.push(dot);
                        
                        // Animate dot movement as map moves
                        const updateDotPosition = () => {
                            const newPoint = map.project([lng, lat]);
                            dot.style.left = newPoint.x + 'px';
                            dot.style.top = newPoint.y + 'px';
                            animationFrame = requestAnimationFrame(updateDotPosition);
                        };
                        
                        if (i === 1) {
                            updateDotPosition();
                        }
                    }
                }
            }

            // ===== MAP INIT =====
            function initMap() {
                if (!window.MAPBOX_TOKEN) {
                    console.error('No Mapbox token');
                    return;
                }

                mapboxgl.accessToken = window.MAPBOX_TOKEN;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [28.034088, -26.195246],
                    zoom: 13
                });

                map.on('load', () => {
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: []
                            }
                        }
                    });

                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#666666',
                            'line-width': 3,
                            'line-opacity': 0.6
                        }
                    });

                    getUserLocation();
                });

                // Update dot positions on map move
                map.on('move', () => {
                    // Dots will be updated in animation frame
                });
            }

            // ===== GET LOCATION =====
            function getUserLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            currentLat = pos.coords.latitude;
                            currentLng = pos.coords.longitude;
                            
                            map.flyTo({ center: [currentLng, currentLat], zoom: 14 });
                            
                            if (startMarker) startMarker.remove();
                            
                            // Helper marker - square with pulsing white circle
                            const helperEl = createHelperMarker();
                            startMarker = new mapboxgl.Marker({ element: helperEl })
                                .setLngLat([currentLng, currentLat])
                                .setPopup(new mapboxgl.Popup().setHTML('<div style="font-family: Manrope; font-weight: 300;">You</div>'))
                                .addTo(map);

                            fetchTasks();
                        },
                        (error) => {
                            console.error('Location error:', error);
                            fetchTasks();
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }

            // ===== CHECK IF TASK MATCHES USER SKILLS =====
            function taskMatchesSkills(task) {
                if (!userSkills || userSkills.length === 0) return false;
                
                const taskLower = (task.taskDescription || '').toLowerCase();
                return userSkills.some(skill => taskLower.includes(skill.toLowerCase()));
            }

            // ===== FETCH TASKS =====
            async function fetchTasks() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/firebase/tasks`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        let tasks = data.tasks || [];

                        // Filter out user's own tasks and only show open tasks
                        if (currentUser) {
                            tasks = tasks.filter(task => 
                                task.userId !== currentUser.email && 
                                task.status === 'open'
                            );
                        }

                        // Sort tasks - matched skills first
                        tasks.sort((a, b) => {
                            const aMatches = taskMatchesSkills(a);
                            const bMatches = taskMatchesSkills(b);
                            if (aMatches && !bMatches) return -1;
                            if (!aMatches && bMatches) return 1;
                            return 0;
                        });

                        availableTasks = tasks;

                        if (tasks.length === 0) {
                            sheetContent.innerHTML = '<div class="no-tasks">No tasks available</div>';
                        } else {
                            renderTasks(tasks);
                            addTaskMarkers(tasks);
                        }
                    }
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                    sheetContent.innerHTML = '<div class="no-tasks">Error loading tasks</div>';
                }
            }

            // ===== CALCULATE ROUTE =====
            async function calculateRoute(taskId) {
                const task = availableTasks.find(t => t.id === taskId);
                if (!task || !task.coordinates || !currentLat || !currentLng) {
                    showToast('Cannot calculate route');
                    return;
                }

                // Parse coordinates (lat,lng format from task planner)
                const [taskLat, taskLng] = task.coordinates.split(',').map(Number);

                selectedTaskId = taskId;

                if (endMarker) endMarker.remove();

                // Poster marker - circle with pulsing white circle
                const posterEl = createPosterMarker();
                endMarker = new mapboxgl.Marker({ element: posterEl })
                    .setLngLat([taskLng, taskLat])
                    .setPopup(new mapboxgl.Popup().setHTML(`<div style="font-family: Manrope; font-weight: 300;">${task.taskDescription}</div>`))
                    .addTo(map);

                const bounds = new mapboxgl.LngLatBounds();
                bounds.extend([currentLng, currentLat]);
                bounds.extend([taskLng, taskLat]);
                map.fitBounds(bounds, { padding: 50 });

                try {
                    const response = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    if (response.ok) {
                        const data = await response.json();
                        const route = data.routes[0];
                        const distance = route.distance;
                        const duration = Math.round(route.duration / 60);

                        let distanceStr = distance < 1000 
                            ? Math.round(distance) + 'm' 
                            : (distance / 1000).toFixed(1) + 'km';

                        routeDistance.textContent = distanceStr;
                        routeDuration.textContent = duration + 'min';
                        routeInfo.classList.add('active');

                        // Draw route
                        map.getSource('route').setData({
                            type: 'Feature',
                            geometry: route.geometry
                        });

                        // Create beeping dots along route
                        createBeepingDots(route.geometry.coordinates);

                        // Update selected card
                        document.querySelectorAll('.task-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        const selectedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                        if (selectedCard) {
                            selectedCard.classList.add('selected');
                            selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                } catch (error) {
                    console.error('Route error:', error);
                }
            }

            // ===== RENDER TASKS =====
            function renderTasks(tasks) {
                let html = '';

                tasks.forEach(task => {
                    const taskId = task.id;
                    const budget = task.budgetAmount;
                    const isOpenOffer = task.budgetType === 'open';
                    const posterName = task.userName || 'Someone';
                    const posterInitial = posterName.charAt(0).toUpperCase();
                    const posterAvatar = task.userAvatar || null;
                    const taskTitle = task.taskDescription || 'Help needed';
                    const isMatch = taskMatchesSkills(task);

                    html += `
                        <div class="task-card ${isMatch ? 'matched' : ''}" data-task-id="${taskId}" onclick="selectTask('${taskId}')">
                            <div class="task-icon">
                                <span class="material-symbols-outlined">task_alt</span>
                            </div>
                            
                            <div class="task-content">
                                <div class="task-title">${taskTitle}</div>
                                ${isMatch ? '<div class="skill-match">Matches your skills</div>' : ''}
                                <div class="task-meta">
                                    <span>
                                        <span class="material-symbols-outlined">schedule</span>
                                        ${task.when === 'now' ? 'Now' : (task.scheduledTime || 'Flexible')}
                                    </span>
                                    <span>
                                        <span class="material-symbols-outlined">location_on</span>
                                        ${task.location ? task.location.split(',')[0] : 'Nearby'}
                                    </span>
                                </div>
                            </div>
                            
                            <div class="task-price ${isOpenOffer ? 'open' : ''}">
                                ${isOpenOffer ? 'Open' : `R${budget}`}
                            </div>
                            
                            <div class="task-expanded">
                                <div class="expanded-content">
                                    <div class="expanded-details">
                                        ${task.moreDetails ? `<p>${task.moreDetails}</p>` : ''}
                                        
                                        <div class="poster-info">
                                            <div class="poster-avatar">
                                                ${posterAvatar ? `<img src="${posterAvatar}" alt="${posterName}">` : posterInitial}
                                            </div>
                                            <div class="poster-details">
                                                <div class="poster-name">${posterName}</div>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    ${isOpenOffer ? `
                                        <div class="offer-input">
                                            <input type="number" id="offer-${taskId}" placeholder="Your offer (R)" min="1">
                                            <button onclick="event.stopPropagation(); makeOffer('${taskId}')">Send</button>
                                        </div>
                                    ` : `
                                        <button class="action-btn" onclick="event.stopPropagation(); acceptTask('${taskId}', ${budget})">
                                            <span class="material-symbols-outlined">check</span>
                                            Accept
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                });

                sheetContent.innerHTML = html;
            }

            // ===== SELECT TASK =====
            window.selectTask = function(taskId) {
                const card = document.querySelector(`[data-task-id="${taskId}"]`);
                if (card) {
                    const wasExpanded = card.classList.contains('expanded');
                    
                    document.querySelectorAll('.task-card').forEach(c => {
                        if (c.dataset.taskId !== taskId) {
                            c.classList.remove('expanded');
                        }
                    });
                    
                    card.classList.toggle('expanded');
                    
                    if (!wasExpanded) {
                        calculateRoute(taskId);
                    }
                }
            };

            // ===== MAKE OFFER =====
            window.makeOffer = async function(taskId) {
                const input = document.getElementById(`offer-${taskId}`);
                const amount = parseFloat(input.value);
                
                if (!amount || amount < 1) {
                    showToast('Enter a valid amount');
                    return;
                }

                if (!isOnline) {
                    showToast('Set status to available');
                    return;
                }

                showToast('Offer sent');
                input.value = '';
                
                // In real implementation, send to backend
                // await fetch(`${API_BASE_URL}/api/firebase/tasks/${taskId}/offer`, {...})
            };

            // ===== ACCEPT TASK =====
            window.acceptTask = async function(taskId, budget) {
                if (!isOnline) {
                    showToast('Set status to available');
                    return;
                }

                const task = availableTasks.find(t => t.id === taskId);
                if (!task) return;

                showToast('Task accepted');

                // In real implementation, update task status
                // await fetch(`${API_BASE_URL}/api/firebase/tasks/${taskId}`, {
                //     method: 'PATCH',
                //     body: JSON.stringify({ status: 'in-progress' })
                // });

                availableTasks = availableTasks.filter(t => t.id !== taskId);
                renderTasks(availableTasks);
                
                routeInfo.classList.remove('active');
                if (endMarker) endMarker.remove();
                map.getSource('route').setData({
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: [] }
                });
                
                // Remove beeping dots
                beepingDots.forEach(dot => dot.remove());
                beepingDots = [];
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                }
            };

            // ===== ADD MARKERS =====
            function addTaskMarkers(tasks) {
                if (window.taskMarkers) {
                    window.taskMarkers.forEach(marker => marker.remove());
                }
                window.taskMarkers = [];

                tasks.forEach(task => {
                    if (task.coordinates) {
                        const [lat, lng] = task.coordinates.split(',').map(Number);
                        
                        const posterEl = createPosterMarker();
                        const marker = new mapboxgl.Marker({ element: posterEl })
                            .setLngLat([lng, lat])
                            .setPopup(new mapboxgl.Popup().setHTML(`
                                <div style="font-family: 'Manrope', sans-serif; font-weight: 300; padding: 8px;">
                                    <strong>${task.taskDescription || 'Help needed'}</strong><br>
                                    ${task.budgetType === 'open' ? 'Open to offers' : 'R' + task.budgetAmount}
                                </div>
                            `))
                            .addTo(map);
                        
                        window.taskMarkers.push(marker);
                    }
                });
            }

            // ===== ONLINE TOGGLE =====
            onlineToggle.addEventListener('click', () => {
                isOnline = !isOnline;
                statusDot.className = isOnline ? 'status-dot' : 'status-dot offline';
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                showToast(`You are now ${isOnline ? 'available' : 'offline'}`);
            });

            // ===== SHEET TOGGLE =====
            sheetHeader.addEventListener('click', () => {
                tasksSheet.classList.toggle('expanded');
            });

            // ===== AUTO REFRESH TASKS =====
            setInterval(() => {
                if (isOnline) {
                    fetchTasks();
                }
            }, 10000); // Refresh every 10 seconds

            // ===== INIT =====
            currentUser = getCurrentUser();
            authToken = getAuthToken();

            // Load user skills
            if (currentUser) {
                userSkills = currentUser.skills || [];
                console.log('User skills loaded:', userSkills);
            }

            if (!currentUser || !authToken) {
                window.location.href = '/login.html';
            } else {
                initMap();
            }
        })();
    </script>
</body>
</html>
