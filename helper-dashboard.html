                const clientHeight = feedContent.clientHeight;
                
                isAtBottom = scrollTop + clientHeight >= scrollHeight - 50;
                fabIcon.textContent = isAtBottom ? 'vertical_align_top' : 'vertical_align_center';
            });

            fabBtn.addEventListener('click', () => {
                if (isAtBottom) {
                    feedContent.scrollTo({ top: 0, behavior: smoothScrollEnabled ? 'smooth' : 'auto' });
                    fabIcon.textContent = 'vertical_align_center';
                } else {
                    feedContent.scrollTo({ top: feedContent.scrollHeight, behavior: smoothScrollEnabled ? 'smooth' : 'auto' });
                }
            });

            // ===== ONLINE TOGGLE =====
            onlineToggle.addEventListener('change', (e) => {
                isOnline = e.target.checked;
                const statusText = document.querySelector('.online-toggle span:nth-child(2)');
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                
                if (!isOnline && socket) {
                    socket.disconnect();
                } else if (isOnline && socket) {
                    socket.connect();
                }
                
                showToast(`You are now ${isOnline ? 'available' : 'offline'}`, 'success');
            });

            // ===== PULL TO REFRESH =====
            let touchStartY = 0;
            let touchMoveY = 0;
            const refreshThreshold = 100;
            let refreshIndicator = null;

            function createRefreshIndicator() {
                const indicator = document.createElement('div');
                indicator.className = 'refresh-indicator';
                indicator.innerHTML = '<span class="material-symbols-outlined">refresh</span><span>Release to refresh</span>';
                feedContent.parentNode.insertBefore(indicator, feedContent);
                return indicator;
            }

            feedContent.addEventListener('touchstart', (e) => {
                if (feedContent.scrollTop === 0) {
                    touchStartY = e.touches[0].clientY;
                    if (!refreshIndicator) {
                        refreshIndicator = createRefreshIndicator();
                    }
                }
            });

            feedContent.addEventListener('touchmove', (e) => {
                if (touchStartY > 0 && feedContent.scrollTop === 0) {
                    touchMoveY = e.touches[0].clientY;
                    const pullDistance = touchMoveY - touchStartY;
                    
                    if (pullDistance > 0 && pullDistance < refreshThreshold) {
                        refreshIndicator.style.transform = `translateY(${pullDistance}px)`;
                        refreshIndicator.classList.add('show');
                    } else if (pullDistance >= refreshThreshold) {
                        refreshIndicator.innerHTML = '<span class="material-symbols-outlined">refresh</span><span>Release to refresh</span>';
                    }
                }
            });

            feedContent.addEventListener('touchend', (e) => {
                if (touchStartY > 0 && feedContent.scrollTop === 0) {
                    const pullDistance = touchMoveY - touchStartY;
                    
                    if (pullDistance >= refreshThreshold) {
                        refreshIndicator.innerHTML = '<span class="material-symbols-outlined">sync</span><span>Refreshing...</span>';
                        fetchTasks();
                        setTimeout(() => {
                            refreshIndicator.classList.remove('show');
                            refreshIndicator.style.transform = '';
                        }, 1000);
                    } else {
                        refreshIndicator.classList.remove('show');
                        refreshIndicator.style.transform = '';
                    }
                }
                
                touchStartY = 0;
                touchMoveY = 0;
            });

            // ===== EVENT LISTENERS =====
            feedHeader.addEventListener('click', () => {
                tasksFeed.classList.toggle('expanded');
            });

            notificationsBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationsPanel.classList.toggle('active');
            });

            closeNotificationsBtn.addEventListener('click', () => {
                notificationsPanel.classList.remove('active');
            });

            earningsWidget.addEventListener('click', () => {
                showToast(`Total earnings: R ${earningsTotal}`, 'success');
            });

            profileMenuBtn.addEventListener('click', openProfileModal);

            profileModalOverlay.addEventListener('click', (e) => {
                if (e.target === profileModalOverlay) closeProfileModal();
            });

            if (backFromAccount) {
                backFromAccount.addEventListener('click', () => {
                    accountModal.classList.remove('active');
                });
            }

            if (backFromImage) {
                backFromImage.addEventListener('click', () => {
                    imageModal.classList.remove('active');
                });
            }

            document.addEventListener('click', (e) => {
                if (!notificationsPanel.contains(e.target) && !notificationsBtn.contains(e.target)) {
                    notificationsPanel.classList.remove('active');
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    accountModal.classList.remove('active');
                    imageModal.classList.remove('active');
                    closeProfileModal();
                    notificationsPanel.classList.remove('active');
                }
            });

            // ===== INIT =====
            currentUser = getCurrentUser();
            
            if (!currentUser) {
                window.location.href = '/login.html';
            } else {
                checkVerificationStatus();

                const savedEarnings = localStorage.getItem('helper_earnings');
                if (savedEarnings) {
                    earningsTotal = parseInt(savedEarnings);
                    earningsTotalSpan.textContent = `R ${earningsTotal}`;
                }
            }

            // Periodically check verification status
            setInterval(checkVerificationStatus, 60000);
        })();
    </script>
</body>
</html>
