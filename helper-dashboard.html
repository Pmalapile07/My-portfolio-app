<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Helper</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=block">
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Config -->
    <script src="/config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #000;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-size: 24px !important;
            line-height: 1 !important;
        }

        /* === FULLSCREEN MAP - DARK STYLE === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* === HEADER - CLEAN === */
        .helper-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            pointer-events: none;
        }

        .online-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            pointer-events: auto;
            border: none;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .online-toggle:hover {
            transform: scale(1.02);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            transition: background 0.2s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .status-dot.offline {
            background: #ef4444;
            animation: none;
        }

        .status-text {
            color: #000;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: 'Manrope', sans-serif;
        }

        /* === ROUTE OVERLAY - SLIDE IN === */
        .route-info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: white;
            padding: 12px 24px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            white-space: nowrap;
            border: none;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .route-info.active {
            transform: translateX(-50%) translateY(0);
        }

        .route-info .material-symbols-outlined {
            color: #003fe1 !important;
            font-size: 20px !important;
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
            100% { transform: translateY(0); }
        }

        .route-info span {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 500;
            font-family: 'Manrope', sans-serif;
        }

        /* === TASKS SHEET - GLASSMORPHISM === */
        .tasks-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            z-index: 10;
            max-height: 35%;
            display: flex;
            flex-direction: column;
            transition: max-height 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }

        .tasks-sheet.expanded {
            max-height: 80%;
        }

        .sheet-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sheet-header h3 {
            font-size: 1.1rem;
            font-weight: 500;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
        }

        .sheet-header .material-symbols-outlined {
            font-size: 20px !important;
            color: #000000 !important;
            transition: transform 0.3s;
        }

        .sheet-header .expand-icon {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            color: #000000 !important;
        }

        .tasks-sheet.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            scroll-behavior: smooth;
        }

        /* === TASK CARDS - PSYCHOLOGICAL HIERARCHY === */
        .task-card {
            background: white;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            animation: slideIn 0.4s ease;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .task-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #003fe1, #00c6ff);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .task-card:hover::before {
            transform: translateX(0);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-card:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow: 0 15px 30px rgba(0,63,225,0.15);
        }

        .task-card.selected {
            background: linear-gradient(135deg, #f8f9ff, white);
            border-left: 4px solid #003fe1;
            box-shadow: 0 10px 25px rgba(0,63,225,0.2);
        }

        .task-card.selected::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle at top right, rgba(0,63,225,0.1), transparent 70%);
            border-radius: 50%;
        }

        /* TASK TITLE - MOST IMPORTANT - LARGE & BOLD */
        .task-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 12px;
            font-family: 'Manrope', sans-serif;
            line-height: 1.3;
            letter-spacing: -0.02em;
        }

        /* DISTANCE BADGE - EYE-CATCHING */
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .task-distance {
            background: linear-gradient(135deg, #003fe1, #00c6ff);
            color: white;
            padding: 6px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-radius: 30px;
            font-family: 'Manrope', sans-serif;
            box-shadow: 0 4px 10px rgba(0,63,225,0.3);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { box-shadow: 0 4px 10px rgba(0,63,225,0.3); }
            50% { box-shadow: 0 4px 20px rgba(0,63,225,0.5); }
            100% { box-shadow: 0 4px 10px rgba(0,63,225,0.3); }
        }

        .task-distance::before {
            content: '📍';
            font-size: 0.8rem;
            margin-right: 2px;
        }

        /* BUDGET - PROMINENT */
        .task-budget {
            font-size: 1.3rem;
            font-weight: 700;
            color: #000000;
            margin-bottom: 12px;
            font-family: 'Manrope', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .task-budget.open {
            color: #003fe1;
            font-style: normal;
            font-size: 1.1rem;
            font-weight: 600;
            background: rgba(0,63,225,0.1);
            padding: 6px 12px;
            border-radius: 30px;
            display: inline-block;
        }

        .task-budget::before {
            content: '💰';
            font-size: 1.1rem;
            opacity: 0.8;
        }

        .task-budget.open::before {
            content: '🤝';
        }

        /* LOCATION - CLEAN */
        .task-location {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 16px;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            background: rgba(0,0,0,0.02);
            padding: 8px 12px;
            border-radius: 12px;
        }

        .task-location .material-symbols-outlined {
            font-size: 18px !important;
            color: #003fe1 !important;
        }

        /* SECONDARY INFO - SUBTLE BUT ACCESSIBLE */
        .secondary-info {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 16px;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
        }

        .secondary-info span {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,0,0,0.02);
            padding: 4px 10px;
            border-radius: 20px;
        }

        .secondary-info .material-symbols-outlined {
            font-size: 16px !important;
            color: #003fe1 !important;
        }

        /* POSTER INFO - TERTIARY */
        .poster-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            border-top: 1px dashed rgba(0,0,0,0.1);
            margin-top: 8px;
        }

        .poster-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #003fe1, #00c6ff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            overflow: hidden;
            font-size: 1rem;
            border-radius: 40px;
            font-family: 'Manrope', sans-serif;
            box-shadow: 0 4px 10px rgba(0,63,225,0.2);
        }

        .poster-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-details {
            flex: 1;
        }

        .poster-name {
            font-weight: 600;
            color: #000000;
            font-size: 0.95rem;
            font-family: 'Manrope', sans-serif;
        }

        .poster-rating {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #f59e0b;
            font-size: 0.75rem;
            font-weight: 500;
            font-family: 'Manrope', sans-serif;
        }

        .poster-rating .material-symbols-outlined {
            font-size: 14px !important;
            color: #f59e0b !important;
        }

        /* EXPANDED SECTION - PROGRESSIVE DISCLOSURE */
        .task-expanded {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 0;
        }

        .task-card.expanded .task-expanded {
            max-height: 400px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .task-expanded p {
            font-weight: 400;
            color: #444;
            margin-bottom: 16px;
            line-height: 1.6;
            font-size: 0.95rem;
            font-family: 'Manrope', sans-serif;
            background: rgba(0,63,225,0.02);
            padding: 16px;
            border-radius: 12px;
            border-left: 3px solid #003fe1;
        }

        /* ACTION BUTTONS - SATISFYING */
        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:active::after {
            width: 300px;
            height: 300px;
        }

        .accept-btn {
            background: linear-gradient(135deg, #000000, #333333);
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .accept-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .accept-btn .material-symbols-outlined {
            color: white !important;
            font-size: 20px !important;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        .offer-btn {
            background: linear-gradient(135deg, #003fe1, #00c6ff);
            color: white;
            box-shadow: 0 8px 20px rgba(0,63,225,0.3);
        }

        .offer-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,63,225,0.4);
        }

        .offer-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .offer-input input {
            flex: 1;
            padding: 14px 16px;
            background-color: #f0f0f0;
            border: 2px solid transparent;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            font-weight: 400;
            outline: none;
            border-radius: 30px;
            transition: all 0.2s;
        }

        .offer-input input:focus {
            border-color: #003fe1;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(0,63,225,0.1);
        }

        .offer-input input::placeholder {
            color: rgba(0,0,0,0.3);
            font-weight: 400;
        }

        .offer-input button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #003fe1, #00c6ff);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,63,225,0.3);
            transition: all 0.3s;
        }

        .offer-input button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,63,225,0.4);
        }

        /* === TOAST - DELIGHTFUL === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #000000;
            color: white;
            padding: 16px 24px;
            z-index: 3000;
            display: none;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: center;
            border: none;
            border-radius: 40px;
            font-family: 'Manrope', sans-serif;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .toast.show {
            display: block;
            animation: slideUpToast 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes slideUpToast {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast.success { 
            background: linear-gradient(135deg, #10b981, #059669);
        }
        .toast.error { 
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        /* === LOADING STATES === */
        .loading-tasks {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(0,63,225,0.1);
            border-top-color: #003fe1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .no-tasks {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .no-tasks .material-symbols-outlined {
            font-size: 48px !important;
            color: #003fe1 !important;
            opacity: 0.5;
        }

        /* === TABLET/DESKTOP === */
        @media (min-width: 768px) {
            .tasks-sheet {
                left: 20px;
                right: auto;
                width: 420px;
                bottom: 20px;
                max-height: 70%;
                border-radius: 24px;
                box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            }
        }

        /* Remove any profile menu containers */
        #profile-menu-container {
            display: none;
        }
    </style>
</head>
<body>
    <!-- MAP -->
    <div id="map"></div>

    <!-- Route Info - Slides in when task selected -->
    <div class="route-info" id="routeInfo">
        <span class="material-symbols-outlined">route</span>
        <span id="routeDistance">0 km</span>
        <span id="routeDuration">• 0 min</span>
    </div>

    <!-- Header (clean online toggle) -->
    <div class="helper-header">
        <div class="online-toggle" id="onlineToggle">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Available</span>
        </div>
    </div>

    <!-- Tasks Sheet - Glassmorphism -->
    <div class="tasks-sheet" id="tasksSheet">
        <div class="sheet-header" id="sheetHeader">
            <h3>
                <span class="material-symbols-outlined">radar</span>
                Tasks nearby
            </h3>
            <span class="material-symbols-outlined expand-icon">expand_less</span>
        </div>

        <div class="sheet-content" id="sheetContent">
            <div class="loading-tasks">
                <div class="loading-spinner"></div>
                <div>Finding tasks near you...</div>
            </div>
        </div>
    </div>

    <!-- Toast - Delightful notifications -->
    <div class="toast" id="toast"></div>

    <script>
        (function() {
            'use strict';

            const API_BASE_URL = ''; // Same server

            // ===== STATE =====
            let currentUser = null;
            let currentLat = null;
            let currentLng = null;
            let availableTasks = [];
            let markers = [];
            let startMarker = null;
            let endMarker = null;
            let map = null;
            let isOnline = true;
            let selectedTaskId = null;
            let authToken = null;

            // ===== DOM ELEMENTS =====
            const tasksSheet = document.getElementById('tasksSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const sheetContent = document.getElementById('sheetContent');
            const toast = document.getElementById('toast');
            const routeInfo = document.getElementById('routeInfo');
            const routeDistance = document.getElementById('routeDistance');
            const routeDuration = document.getElementById('routeDuration');
            const onlineToggle = document.getElementById('onlineToggle');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            // ===== TOAST =====
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.className = 'toast ' + type + ' show';
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== GET USER =====
            function getCurrentUser() {
                try {
                    const user = localStorage.getItem('taskmart_user');
                    return user ? JSON.parse(user) : null;
                } catch (e) {
                    return null;
                }
            }

            function getAuthToken() {
                return localStorage.getItem('taskmart_token');
            }

            // ===== MAP INIT - DARK STYLE =====
            function initMap() {
                if (!window.MAPBOX_TOKEN) {
                    console.error('No Mapbox token');
                    return;
                }

                mapboxgl.accessToken = window.MAPBOX_TOKEN;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [28.034088, -26.195246],
                    zoom: 13
                });

                map.on('load', () => {
                    // Add route source for drawing paths
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: []
                            }
                        }
                    });

                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#003fe1',
                            'line-width': 6,
                            'line-opacity': 0.9,
                            'line-dasharray': [0, 4, 3]
                        }
                    });

                    getUserLocation();
                });
            }

            // ===== GET LOCATION =====
            function getUserLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            currentLat = pos.coords.latitude;
                            currentLng = pos.coords.longitude;
                            
                            map.flyTo({ center: [currentLng, currentLat], zoom: 14, duration: 2000 });
                            
                            if (startMarker) startMarker.remove();
                            
                            // Create pulsing marker for helper
                            const el = document.createElement('div');
                            el.className = 'helper-marker';
                            el.style.width = '24px';
                            el.style.height = '24px';
                            el.style.borderRadius = '50%';
                            el.style.background = '#003fe1';
                            el.style.boxShadow = '0 0 0 rgba(0,63,225,0.4)';
                            el.style.animation = 'pulse 2s infinite';
                            
                            startMarker = new mapboxgl.Marker({ color: '#003fe1' })
                                .setLngLat([currentLng, currentLat])
                                .setPopup(new mapboxgl.Popup().setHTML('You are here'))
                                .addTo(map);

                            fetchTasks();
                        },
                        (error) => {
                            console.error('Location error:', error);
                            fetchTasks();
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }

            // ===== FETCH TASKS =====
            async function fetchTasks() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/firebase/tasks`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        let tasks = data.tasks || [];

                        if (currentUser) {
                            tasks = tasks.filter(task => 
                                task.userId !== currentUser.email && 
                                task.status === 'open'
                            );
                        }

                        availableTasks = tasks;

                        if (tasks.length === 0) {
                            sheetContent.innerHTML = '<div class="no-tasks"><span class="material-symbols-outlined">search_off</span><div>No tasks available nearby</div></div>';
                        } else {
                            renderTasks(tasks);
                            addTaskMarkers(tasks);
                        }
                    }
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                }
            }

            // ===== CALCULATE DISTANCE & ROUTE =====
            async function calculateRoute(taskId) {
                const task = availableTasks.find(t => t.id === taskId);
                if (!task || !task.coordinates || !currentLat || !currentLng) {
                    showToast('Cannot calculate route', 'error');
                    return;
                }

                const [taskLat, taskLng] = task.coordinates.split(',').map(Number);

                selectedTaskId = taskId;

                if (endMarker) endMarker.remove();

                // Create pulsing marker for task
                const el = document.createElement('div');
                el.className = 'task-marker';
                el.style.width = '30px';
                el.style.height = '30px';
                el.style.borderRadius = '50%';
                el.style.background = '#000000';
                el.style.border = '3px solid white';
                el.style.boxShadow = '0 0 20px rgba(0,0,0,0.5)';
                el.style.animation = 'bounce 1s infinite';
                
                endMarker = new mapboxgl.Marker({ color: '#000000' })
                    .setLngLat([taskLng, taskLat])
                    .setPopup(new mapboxgl.Popup().setHTML(task.taskDescription || 'Task location'))
                    .addTo(map);

                const bounds = new mapboxgl.LngLatBounds();
                bounds.extend([currentLng, currentLat]);
                bounds.extend([taskLng, taskLat]);
                map.fitBounds(bounds, { padding: 50, duration: 1500 });

                try {
                    const response = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    if (response.ok) {
                        const data = await response.json();
                        const route = data.routes[0];
                        const distance = route.distance;
                        const duration = Math.round(route.duration / 60);

                        let distanceStr = distance < 1000 
                            ? Math.round(distance) + 'm' 
                            : (distance / 1000).toFixed(1) + 'km';

                        routeDistance.textContent = distanceStr;
                        routeDuration.textContent = `• ${duration} min`;
                        routeInfo.classList.add('active');

                        // Animate route drawing
                        const coordinates = route.geometry.coordinates;
                        let i = 0;
                        const animateRoute = () => {
                            if (i < coordinates.length) {
                                map.getSource('route').setData({
                                    type: 'Feature',
                                    geometry: {
                                        type: 'LineString',
                                        coordinates: coordinates.slice(0, i + 1)
                                    }
                                });
                                i++;
                                requestAnimationFrame(animateRoute);
                            }
                        };
                        animateRoute();

                        document.querySelectorAll('.task-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        const selectedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                        if (selectedCard) {
                            selectedCard.classList.add('selected');
                            
                            const badge = selectedCard.querySelector('.task-distance');
                            if (badge) badge.innerHTML = `📍 ${distanceStr}`;
                            
                            // Scroll to selected card
                            selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                } catch (error) {
                    console.error('Route error:', error);
                }
            }

            // ===== RENDER TASKS =====
            function renderTasks(tasks) {
                let html = '';

                tasks.forEach((task, index) => {
                    const taskId = task.id;
                    const budget = task.budgetAmount;
                    const isOpenOffer = task.budgetType === 'open';
                    const posterName = task.userName || 'Someone';
                    const posterInitial = posterName.charAt(0).toUpperCase();
                    const posterAvatar = task.userAvatar || null;
                    const taskTitle = task.taskDescription || 'Help needed';
                    const delay = index * 0.05;

                    html += `
                        <div class="task-card" data-task-id="${taskId}" onclick="selectTask('${taskId}')" style="animation-delay: ${delay}s">
                            <div class="task-header">
                                <span class="task-distance">📍 ?</span>
                            </div>
                            
                            <div class="task-title">${taskTitle}</div>
                            
                            <div class="task-budget ${isOpenOffer ? 'open' : ''}">
                                ${isOpenOffer ? '🤝 Open to offers' : `💰 R ${budget}`}
                            </div>
                            
                            <div class="task-location">
                                <span class="material-symbols-outlined">location_on</span>
                                <span>${task.location || 'Location not specified'}</span>
                            </div>
                            
                            <div class="secondary-info">
                                <span>
                                    <span class="material-symbols-outlined">schedule</span>
                                    ${task.when === 'now' ? 'Now' : (task.scheduledTime || 'Flexible')}
                                </span>
                                <span>
                                    <span class="material-symbols-outlined">person</span>
                                    ${posterName.split(' ')[0]}
                                </span>
                            </div>
                            
                            <div class="poster-info">
                                <div class="poster-avatar">
                                    ${posterAvatar ? `<img src="${posterAvatar}" alt="${posterName}">` : posterInitial}
                                </div>
                                <div class="poster-details">
                                    <div class="poster-name">${posterName}</div>
                                    <div class="poster-rating">
                                        <span class="material-symbols-outlined">star</span>
                                        <span>4.9</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="task-expanded">
                                ${task.moreDetails ? `<p>📝 ${task.moreDetails}</p>` : ''}
                                
                                ${isOpenOffer ? `
                                    <div class="offer-input">
                                        <input type="number" id="offer-${taskId}" placeholder="Your offer (R)" min="1">
                                        <button onclick="event.stopPropagation(); makeOffer('${taskId}')">Send</button>
                                    </div>
                                ` : `
                                    <button class="action-btn accept-btn" onclick="event.stopPropagation(); acceptTask('${taskId}', ${budget})">
                                        <span class="material-symbols-outlined">check_circle</span>
                                        Accept Task
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                });

                sheetContent.innerHTML = html;
            }

            // ===== SELECT TASK =====
            window.selectTask = function(taskId) {
                const card = document.querySelector(`[data-task-id="${taskId}"]`);
                if (card) {
                    const wasExpanded = card.classList.contains('expanded');
                    
                    // Close all other cards
                    document.querySelectorAll('.task-card').forEach(c => {
                        if (c.dataset.taskId !== taskId) {
                            c.classList.remove('expanded');
                        }
                    });
                    
                    // Toggle current card
                    card.classList.toggle('expanded');
                    
                    // If opening, calculate route
                    if (!wasExpanded) {
                        calculateRoute(taskId);
                    }
                }
            };

            // ===== MAKE OFFER =====
            window.makeOffer = async function(taskId) {
                const input = document.getElementById(`offer-${taskId}`);
                const amount = parseFloat(input.value);
                
                if (!amount || amount < 1) {
                    showToast('Enter a valid amount', 'error');
                    return;
                }

                if (!isOnline) {
                    showToast('Set your status to available', 'error');
                    return;
                }

                showToast('🤝 Offer sent! Waiting for response.', 'success');
                input.value = '';
            };

            // ===== ACCEPT TASK =====
            window.acceptTask = async function(taskId, budget) {
                if (!isOnline) {
                    showToast('Set your status to available', 'error');
                    return;
                }

                const task = availableTasks.find(t => t.id === taskId);
                if (!task) return;

                showToast('✅ Task accepted! You can now help.', 'success');

                availableTasks = availableTasks.filter(t => t.id !== taskId);
                renderTasks(availableTasks);
                
                routeInfo.classList.remove('active');
                if (endMarker) endMarker.remove();
                map.getSource('route').setData({
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: [] }
                });
            };

            // ===== ADD MARKERS =====
            function addTaskMarkers(tasks) {
                if (window.taskMarkers) {
                    window.taskMarkers.forEach(marker => marker.remove());
                }
                window.taskMarkers = [];

                tasks.forEach(task => {
                    if (task.coordinates) {
                        const [lat, lng] = task.coordinates.split(',').map(Number);
                        
                        const marker = new mapboxgl.Marker({ color: '#000000' })
                            .setLngLat([lng, lat])
                            .setPopup(new mapboxgl.Popup().setHTML(`
                                <div style="font-family: 'Manrope', sans-serif; padding: 8px;">
                                    <strong>${task.taskDescription || 'Help needed'}</strong><br>
                                    ${task.budgetType === 'open' ? 'Open to offers' : 'R ' + task.budgetAmount}
                                </div>
                            `))
                            .addTo(map);
                        
                        window.taskMarkers.push(marker);
                    }
                });
            }

            // ===== ONLINE TOGGLE =====
            onlineToggle.addEventListener('click', () => {
                isOnline = !isOnline;
                statusDot.className = isOnline ? 'status-dot' : 'status-dot offline';
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                showToast(`You are now ${isOnline ? '🟢 available' : '🔴 offline'}`, 'success');
            });

            // ===== SHEET TOGGLE =====
            sheetHeader.addEventListener('click', () => {
                tasksSheet.classList.toggle('expanded');
            });

            // ===== AUTO REFRESH TASKS =====
            setInterval(() => {
                if (isOnline) {
                    fetchTasks();
                }
            }, 30000);

            // ===== INIT =====
            currentUser = getCurrentUser();
            authToken = getAuthToken();

            if (!currentUser || !authToken) {
                window.location.href = '/login.html';
            } else {
                initMap();
            }
        })();
    </script>
</body>
</html>
