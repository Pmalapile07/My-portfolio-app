<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Helper</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=block">
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Config -->
    <script src="/config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #000;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-size: 24px !important;
            line-height: 1 !important;
        }

        /* === FULLSCREEN MAP - DARK STYLE === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* === HEADER === */
        .helper-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 90px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
            pointer-events: none;
        }

        .header-left, .header-right {
            pointer-events: auto;
        }

        .profile-menu-btn {
            background: #000000;
            border: none;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .profile-menu-btn .material-symbols-outlined {
            color: white !important;
            font-size: 24px !important;
        }

        .profile-menu-btn:active {
            transform: scale(0.9);
        }

        .online-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #000000;
            padding: 10px 16px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            transition: background 0.2s;
        }

        .status-dot.offline {
            background: #ef4444;
        }

        .status-text {
            color: white;
            font-size: 0.85rem;
            font-weight: 200;
        }

        /* === ROUTE OVERLAY === */
        .route-info {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 12px 20px;
            z-index: 200;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 400;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            white-space: nowrap;
        }

        .route-info.active {
            display: flex;
        }

        .route-info .material-symbols-outlined {
            color: #000000 !important;
            font-size: 20px !important;
        }

        .route-info span {
            color: #000000;
            font-size: 0.9rem;
            font-weight: 300;
        }

        /* === EARNINGS WIDGET === */
        .earnings-widget {
            position: fixed;
            bottom: 120px;
            left: 20px;
            background: #000000;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            color: white;
            z-index: 200;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .earnings-widget .material-symbols-outlined {
            color: white !important;
            font-size: 20px !important;
        }

        .earnings-widget span {
            color: white;
            font-size: 0.9rem;
            font-weight: 200;
        }

        /* === TASKS SHEET - MATCHING TASK PLANNER AESTHETIC === */
        .tasks-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            z-index: 10;
            max-height: 35%;
            display: flex;
            flex-direction: column;
            transition: max-height 0.3s ease;
        }

        .tasks-sheet.expanded {
            max-height: 70%;
        }

        .sheet-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sheet-header h3 {
            font-size: 1.1rem;
            font-weight: 400;
            color: #000000;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
        }

        .sheet-header .material-symbols-outlined {
            font-size: 20px !important;
            color: #000000 !important;
        }

        .sheet-header .expand-icon {
            transition: transform 0.3s;
            color: #000000 !important;
        }

        .tasks-sheet.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        /* === TASK CARDS - MATCHING TASK PLANNER === */
        .task-card {
            background: #f8f9fa;
            padding: 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .task-card:hover {
            background: #f0f0f0;
        }

        .task-card.selected {
            background: #f0f0f0;
            border-left: 4px solid #000000;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .task-distance {
            background: #000000;
            color: white;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 200;
            letter-spacing: 0.3px;
        }

        .task-budget {
            font-weight: 400;
            color: #000000;
            font-size: 1rem;
        }

        .task-budget.open {
            color: #000000;
            opacity: 0.7;
        }

        .task-location {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 12px;
            font-weight: 200;
        }

        .task-location .material-symbols-outlined {
            font-size: 16px !important;
            color: #000000 !important;
        }

        .task-meta {
            display: flex;
            gap: 20px;
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 16px;
            font-weight: 200;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-meta .material-symbols-outlined {
            font-size: 14px !important;
            color: #000000 !important;
        }

        .poster-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }

        .poster-avatar {
            width: 36px;
            height: 36px;
            background: #000000;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 200;
            overflow: hidden;
            font-size: 0.9rem;
        }

        .poster-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-details {
            flex: 1;
        }

        .poster-name {
            font-weight: 300;
            color: #000000;
            font-size: 0.9rem;
        }

        .poster-rating {
            display: flex;
            align-items: center;
            gap: 2px;
            color: #000000;
            font-size: 0.7rem;
            font-weight: 200;
            opacity: 0.7;
        }

        .poster-rating .material-symbols-outlined {
            font-size: 14px !important;
            color: #000000 !important;
        }

        .task-expanded {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .task-card.expanded .task-expanded {
            max-height: 300px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .task-expanded p {
            font-weight: 200;
            color: #666;
            margin-bottom: 16px;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            font-weight: 400;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Manrope', sans-serif;
        }

        .accept-btn {
            background: #000000;
            color: white;
        }

        .accept-btn:hover {
            background: #333333;
        }

        .accept-btn .material-symbols-outlined {
            color: white !important;
            font-size: 20px !important;
        }

        .offer-btn {
            background: #000000;
            color: white;
        }

        .offer-btn:hover {
            background: #333333;
        }

        .offer-input {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .offer-input input {
            flex: 1;
            padding: 12px;
            background-color: #f0f0f0;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.9rem;
            font-weight: 200;
            outline: none;
        }

        .offer-input input:focus {
            outline: 2px solid rgba(0,0,0,0.2);
        }

        .offer-input input::placeholder {
            color: rgba(0,0,0,0.4);
            font-weight: 200;
        }

        .offer-input button {
            padding: 12px 20px;
            background: #000000;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
            font-size: 0.9rem;
        }

        .offer-input button:hover {
            background: #333333;
        }

        /* === TOAST === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #000000;
            color: white;
            padding: 14px 20px;
            z-index: 3000;
            display: none;
            font-size: 0.9rem;
            font-weight: 200;
            text-align: center;
            border: none;
        }

        .toast.show {
            display: block;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .toast.success { background: #000000; }
        .toast.error { background: #000000; }

        /* === LOADING STATES === */
        .loading-tasks {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-weight: 200;
        }

        .no-tasks {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-weight: 200;
        }

        /* === TABLET/DESKTOP === */
        @media (min-width: 768px) {
            .tasks-sheet {
                left: 20px;
                right: auto;
                width: 400px;
                bottom: 20px;
                max-height: 60%;
            }

            .earnings-widget {
                left: 440px;
            }
        }
    </style>
</head>
<body>
    <!-- MAP -->
    <div id="map"></div>

    <!-- Route Info -->
    <div class="route-info" id="routeInfo">
        <span class="material-symbols-outlined">route</span>
        <span id="routeDistance">0 km</span>
        <span id="routeDuration">• 0 min</span>
    </div>

    <!-- Earnings Widget -->
    <div class="earnings-widget" id="earningsWidget">
        <span class="material-symbols-outlined">payments</span>
        <span id="earningsTotal">R 0</span>
    </div>

    <!-- Header -->
    <div class="helper-header">
        <div class="header-left">
            <button class="profile-menu-btn" id="profileMenuBtn">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </div>
        <div class="header-right">
            <div class="online-toggle" id="onlineToggle">
                <span class="status-dot" id="statusDot"></span>
                <span class="status-text" id="statusText">Available</span>
            </div>
        </div>
    </div>

    <!-- Tasks Sheet -->
    <div class="tasks-sheet" id="tasksSheet">
        <div class="sheet-header" id="sheetHeader">
            <h3>
                <span class="material-symbols-outlined">search</span>
                Tasks nearby
            </h3>
            <span class="material-symbols-outlined expand-icon">expand_less</span>
        </div>

        <div class="sheet-content" id="sheetContent">
            <div class="loading-tasks">
                <div>Finding tasks near you...</div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Profile Menu Container -->
    <div id="profile-menu-container"></div>

    <script>
        (function() {
            'use strict';

            const API_BASE_URL = ''; // Same server

            // ===== STATE =====
            let currentUser = null;
            let currentLat = null;
            let currentLng = null;
            let availableTasks = [];
            let markers = [];
            let startMarker = null;
            let endMarker = null;
            let map = null;
            let isOnline = true;
            let selectedTaskId = null;
            let earningsTotal = 0;
            let authToken = null;

            // ===== DOM ELEMENTS =====
            const tasksSheet = document.getElementById('tasksSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const sheetContent = document.getElementById('sheetContent');
            const toast = document.getElementById('toast');
            const earningsTotalSpan = document.getElementById('earningsTotal');
            const earningsWidget = document.getElementById('earningsWidget');
            const profileMenuBtn = document.getElementById('profileMenuBtn');
            const routeInfo = document.getElementById('routeInfo');
            const routeDistance = document.getElementById('routeDistance');
            const routeDuration = document.getElementById('routeDuration');
            const onlineToggle = document.getElementById('onlineToggle');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            // ===== TOAST =====
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.className = 'toast ' + type + ' show';
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== GET USER =====
            function getCurrentUser() {
                try {
                    const user = localStorage.getItem('taskmart_user');
                    return user ? JSON.parse(user) : null;
                } catch (e) {
                    return null;
                }
            }

            function getAuthToken() {
                return localStorage.getItem('taskmart_token');
            }

            // ===== LOAD PROFILE MENU =====
            fetch('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/profile-menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('profile-menu-container').innerHTML = html;
                    const scripts = document.getElementById('profile-menu-container').getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        const script = document.createElement('script');
                        script.textContent = scripts[i].textContent;
                        document.body.appendChild(script);
                    }
                })
                .catch(error => console.error('Failed to load profile menu:', error));

            // ===== MAP INIT =====
            function initMap() {
                if (!window.MAPBOX_TOKEN) {
                    console.error('No Mapbox token');
                    return;
                }

                mapboxgl.accessToken = window.MAPBOX_TOKEN;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [28.034088, -26.195246],
                    zoom: 13
                });

                map.on('load', () => {
                    // Add route source for drawing paths
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: []
                            }
                        }
                    });

                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#000000',
                            'line-width': 3,
                            'line-opacity': 0.8
                        }
                    });

                    getUserLocation();
                });
            }

            // ===== GET LOCATION =====
            function getUserLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            currentLat = pos.coords.latitude;
                            currentLng = pos.coords.longitude;
                            
                            map.flyTo({ center: [currentLng, currentLat], zoom: 14 });
                            
                            if (startMarker) startMarker.remove();
                            startMarker = new mapboxgl.Marker({ color: '#000000' })
                                .setLngLat([currentLng, currentLat])
                                .setPopup(new mapboxgl.Popup().setHTML('You are here'))
                                .addTo(map);

                            fetchTasks();
                        },
                        (error) => {
                            console.error('Location error:', error);
                            fetchTasks();
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }

            // ===== FETCH TASKS =====
            async function fetchTasks() {
                sheetContent.innerHTML = '<div class="loading-tasks">Finding tasks near you...</div>';

                try {
                    // Fetch tasks from Firebase endpoint
                    const response = await fetch(`${API_BASE_URL}/api/firebase/tasks`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        let tasks = data.tasks || [];

                        // Filter out user's own tasks and only show open tasks
                        if (currentUser) {
                            tasks = tasks.filter(task => 
                                task.userId !== currentUser.email && 
                                task.status === 'open'
                            );
                        }

                        availableTasks = tasks;

                        if (tasks.length === 0) {
                            sheetContent.innerHTML = '<div class="no-tasks">No tasks available nearby</div>';
                        } else {
                            renderTasks(tasks);
                            addTaskMarkers(tasks);
                        }
                    } else {
                        sheetContent.innerHTML = '<div class="no-tasks">Unable to load tasks</div>';
                    }
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                    sheetContent.innerHTML = '<div class="no-tasks">Error loading tasks</div>';
                }
            }

            // ===== CALCULATE DISTANCE & ROUTE =====
            async function calculateRoute(taskId) {
                const task = availableTasks.find(t => t.id === taskId);
                if (!task || !task.coordinates || !currentLat || !currentLng) {
                    showToast('Cannot calculate route', 'error');
                    return;
                }

                // Parse coordinates (lat,lng format from task planner)
                const [taskLat, taskLng] = task.coordinates.split(',').map(Number);

                selectedTaskId = taskId;

                // Remove previous end marker
                if (endMarker) endMarker.remove();

                // Add task marker
                endMarker = new mapboxgl.Marker({ color: '#000000' })
                    .setLngLat([taskLng, taskLat])
                    .setPopup(new mapboxgl.Popup().setHTML(task.taskDescription || 'Task location'))
                    .addTo(map);

                // Fit bounds to show both markers
                const bounds = new mapboxgl.LngLatBounds();
                bounds.extend([currentLng, currentLat]);
                bounds.extend([taskLng, taskLat]);
                map.fitBounds(bounds, { padding: 50 });

                try {
                    // Get route from Mapbox Directions API
                    const response = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    if (response.ok) {
                        const data = await response.json();
                        const route = data.routes[0];
                        const distance = route.distance; // meters
                        const duration = Math.round(route.duration / 60); // minutes

                        // Format distance
                        let distanceStr = distance < 1000 
                            ? Math.round(distance) + 'm' 
                            : (distance / 1000).toFixed(1) + 'km';

                        // Update route info
                        routeDistance.textContent = distanceStr;
                        routeDuration.textContent = `• ${duration} min`;
                        routeInfo.classList.add('active');

                        // Draw route on map
                        map.getSource('route').setData({
                            type: 'Feature',
                            geometry: route.geometry
                        });

                        // Update task card
                        document.querySelectorAll('.task-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        const selectedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                        if (selectedCard) {
                            selectedCard.classList.add('selected');
                            
                            // Update distance badge
                            const badge = selectedCard.querySelector('.task-distance');
                            if (badge) badge.textContent = distanceStr;
                        }
                    }
                } catch (error) {
                    console.error('Route error:', error);
                }
            }

            // ===== RENDER TASKS =====
            function renderTasks(tasks) {
                let html = '';

                tasks.forEach(task => {
                    const taskId = task.id;
                    const budget = task.budgetAmount;
                    const isOpenOffer = task.budgetType === 'open';
                    const posterName = task.userName || 'Someone';
                    const posterInitial = posterName.charAt(0).toUpperCase();

                    html += `
                        <div class="task-card" data-task-id="${taskId}" onclick="selectTask('${taskId}')">
                            <div class="task-header">
                                <span class="task-distance">?</span>
                                <span class="task-budget ${isOpenOffer ? 'open' : ''}">
                                    ${isOpenOffer ? 'Open to offers' : `R ${budget}`}
                                </span>
                            </div>
                            
                            <div class="task-location">
                                <span class="material-symbols-outlined">location_on</span>
                                <span>${task.location || 'Location not specified'}</span>
                            </div>
                            
                            <div class="task-meta">
                                <span>
                                    <span class="material-symbols-outlined">schedule</span>
                                    ${task.when === 'now' ? 'Now' : (task.scheduledTime || 'Flexible')}
                                </span>
                                <span>
                                    <span class="material-symbols-outlined">person</span>
                                    ${posterName.split(' ')[0]}
                                </span>
                            </div>
                            
                            <div class="poster-info">
                                <div class="poster-avatar">
                                    ${posterInitial}
                                </div>
                                <div class="poster-details">
                                    <div class="poster-name">${posterName}</div>
                                    <div class="poster-rating">
                                        <span class="material-symbols-outlined">star</span>
                                        <span>4.9</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="task-expanded">
                                ${task.moreDetails ? `<p>${task.moreDetails}</p>` : ''}
                                
                                ${isOpenOffer ? `
                                    <div class="offer-input">
                                        <input type="number" id="offer-${taskId}" placeholder="Your offer (R)" min="1">
                                        <button onclick="event.stopPropagation(); makeOffer('${taskId}')">Send</button>
                                    </div>
                                ` : `
                                    <button class="action-btn accept-btn" onclick="event.stopPropagation(); acceptTask('${taskId}', ${budget})">
                                        <span class="material-symbols-outlined">check_circle</span>
                                        Accept Task
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                });

                sheetContent.innerHTML = html;
            }

            // ===== SELECT TASK =====
            window.selectTask = function(taskId) {
                const card = document.querySelector(`[data-task-id="${taskId}"]`);
                if (card) {
                    card.classList.toggle('expanded');
                    calculateRoute(taskId);
                }
            };

            // ===== MAKE OFFER =====
            window.makeOffer = async function(taskId) {
                const input = document.getElementById(`offer-${taskId}`);
                const amount = parseFloat(input.value);
                
                if (!amount || amount < 1) {
                    showToast('Enter a valid amount', 'error');
                    return;
                }

                if (!isOnline) {
                    showToast('Set your status to available', 'error');
                    return;
                }

                showToast('Offer sent! Waiting for response.', 'success');
                input.value = '';
                
                // In a real implementation, you'd call your backend here
                // await fetch(`${API_BASE_URL}/api/firebase/tasks/${taskId}/offer`, {...})
            };

            // ===== ACCEPT TASK =====
            window.acceptTask = async function(taskId, budget) {
                if (!isOnline) {
                    showToast('Set your status to available', 'error');
                    return;
                }

                const task = availableTasks.find(t => t.id === taskId);
                if (!task) return;

                // In a real implementation, you'd call your backend here
                // await fetch(`${API_BASE_URL}/api/firebase/tasks/${taskId}`, {
                //     method: 'PATCH',
                //     body: JSON.stringify({ status: 'in-progress' })
                // });

                showToast('Task accepted! You can now help.', 'success');
                
                // Add to earnings
                if (budget) {
                    earningsTotal += budget;
                    earningsTotalSpan.textContent = `R ${earningsTotal}`;
                    localStorage.setItem('helper_earnings', earningsTotal);
                }

                // Remove task from list
                availableTasks = availableTasks.filter(t => t.id !== taskId);
                renderTasks(availableTasks);
                
                // Clear route
                routeInfo.classList.remove('active');
                if (endMarker) endMarker.remove();
                map.getSource('route').setData({
                    type: 'Feature',
                    geometry: { type: 'LineString', coordinates: [] }
                });
            };

            // ===== ADD MARKERS =====
            function addTaskMarkers(tasks) {
                // Clear existing markers
                if (window.taskMarkers) {
                    window.taskMarkers.forEach(marker => marker.remove());
                }
                window.taskMarkers = [];

                tasks.forEach(task => {
                    if (task.coordinates) {
                        const [lat, lng] = task.coordinates.split(',').map(Number);
                        
                        const marker = new mapboxgl.Marker({ color: '#000000' })
                            .setLngLat([lng, lat])
                            .setPopup(new mapboxgl.Popup().setHTML(`
                                <div style="font-family: 'Manrope', sans-serif; padding: 8px;">
                                    <strong>${task.taskDescription || 'Help needed'}</strong><br>
                                    ${task.budgetType === 'open' ? 'Open to offers' : 'R ' + task.budgetAmount}
                                </div>
                            `))
                            .addTo(map);
                        
                        window.taskMarkers.push(marker);
                    }
                });
            }

            // ===== ONLINE TOGGLE =====
            onlineToggle.addEventListener('click', () => {
                isOnline = !isOnline;
                statusDot.className = isOnline ? 'status-dot' : 'status-dot offline';
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                showToast(`You are now ${isOnline ? 'available' : 'offline'}`, 'success');
            });

            // ===== SHEET TOGGLE =====
            sheetHeader.addEventListener('click', () => {
                tasksSheet.classList.toggle('expanded');
            });

            // ===== EARNINGS WIDGET =====
            earningsWidget.addEventListener('click', () => {
                showToast(`Total earnings: R ${earningsTotal}`, 'success');
            });

            // ===== PROFILE MENU =====
            profileMenuBtn.addEventListener('click', () => {
                // Open profile menu (handled by loaded menu)
                const menuBtn = document.getElementById('profileMenuBtn');
                if (menuBtn) menuBtn.click();
            });

            // ===== AUTO REFRESH TASKS =====
            setInterval(() => {
                if (isOnline) {
                    fetchTasks();
                }
            }, 30000); // Refresh every 30 seconds

            // ===== INIT =====
            currentUser = getCurrentUser();
            authToken = getAuthToken();

            if (!currentUser || !authToken) {
                window.location.href = '/login.html';
            } else {
                // Load earnings
                const savedEarnings = localStorage.getItem('helper_earnings');
                if (savedEarnings) {
                    earningsTotal = parseInt(savedEarnings);
                    earningsTotalSpan.textContent = `R ${earningsTotal}`;
                }

                // Initialize map
                initMap();
            }
        })();
    </script>
</body>
</html>
