<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMart · Helper</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=block">
    
    <!-- Custom Font -->
    <style>
        @font-face {
            font-family: 'Codec Cold News';
            src: url('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/Codec-Cold-News-trial.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }
    </style>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Config -->
    <script src="/config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #000;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-size: 24px !important;
            line-height: 1 !important;
        }

        /* === FULLSCREEN MAP - DARK STYLE === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* === CUSTOM MARKERS === */
        .helper-marker {
            width: 24px;
            height: 24px;
            background: black;
            border: 2px solid white;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .helper-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: white;
            animation: pulse-white 1.5s infinite;
        }

        .poster-marker {
            width: 24px;
            height: 24px;
            background: black;
            border: 2px solid white;
            border-radius: 50%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .poster-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse-white 1.5s infinite;
        }

        @keyframes pulse-white {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.5; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        /* === RIGHT SIDE HEADER SECTION - STACKED VERTICALLY === */
        .right-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            pointer-events: none;
        }

        .online-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            pointer-events: auto;
            border: none;
            width: fit-content;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #000;
            transition: background 0.2s;
        }

        .status-dot.offline {
            background: #ccc;
        }

        .status-text {
            color: #000;
            font-size: 0.85rem;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.3px;
        }

        /* Route info - only shows when task selected */
        .route-info {
            background: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 400;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            white-space: nowrap;
            border: none;
            width: fit-content;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .route-info.active {
            opacity: 1;
        }

        .route-info .material-symbols-outlined {
            color: #000 !important;
            font-size: 18px !important;
        }

        .route-info span {
            color: #000;
            font-size: 0.8rem;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
        }

        /* === NOTIFICATION SECTION === */
        .notification-section {
            position: fixed;
            top: 104px;
            right: 20px;
            z-index: 100;
            pointer-events: auto;
            width: fit-content;
        }

        .notification-bell {
            background: white;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            position: relative;
            width: fit-content;
        }

        .bell-icon {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .bell-icon .material-symbols-outlined {
            color: #000;
            font-size: 20px !important;
        }

        .bell-text {
            color: #000;
            font-size: 0.8rem;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
        }

        .notification-badge {
            background: #000;
            color: white;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: 400;
            margin-left: 4px;
        }

        .notification-dropdown {
            position: absolute;
            top: 50px;
            right: 0;
            width: 300px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: none;
            z-index: 1000;
            max-height: 400px;
            overflow-y: auto;
        }

        .notification-dropdown.active {
            display: block;
        }

        .notification-header {
            padding: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .notification-item {
            padding: 1rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
            transition: background 0.2s;
        }

        .notification-item:hover {
            background: #f5f5f5;
        }

        .notification-item.unread {
            background: #f0f0f0;
        }

        .notification-title {
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 0.25rem;
        }

        .notification-meta {
            font-size: 0.75rem;
            color: #666;
        }

        /* === TASKS SHEET === */
        .tasks-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            z-index: 10;
            max-height: 35%;
            display: flex;
            flex-direction: column;
            transition: max-height 0.3s ease;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .tasks-sheet.expanded {
            max-height: 70%;
        }

        .sheet-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }

        .sheet-header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .sheet-header-left h3 {
            font-size: 0.9rem;
            font-weight: 400;
            color: #000;
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .expand-icon {
            transition: transform 0.3s;
            color: #000 !important;
            font-size: 20px !important;
            cursor: pointer;
            user-select: none;
        }

        .tasks-sheet.expanded .expand-icon {
            transform: rotate(180deg);
        }

        .sheet-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px;
        }

        /* === TASK CARDS - CLEAN SPACING === */
        .task-card {
            padding: 16px 0;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .task-card:last-child {
            border-bottom: none;
        }

        .task-card:hover {
            opacity: 0.7;
        }

        .task-card.matched {
            border-left: 3px solid #000;
            padding-left: 12px;
        }

        /* Top row - Title and Price */
        .task-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .task-title {
            font-size: 1rem;
            font-weight: 600;
            color: #000;
            font-family: 'Manrope', sans-serif;
            line-height: 1.3;
            flex: 1;
        }

        .task-price {
            font-size: 1rem;
            font-weight: 600;
            color: #000;
            font-family: 'Manrope', sans-serif;
            white-space: nowrap;
            margin-left: 12px;
        }

        .task-price.open {
            font-weight: 400;
            font-size: 0.85rem;
            color: #666;
        }

        /* Skill match badge - no star */
        .skill-match {
            font-size: 0.7rem;
            color: #000;
            background: #f0f0f0;
            display: inline-block;
            padding: 2px 8px;
            font-weight: 300;
            width: fit-content;
        }

        /* Meta row - Location and Time */
        .task-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: #666;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        .task-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .task-meta .material-symbols-outlined {
            font-size: 14px !important;
            color: #999 !important;
        }

        /* Poster info - Subtle */
        .poster-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .poster-avatar {
            width: 24px;
            height: 24px;
            background: #f0f0f0;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 300;
            overflow: hidden;
            font-size: 0.7rem;
            font-family: 'Manrope', sans-serif;
        }

        .poster-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .poster-name {
            font-weight: 300;
            color: #666;
            font-size: 0.75rem;
            font-family: 'Manrope', sans-serif;
        }

        /* === BUTTON ROW FOR ACTIONS === */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid #000;
            background: transparent;
            font-weight: 400;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-family: 'Manrope', sans-serif;
            color: #000;
        }

        .action-btn:hover {
            background: #000;
            color: white;
        }

        .action-btn:hover .material-symbols-outlined {
            color: white !important;
        }

        .action-btn .material-symbols-outlined {
            font-size: 16px !important;
            color: #000 !important;
        }

        .action-btn.pass {
            border-color: #ccc;
            color: #999;
        }

        .action-btn.pass:hover {
            background: #f0f0f0;
            color: #666;
            border-color: #999;
        }

        /* === OFFER INPUT === */
        .offer-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .offer-input input {
            flex: 1;
            padding: 10px;
            background: #f5f5f5;
            border: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.8rem;
            font-weight: 300;
            outline: none;
        }

        .offer-input input:focus {
            background: #eee;
        }

        .offer-input input::placeholder {
            color: #999;
            font-weight: 300;
        }

        .offer-input button {
            padding: 10px 16px;
            background: #000;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 400;
            font-family: 'Manrope', sans-serif;
            font-size: 0.8rem;
        }

        .offer-input button:hover {
            background: #333;
        }

        /* Expanded section */
        .task-expanded {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
            margin-top: 0;
        }

        .task-card.expanded .task-expanded {
            max-height: 400px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .expanded-details {
            background: #fafafa;
            padding: 16px;
        }

        .expanded-details p {
            font-weight: 300;
            color: #333;
            margin-bottom: 12px;
            line-height: 1.5;
            font-size: 0.85rem;
            font-family: 'Manrope', sans-serif;
        }

        /* === IN-PROGRESS TASK CARD === */
        .in-progress-section {
            padding: 16px;
            background: #fafafa;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .in-progress-header {
            font-size: 0.8rem;
            font-weight: 400;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .in-progress-card {
            padding: 12px;
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 8px;
        }

        .in-progress-card:last-child {
            margin-bottom: 0;
        }

        .in-progress-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .in-progress-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.75rem;
            color: #666;
            font-weight: 300;
        }

        .in-progress-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .in-progress-meta .material-symbols-outlined {
            font-size: 14px !important;
            color: #999 !important;
        }

        .in-progress-status {
            display: inline-block;
            padding: 4px 8px;
            background: #f0f0f0;
            color: #000;
            font-size: 0.7rem;
            font-weight: 300;
            margin-top: 8px;
        }

        /* === MATCHING REQUESTS SECTION === */
        .matching-section {
            padding: 16px;
            background: #fff9f9;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .matching-header {
            font-size: 0.8rem;
            font-weight: 400;
            color: #000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .matching-card {
            padding: 12px;
            background: white;
            border: 1px solid #000;
            margin-bottom: 8px;
        }

        .matching-card:last-child {
            margin-bottom: 0;
        }

        .matching-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #000;
            margin-bottom: 8px;
        }

        .matching-poster {
            font-size: 0.75rem;
            color: #666;
            margin-bottom: 8px;
        }

        .matching-status {
            font-size: 0.7rem;
            color: #f59e0b;
            font-weight: 400;
            margin-bottom: 8px;
        }

        .confirm-btn {
            width: 100%;
            padding: 8px;
            background: #000;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        .confirm-btn:hover {
            background: #333;
        }

        /* === TOAST === */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            background: #000;
            color: white;
            padding: 12px 20px;
            z-index: 3000;
            display: none;
            font-size: 0.85rem;
            font-weight: 300;
            text-align: center;
            border: none;
            font-family: 'Manrope', sans-serif;
        }

        .toast.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading-tasks {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        .no-tasks {
            text-align: center;
            padding: 40px 20px;
            color: #999;
            font-weight: 300;
            font-family: 'Manrope', sans-serif;
        }

        @media (min-width: 768px) {
            .tasks-sheet {
                left: 20px;
                right: auto;
                width: 380px;
                bottom: 20px;
                max-height: 70%;
                border: 1px solid rgba(0,0,0,0.1);
            }
        }

        /* Profile menu container */
        #profile-menu-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Right Side Header Section - Stacked Vertically -->
    <div class="right-header">
        <div class="online-toggle" id="onlineToggle">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Available</span>
        </div>

        <div class="route-info" id="routeInfo">
            <span class="material-symbols-outlined">swap_driving_apps</span>
            <span id="routeDistance">0 km</span>
            <span class="material-symbols-outlined">fiber_manual_record</span>
            <span id="routeDuration">0 min</span>
        </div>
    </div>

    <!-- Notification Section -->
    <div class="notification-section">
        <div class="notification-bell" id="notificationBell">
            <div class="bell-icon">
                <span class="material-symbols-outlined">notifications</span>
                <span class="bell-text">Notifications</span>
                <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
            </div>
            <div class="notification-dropdown" id="notificationDropdown">
                <div class="notification-header">Notifications</div>
                <div id="notificationList"></div>
            </div>
        </div>
    </div>

    <div class="tasks-sheet" id="tasksSheet">
        <div class="sheet-header" id="sheetHeader">
            <div class="sheet-header-left">
                <span class="material-symbols-outlined expand-icon" id="expandIcon">expand_less</span>
                <h3>Tasks for you</h3>
            </div>
        </div>

        <div class="sheet-content" id="sheetContent">
            <div class="loading-tasks">
                <div>Finding tasks for you...</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <!-- Profile Menu Container -->
    <div id="profile-menu-container"></div>

    <script>
        (function() {
            'use strict';

            const API_BASE_URL = ''; // Same server

            // ===== STATE =====
            let currentUser = null;
            let currentLat = null;
            let currentLng = null;
            let availableTasks = [];
            let inProgressTasks = [];
            let matchingRequests = [];
            let markers = [];
            let startMarker = null;
            let endMarker = null;
            let map = null;
            let isOnline = true;
            let selectedTaskId = null;
            let authToken = null;
            let userSkills = [];
            let notifications = [];

            // ===== DOM ELEMENTS =====
            const tasksSheet = document.getElementById('tasksSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const expandIcon = document.getElementById('expandIcon');
            const sheetContent = document.getElementById('sheetContent');
            const toast = document.getElementById('toast');
            const routeInfo = document.getElementById('routeInfo');
            const routeDistance = document.getElementById('routeDistance');
            const routeDuration = document.getElementById('routeDuration');
            const onlineToggle = document.getElementById('onlineToggle');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const notificationBell = document.getElementById('notificationBell');
            const notificationDropdown = document.getElementById('notificationDropdown');
            const notificationBadge = document.getElementById('notificationBadge');
            const notificationList = document.getElementById('notificationList');

            // ===== NOTIFICATION SYSTEM =====
            function addNotification(title, message, taskId = null) {
                const notification = {
                    id: Date.now() + Math.random(),
                    title,
                    message,
                    taskId,
                    read: false,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                notifications.unshift(notification);
                updateNotificationBadge();
                renderNotifications();
                
                showToast(message);
                
                try {
                    const audio = new Audio('data:audio/wav;base64,UklGRlwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAAA8AP8A/gD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/gD/AP8=');
                    audio.play();
                } catch (e) {}
                
                localStorage.setItem('taskmart_notifications', JSON.stringify(notifications));
            }

            function updateNotificationBadge() {
                const unreadCount = notifications.filter(n => !n.read).length;
                if (unreadCount > 0) {
                    notificationBadge.style.display = 'inline-block';
                    notificationBadge.textContent = unreadCount;
                } else {
                    notificationBadge.style.display = 'none';
                }
            }

            function renderNotifications() {
                if (notifications.length === 0) {
                    notificationList.innerHTML = '<div style="padding: 2rem; text-align: center; color: #999;">No notifications</div>';
                    return;
                }
                
                notificationList.innerHTML = notifications.map(n => `
                    <div class="notification-item ${n.read ? '' : 'unread'}" data-id="${n.id}" data-task="${n.taskId || ''}">
                        <div class="notification-title">${n.title}</div>
                        <div class="notification-meta">${n.message} • ${n.timestamp}</div>
                    </div>
                `).join('');
                
                document.querySelectorAll('.notification-item').forEach(item => {
                    item.addEventListener('click', () => {
                        const id = item.dataset.id;
                        const taskId = item.dataset.task;
                        
                        const notification = notifications.find(n => n.id == id);
                        if (notification) {
                            notification.read = true;
                            updateNotificationBadge();
                            renderNotifications();
                        }
                        
                        if (taskId) {
                            selectTask(taskId);
                        }
                        
                        notificationDropdown.classList.remove('active');
                    });
                });
            }

            notificationBell.addEventListener('click', (e) => {
                e.stopPropagation();
                notificationDropdown.classList.toggle('active');
            });

            document.addEventListener('click', () => {
                notificationDropdown.classList.remove('active');
            });

            notificationDropdown.addEventListener('click', (e) => {
                e.stopPropagation();
            });

            function loadNotifications() {
                const saved = localStorage.getItem('taskmart_notifications');
                if (saved) {
                    notifications = JSON.parse(saved);
                    updateNotificationBadge();
                    renderNotifications();
                }
            }

            // ===== TOAST =====
            function showToast(message) {
                toast.textContent = message;
                toast.className = 'toast show';
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== GET USER =====
            function getCurrentUser() {
                try {
                    const user = localStorage.getItem('taskmart_user');
                    return user ? JSON.parse(user) : null;
                } catch (e) {
                    return null;
                }
            }

            function getAuthToken() {
                return localStorage.getItem('taskmart_token');
            }

            // ===== LOAD PROFILE MENU =====
            fetch('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/profile-menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('profile-menu-container').innerHTML = html;
                    const scripts = document.getElementById('profile-menu-container').getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        const script = document.createElement('script');
                        script.textContent = scripts[i].textContent;
                        document.body.appendChild(script);
                    }
                })
                .catch(error => console.error('Failed to load profile menu:', error));

            // ===== CREATE CUSTOM MARKERS =====
            function createHelperMarker() {
                const el = document.createElement('div');
                el.className = 'helper-marker';
                return el;
            }

            function createPosterMarker() {
                const el = document.createElement('div');
                el.className = 'poster-marker';
                return el;
            }

            // ===== MAP INIT =====
            function initMap() {
                if (!window.MAPBOX_TOKEN) {
                    console.error('No Mapbox token');
                    return;
                }

                mapboxgl.accessToken = window.MAPBOX_TOKEN;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/dark-v11',
                    center: [28.034088, -26.195246],
                    zoom: 13
                });

                map.on('load', () => {
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: []
                            }
                        }
                    });

                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#666666',
                            'line-width': 3,
                            'line-opacity': 0.6
                        }
                    });

                    getUserLocation();
                });
            }

            // ===== GET LOCATION =====
            function getUserLocation() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            currentLat = pos.coords.latitude;
                            currentLng = pos.coords.longitude;
                            
                            map.flyTo({ center: [currentLng, currentLat], zoom: 14 });
                            
                            if (startMarker) startMarker.remove();
                            
                            const helperEl = createHelperMarker();
                            startMarker = new mapboxgl.Marker({ element: helperEl })
                                .setLngLat([currentLng, currentLat])
                                .setPopup(new mapboxgl.Popup().setHTML('<div style="font-family: Manrope; font-weight: 300;">You</div>'))
                                .addTo(map);

                            fetchTasks();
                        },
                        (error) => {
                            console.error('Location error:', error);
                            fetchTasks();
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                }
            }

            // ===== CHECK IF TASK MATCHES USER SKILLS =====
            function taskMatchesSkills(task) {
                if (!userSkills || userSkills.length === 0) return false;
                
                const taskLower = (task.taskDescription || '').toLowerCase();
                return userSkills.some(skill => taskLower.includes(skill.toLowerCase()));
            }

            // ===== FETCH TASKS =====
            let lastTaskCount = 0;
            
            async function fetchTasks() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/firebase/tasks`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        let tasks = data.tasks || [];

                        if (currentUser) {
                            tasks = tasks.filter(task => task.userId !== currentUser.email);
                            
                            inProgressTasks = tasks.filter(task => 
                                task.status === 'in-progress' && task.helperId === currentUser.email
                            );
                            
                            matchingRequests = tasks.filter(task => 
                                task.status === 'matching' && 
                                task.selectedHelperId === currentUser.email
                            );
                            
                            availableTasks = tasks.filter(task => 
                                task.status === 'open'
                            );
                        }

                        if (availableTasks.length > lastTaskCount && lastTaskCount > 0) {
                            const newTasks = availableTasks.slice(0, availableTasks.length - lastTaskCount);
                            newTasks.forEach(task => {
                                if (taskMatchesSkills(task)) {
                                    addNotification(
                                        'New Task Match!',
                                        `${task.taskDescription} - This matches your skills!`,
                                        task.id
                                    );
                                }
                            });
                        }
                        
                        lastTaskCount = availableTasks.length;

                        availableTasks.sort((a, b) => {
                            const aMatches = taskMatchesSkills(a);
                            const bMatches = taskMatchesSkills(b);
                            if (aMatches && !bMatches) return -1;
                            if (!aMatches && bMatches) return 1;
                            return 0;
                        });

                        renderTasks();
                        addTaskMarkers(availableTasks);
                    }
                } catch (error) {
                    console.error('Error fetching tasks:', error);
                }
            }

            // ===== CALCULATE ROUTE =====
            async function calculateRoute(taskId) {
                const task = availableTasks.find(t => t.id === taskId);
                if (!task || !task.coordinates || !currentLat || !currentLng) {
                    showToast('Cannot calculate route');
                    return;
                }

                const [taskLat, taskLng] = task.coordinates.split(',').map(Number);

                selectedTaskId = taskId;

                if (endMarker) endMarker.remove();

                const posterEl = createPosterMarker();
                endMarker = new mapboxgl.Marker({ element: posterEl })
                    .setLngLat([taskLng, taskLat])
                    .setPopup(new mapboxgl.Popup().setHTML(`<div style="font-family: Manrope; font-weight: 300;">${task.taskDescription}</div>`))
                    .addTo(map);

                const bounds = new mapboxgl.LngLatBounds();
                bounds.extend([currentLng, currentLat]);
                bounds.extend([taskLng, taskLat]);
                map.fitBounds(bounds, { padding: 50 });

                try {
                    const response = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    if (response.ok) {
                        const data = await response.json();
                        const route = data.routes[0];
                        const distance = route.distance;
                        const duration = Math.round(route.duration / 60);

                        let distanceStr = distance < 1000 
                            ? Math.round(distance) + 'm' 
                            : (distance / 1000).toFixed(1) + 'km';

                        routeDistance.textContent = distanceStr;
                        routeDuration.textContent = duration + 'min';
                        routeInfo.classList.add('active');

                        map.getSource('route').setData({
                            type: 'Feature',
                            geometry: route.geometry
                        });

                        document.querySelectorAll('.task-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        const selectedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                        if (selectedCard) {
                            selectedCard.classList.add('selected');
                            selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                } catch (error) {
                    console.error('Route error:', error);
                }
            }

            // ===== RENDER TASKS =====
            function renderTasks() {
                let html = '';

                // Matching Requests Section
                if (matchingRequests.length > 0) {
                    html += '<div class="matching-section">';
                    html += '<div class="matching-header">You\'ve Been Selected!</div>';
                    
                    matchingRequests.forEach(task => {
                        html += `
                            <div class="matching-card">
                                <div class="matching-title">${task.taskDescription}</div>
                                <div class="matching-poster">Posted by: ${task.userName || 'Someone'}</div>
                                <div class="matching-status">⏳ Waiting for your confirmation</div>
                                <button class="confirm-btn" onclick="confirmMatch('${task.id}')">
                                    Confirm & Start
                                </button>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }

                // In Progress Section
                if (inProgressTasks.length > 0) {
                    html += '<div class="in-progress-section">';
                    html += '<div class="in-progress-header">In Progress</div>';
                    
                    inProgressTasks.forEach(task => {
                        html += `
                            <div class="in-progress-card">
                                <div class="in-progress-title">${task.taskDescription}</div>
                                <div class="in-progress-meta">
                                    <span>
                                        <span class="material-symbols-outlined">location_on</span>
                                        ${task.location ? task.location.split(',')[0] : 'Nearby'}
                                    </span>
                                    <span>
                                        <span class="material-symbols-outlined">payments</span>
                                        R${task.budgetAmount || 'Open'}
                                    </span>
                                </div>
                                <div class="in-progress-status">Task in progress</div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }

                // Available Tasks
                if (availableTasks.length === 0) {
                    html += '<div class="no-tasks">No tasks available</div>';
                } else {
                    availableTasks.forEach(task => {
                        const taskId = task.id;
                        const budget = task.budgetAmount;
                        const isOpenOffer = task.budgetType === 'open';
                        const posterName = task.userName || 'Someone';
                        const posterAvatar = task.userAvatar || null;
                        const taskTitle = task.taskDescription || 'Help needed';
                        const isMatch = taskMatchesSkills(task);
                        const location = task.location ? task.location.split(',')[0] : 'Nearby';

                        let actionButtons = '';
                        
                        if (isOpenOffer) {
                            actionButtons = `
                                <div class="offer-input">
                                    <input type="number" id="offer-${taskId}" placeholder="Your offer (R)" min="1">
                                    <button onclick="event.stopPropagation(); makeOffer('${taskId}')">Make Offer</button>
                                </div>
                                <button class="action-btn pass" onclick="event.stopPropagation(); passOnTask('${taskId}')">
                                    <span class="material-symbols-outlined">close</span>
                                    Pass
                                </button>
                            `;
                        } else {
                            actionButtons = `
                                <div class="action-row">
                                    <button class="action-btn" onclick="event.stopPropagation(); expressInterest('${taskId}', ${budget})">
                                        <span class="material-symbols-outlined">handshake</span>
                                        I'm interested
                                    </button>
                                    <button class="action-btn pass" onclick="event.stopPropagation(); passOnTask('${taskId}')">
                                        <span class="material-symbols-outlined">close</span>
                                        Pass
                                    </button>
                                </div>
                            `;
                        }

                        html += `
                            <div class="task-card ${isMatch ? 'matched' : ''}" data-task-id="${taskId}" onclick="selectTask('${taskId}')">
                                ${isMatch ? '<div class="skill-match">Matches your skills</div>' : ''}
                                
                                <div class="task-row-top">
                                    <div class="task-title">${taskTitle}</div>
                                    <div class="task-price ${isOpenOffer ? 'open' : ''}">
                                        ${isOpenOffer ? 'Open' : `R${budget}`}
                                    </div>
                                </div>
                                
                                <div class="task-meta">
                                    <span>
                                        <span class="material-symbols-outlined">location_on</span>
                                        ${location}
                                    </span>
                                    <span>
                                        <span class="material-symbols-outlined">schedule</span>
                                        ${task.when === 'now' ? 'Now' : (task.scheduledTime || 'Flexible')}
                                    </span>
                                </div>
                                
                                <div class="poster-info">
                                    <div class="poster-avatar">
                                        ${posterAvatar ? `<img src="${posterAvatar}" alt="${posterName}">` : posterName.charAt(0).toUpperCase()}
                                    </div>
                                    <div class="poster-name">${posterName}</div>
                                </div>
                                
                                <div class="task-expanded">
                                    <div class="expanded-details">
                                        ${task.moreDetails ? `<p>${task.moreDetails}</p>` : ''}
                                        ${actionButtons}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                }

                sheetContent.innerHTML = html;
            }

            // ===== EXPRESS INTEREST =====
            window.expressInterest = async function(taskId, budget) {
                if (!isOnline) {
                    showToast('Set status to available');
                    return;
                }

                const task = availableTasks.find(t => t.id === taskId);
                if (!task) return;

                const interestData = {
                    taskId: taskId,
                    taskDescription: task.taskDescription,
                    helperId: currentUser.email,
                    helperName: currentUser.name,
                    helperAvatar: currentUser.profileImage,
                    budget: budget,
                    timestamp: Date.now(),
                    type: 'interest'
                };
                
                localStorage.setItem('taskmart_interest_' + taskId, JSON.stringify(interestData));
                
                showToast('Interest sent to poster!');
                
                addNotification(
                    'Interest Sent',
                    `You expressed interest in: ${task.taskDescription}`,
                    taskId
                );
            };

            // ===== MAKE OFFER =====
            window.makeOffer = async function(taskId) {
                const input = document.getElementById(`offer-${taskId}`);
                const amount = parseFloat(input.value);
                
                if (!amount || amount < 1) {
                    showToast('Enter a valid amount');
                    return;
                }

                if (!isOnline) {
                    showToast('Set status to available');
                    return;
                }

                const task = availableTasks.find(t => t.id === taskId);
                if (!task) return;

                const offerData = {
                    taskId: taskId,
                    taskDescription: task.taskDescription,
                    helperId: currentUser.email,
                    helperName: currentUser.name,
                    helperAvatar: currentUser.profileImage,
                    amount: amount,
                    timestamp: Date.now(),
                    type: 'offer'
                };
                
                localStorage.setItem('taskmart_offer_' + taskId, JSON.stringify(offerData));
                
                showToast('Offer sent! Waiting for poster to respond.');
                input.value = '';
                
                addNotification(
                    'Offer Sent',
                    `You offered R${amount} for: ${task.taskDescription}`,
                    taskId
                );
            };

            // ===== PASS ON TASK =====
            window.passOnTask = async function(taskId) {
                showToast('Task passed');
            };

            // ===== CONFIRM MATCH =====
            window.confirmMatch = async function(taskId) {
                const task = matchingRequests.find(t => t.id === taskId);
                if (!task) return;

                task.status = 'in-progress';
                inProgressTasks.unshift(task);
                matchingRequests = matchingRequests.filter(t => t.id !== taskId);
                
                renderTasks();
                
                showToast('Match confirmed! Task is now in progress.');
                
                addNotification(
                    'Match Confirmed',
                    `You confirmed: ${task.taskDescription}`,
                    taskId
                );
            };

            // ===== SELECT TASK =====
            window.selectTask = function(taskId) {
                const card = document.querySelector(`[data-task-id="${taskId}"]`);
                if (card) {
                    const wasExpanded = card.classList.contains('expanded');
                    
                    document.querySelectorAll('.task-card').forEach(c => {
                        if (c.dataset.taskId !== taskId) {
                            c.classList.remove('expanded');
                        }
                    });
                    
                    card.classList.toggle('expanded');
                    
                    if (!wasExpanded) {
                        calculateRoute(taskId);
                    }
                }
            };

            // ===== ADD MARKERS =====
            function addTaskMarkers(tasks) {
                if (window.taskMarkers) {
                    window.taskMarkers.forEach(marker => marker.remove());
                }
                window.taskMarkers = [];

                tasks.forEach(task => {
                    if (task.coordinates) {
                        const [lat, lng] = task.coordinates.split(',').map(Number);
                        
                        const posterEl = createPosterMarker();
                        const marker = new mapboxgl.Marker({ element: posterEl })
                            .setLngLat([lng, lat])
                            .setPopup(new mapboxgl.Popup().setHTML(`
                                <div style="font-family: 'Manrope', sans-serif; font-weight: 300; padding: 8px;">
                                    <strong>${task.taskDescription || 'Help needed'}</strong><br>
                                    ${task.budgetType === 'open' ? 'Open to offers' : 'R' + task.budgetAmount}
                                </div>
                            `))
                            .addTo(map);
                        
                        window.taskMarkers.push(marker);
                    }
                });
            }

            // ===== ONLINE TOGGLE =====
            onlineToggle.addEventListener('click', () => {
                isOnline = !isOnline;
                statusDot.className = isOnline ? 'status-dot' : 'status-dot offline';
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                showToast(`You are now ${isOnline ? 'available' : 'offline'}`);
            });

            // ===== SHEET TOGGLE =====
            expandIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                tasksSheet.classList.toggle('expanded');
            });

            // ===== AUTO REFRESH TASKS =====
            setInterval(() => {
                if (isOnline) {
                    fetchTasks();
                }
            }, 10000);

            // ===== INIT =====
            currentUser = getCurrentUser();
            authToken = getAuthToken();

            if (currentUser) {
                userSkills = currentUser.skills || [];
                console.log('User skills loaded:', userSkills);
            }

            if (!currentUser || !authToken) {
                window.location.href = '/login.html';
            } else {
                loadNotifications();
                initMap();
            }
        })();
    </script>
</body>
</html>
