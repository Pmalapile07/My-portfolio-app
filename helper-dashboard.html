    </style>
</head>
<body>
    <!-- Debug Console -->
    <div class="debug-console" id="debugConsole">
        <div class="debug-header">
            <span class="debug-title">🔍 DEBUG CONSOLE</span>
            <span class="debug-close" onclick="document.getElementById('debugConsole').classList.remove('visible')">✕</span>
        </div>
        <div id="debugLogs"></div>
    </div>

    <button class="debug-btn" onclick="document.getElementById('debugConsole').classList.add('visible')">Show Debug</button>

    <div id="map"></div>

    <!-- Notification Popup -->
    <div class="notification-popup" id="notificationPopup">
        <div class="title" id="popupTitle">New Task Available</div>
        <div class="distance" id="popupDistance"></div>
        <div class="poster" id="popupPoster"></div>
        <div class="actions">
            <button class="accept-btn" id="popupAccept">Accept</button>
            <button class="schedule-btn" id="popupSchedule">Schedule</button>
            <button class="decline-btn" id="popupDecline">Decline</button>
        </div>
    </div>

    <!-- Navigation Menu - Left Side -->
    <div class="nav-menu">
        <button class="menu-icon" id="profileMenuBtn">
            <span class="material-symbols-outlined">menu</span>
        </button>
    </div>

    <!-- Right Side Stack -->
    <div class="right-stack">
        <button class="availability-card" id="onlineToggle">
            <span class="status-dot" id="statusDot"></span>
            <span class="status-text" id="statusText">Available</span>
        </button>

        <div class="earnings-card">
            <span class="earnings-label">today</span>
            <span class="earnings-amount" id="todayEarnings">R0</span>
        </div>

        <button class="notification-bell" id="notificationBell">
            <span class="material-symbols-outlined">notifications</span>
            <span class="notification-badge" id="notificationBadge" style="display: none;">0</span>
        </button>
    </div>

    <!-- Floating Distance Card -->
    <div class="floating-distance-card" id="floatingDistanceCard">
        <span class="material-symbols-outlined" id="routeIcon">directions_car</span>
        <span id="routeDistance">0 km</span>
        <span class="material-symbols-outlined">fiber_manual_record</span>
        <span id="routeDuration">0 min</span>
        <span class="material-symbols-outlined route-toggle-icon" id="routeToggle">sync_alt</span>
    </div>

    <!-- Full Screen Notifications Page -->
    <div class="notifications-fullscreen" id="notificationsFullscreen">
        <div class="notifications-header">
            <h2>Notifications</h2>
            <button class="close-notifications" id="closeNotificationsBtn">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <div class="notifications-content" id="notificationsFullContent">
            <!-- Notifications will be populated here -->
        </div>
    </div>

    <div class="tasks-sheet" id="tasksSheet">
        <div class="sheet-header" id="sheetHeader">
            <div class="sheet-header-left">
                <h3>Tasks near you</h3>
            </div>
            <span class="material-symbols-outlined expand-icon" id="expandIcon">expand_less</span>
        </div>

        <div class="sheet-content" id="sheetContent">
            <!-- Single skeleton card - reduced loading -->
            <div class="skeleton-card">
                <div class="skeleton-line short"></div>
                <div class="skeleton-line medium"></div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <audio id="notificationSound" preload="auto">
        <source src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/freesound_community-ding-101492.mp3" type="audio/mpeg">
    </audio>

    <div id="profile-menu-container"></div>

    <script>
        (function() {
            'use strict';

            // ===== FIREBASE CONFIG =====
            const firebaseConfig = {
                apiKey: "AIzaSyBi_srk36131SlYbhclVqlqsqobJJ917Pg",
                authDomain: "taskmartapp-74d6b.firebaseapp.com",
                databaseURL: "https://taskmartapp-74d6b-default-rtdb.firebaseio.com",
                projectId: "taskmartapp-74d6b",
                storageBucket: "taskmartapp-74d6b.firebasestorage.app",
                messagingSenderId: "52910279328",
                appId: "1:52910279328:web:f49ed0d56a09e5dead17c5"
            };

            // Initialize Firebase
            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const database = firebase.database();

            // Debug console functions
            const debugConsole = document.getElementById('debugConsole');
            const debugLogs = document.getElementById('debugLogs');
            
            function addDebugLog(message, type = 'info') {
                const logEntry = document.createElement('div');
                logEntry.className = `debug-log ${type === 'error' ? 'debug-error' : type === 'success' ? 'debug-success' : type === 'warning' ? 'debug-warning' : ''}`;
                logEntry.textContent = `> ${message}`;
                debugLogs.appendChild(logEntry);
                debugLogs.scrollTop = debugLogs.scrollHeight;
                
                // Also log to browser console
                console.log(`[DEBUG] ${message}`);
            }
            
            function clearDebugLogs() {
                debugLogs.innerHTML = '';
            }

            function showDebugConsole() {
                debugConsole.classList.add('visible');
            }

            let currentUser = null;
            let currentLat = null;
            let currentLng = null;
            let availableTasks = [];
            let inProgressTasks = [];
            let matchingRequests = [];
            let markers = [];
            let startMarker = null;
            let endMarker = null;
            let map = null;
            let isOnline = true;
            let selectedTaskId = null;
            let userSkills = [];
            let notifications = [];
            let todayEarnings = 0;
            let notificationSound = document.getElementById('notificationSound');
            let soundPlayedOnLoad = false;
            let isDriving = true;
            let drivingData = null;
            let walkingData = null;
            let currentNotificationTask = null;
            let notificationListener = null;

            // DOM Elements
            const tasksSheet = document.getElementById('tasksSheet');
            const sheetHeader = document.getElementById('sheetHeader');
            const expandIcon = document.getElementById('expandIcon');
            const sheetContent = document.getElementById('sheetContent');
            const toast = document.getElementById('toast');
            const floatingDistanceCard = document.getElementById('floatingDistanceCard');
            const routeIcon = document.getElementById('routeIcon');
            const routeDistance = document.getElementById('routeDistance');
            const routeDuration = document.getElementById('routeDuration');
            const routeToggle = document.getElementById('routeToggle');
            const onlineToggle = document.getElementById('onlineToggle');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const notificationBell = document.getElementById('notificationBell');
            const notificationBadge = document.getElementById('notificationBadge');
            const notificationsFullscreen = document.getElementById('notificationsFullscreen');
            const notificationsFullContent = document.getElementById('notificationsFullContent');
            const closeNotificationsBtn = document.getElementById('closeNotificationsBtn');
            const todayEarningsSpan = document.getElementById('todayEarnings');
            const profileMenuBtn = document.getElementById('profileMenuBtn');
            const notificationPopup = document.getElementById('notificationPopup');
            const popupTitle = document.getElementById('popupTitle');
            const popupDistance = document.getElementById('popupDistance');
            const popupPoster = document.getElementById('popupPoster');
            const popupAccept = document.getElementById('popupAccept');
            const popupSchedule = document.getElementById('popupSchedule');
            const popupDecline = document.getElementById('popupDecline');

            // ===== AUTH STATE OBSERVER =====
            auth.onAuthStateChanged(async (user) => {
                if (!user) {
                    addDebugLog('❌ No user logged in, redirecting to login', 'error');
                    window.location.href = '/login.html';
                    return;
                }

                try {
                    addDebugLog(`👤 User authenticated: ${user.email}`);
                    
                    // Fetch user data from database
                    const snapshot = await database.ref('users/' + user.uid).once('value');
                    const userData = snapshot.val();

                    if (!userData) {
                        addDebugLog('❌ User data not found in database', 'error');
                        await auth.signOut();
                        window.location.href = '/login.html';
                        return;
                    }

                    // Verify this is a helper account
                    if (userData.role !== 'helper') {
                        addDebugLog('❌ Not a helper account', 'error');
                        await auth.signOut();
                        window.location.href = '/login.html';
                        return;
                    }

                    // Set up current user
                    currentUser = {
                        email: user.email,
                        uid: user.uid,
                        name: userData.name,
                        phone: userData.phone,
                        skills: userData.skills || []
                    };

                    userSkills = currentUser.skills;
                    
                    addDebugLog(`✅ Helper logged in: ${currentUser.name}`, 'success');
                    addDebugLog(`🔑 Current user UID: ${currentUser.uid}`, 'info');
                    addDebugLog(`🎯 User skills: ${JSON.stringify(userSkills)}`, 'info');

                    // Load dashboard data
                    loadNotifications();
                    initMap();
                    
                    const savedEarnings = localStorage.getItem('taskmart_today_earnings');
                    if (savedEarnings) {
                        todayEarnings = parseInt(savedEarnings);
                        todayEarningsSpan.textContent = `R${todayEarnings}`;
                    }

                    // Set up notification listener
                    setupNotificationListener();

                } catch (error) {
                    addDebugLog(`❌ Error loading user data: ${error.message}`, 'error');
                    await auth.signOut();
                    window.location.href = '/login.html';
                }
            });

            // ===== SETUP NOTIFICATION LISTENER =====
            function setupNotificationListener() {
                if (!currentUser) return;
                
                // Remove old listener if exists
                if (notificationListener) {
                    database.ref('notifications/' + currentUser.uid).off('child_added', notificationListener);
                }
                
                // Listen for new notifications
                notificationListener = database.ref('notifications/' + currentUser.uid)
                    .orderByChild('createdAt')
                    .limitToLast(1)
                    .on('child_added', (snapshot) => {
                        const notification = snapshot.val();
                        
                        // Only show popup for new task notifications and when online
                        if (notification.type === 'new_task' && isOnline) {
                            showNotificationPopup(notification);
                        }
                        
                        // Play sound and update badge
                        playNotificationSound();
                        addDebugLog(`📢 New notification: ${notification.type}`, 'info');
                    });
            }

            // ===== SHOW NOTIFICATION POPUP =====
            function showNotificationPopup(notification) {
                currentNotificationTask = notification;
                
                popupTitle.textContent = `New Task: ${notification.category}`;
                popupDistance.textContent = `${notification.distance}km away`;
                popupPoster.textContent = `Posted by: ${notification.posterName}`;
                
                notificationPopup.classList.add('show');
                
                // Auto hide after 30 seconds
                setTimeout(() => {
                    notificationPopup.classList.remove('show');
                }, 30000);
            }

            // ===== HANDLE NOTIFICATION ACTIONS =====
            popupAccept.addEventListener('click', async () => {
                if (!currentNotificationTask || !currentUser) return;
                
                notificationPopup.classList.remove('show');
                
                try {
                    const taskId = currentNotificationTask.taskId;
                    const posterId = currentNotificationTask.posterId;
                    
                    // Update task status
                    await database.ref('tasks/' + posterId + '/' + taskId).update({
                        status: 'assigned',
                        assignedHelperId: currentUser.uid,
                        assignedHelperName: currentUser.name,
                        assignedAt: Date.now()
                    });
                    
                    // Remove notification
                    await database.ref('notifications/' + currentUser.uid + '/' + currentNotificationTask.key).remove();
                    
                    addDebugLog(`✅ Task accepted: ${taskId}`, 'success');
                    showToast('Task accepted! Head to the location.');
                    
                    // Refresh tasks
                    fetchTasks();
                    
                } catch (error) {
                    addDebugLog(`❌ Error accepting task: ${error.message}`, 'error');
                }
            });

            popupSchedule.addEventListener('click', async () => {
                if (!currentNotificationTask || !currentUser) return;
                
                // Open schedule picker (simplified - prompt for hours from now)
                const hours = prompt('Schedule for how many hours from now? (1-48)', '2');
                if (!hours) return;
                
                const scheduledTime = Date.now() + (parseInt(hours) * 60 * 60 * 1000);
                
                notificationPopup.classList.remove('show');
                
                try {
                    const taskId = currentNotificationTask.taskId;
                    const posterId = currentNotificationTask.posterId;
                    
                    // Create scheduled request
                    await database.ref('scheduled_requests/' + posterId + '/' + taskId + '_' + currentUser.uid).set({
                        taskId: taskId,
                        helperUid: currentUser.uid,
                        helperName: currentUser.name,
                        scheduledTime: scheduledTime,
                        status: 'pending',
                        createdAt: Date.now()
                    });
                    
                    // Remove notification
                    await database.ref('notifications/' + currentUser.uid + '/' + currentNotificationTask.key).remove();
                    
                    addDebugLog(`📅 Scheduled request sent`, 'success');
                    showToast('Schedule request sent to poster');
                    
                } catch (error) {
                    addDebugLog(`❌ Error scheduling task: ${error.message}`, 'error');
                }
            });

            popupDecline.addEventListener('click', async () => {
                if (!currentNotificationTask || !currentUser) return;
                
                notificationPopup.classList.remove('show');
                
                try {
                    // Remove notification
                    await database.ref('notifications/' + currentUser.uid + '/' + currentNotificationTask.key).remove();
                    
                    addDebugLog(`❌ Task declined`, 'info');
                    showToast('Task declined');
                    
                } catch (error) {
                    addDebugLog(`❌ Error declining task: ${error.message}`, 'error');
                }
            });

            // ===== FULL SCREEN NOTIFICATIONS =====
            notificationBell.addEventListener('click', () => {
                renderFullNotifications();
                notificationsFullscreen.classList.add('active');
                
                notifications.forEach(n => n.read = true);
                updateNotificationBadge();
                localStorage.setItem('taskmart_notifications', JSON.stringify(notifications));
            });

            closeNotificationsBtn.addEventListener('click', () => {
                notificationsFullscreen.classList.remove('active');
            });

            function renderFullNotifications() {
                let html = '';

                const earningsNotifs = notifications.filter(n => n.type === 'earnings' || (n.title && n.title.toLowerCase().includes('earned')));
                if (earningsNotifs.length > 0) {
                    html += '<div class="notification-group"><h3>Earnings</h3>';
                    earningsNotifs.forEach(n => {
                        html += `
                            <div class="full-notification-item earnings">
                                <div class="notification-time">${n.timestamp || ''}</div>
                                <div class="notification-main-title">${n.title || 'Earnings'}</div>
                                <div class="notification-desc">${n.message || ''}</div>
                                ${n.amount ? `<div class="notification-amount">+R${n.amount}</div>` : ''}
                                <div class="notification-status-badge earned">Earned</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                const acceptedNotifs = notifications.filter(n => n.status === 'accepted' || (n.title && n.title.toLowerCase().includes('accepted')));
                if (acceptedNotifs.length > 0) {
                    html += '<div class="notification-group"><h3>Accepted</h3>';
                    acceptedNotifs.forEach(n => {
                        html += `
                            <div class="full-notification-item accepted">
                                <div class="notification-time">${n.timestamp || ''}</div>
                                <div class="notification-main-title">${n.title || 'Accepted'}</div>
                                <div class="notification-desc">${n.message || ''}</div>
                                <div class="notification-status-badge accepted">Accepted</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                const pendingNotifs = notifications.filter(n => n.status === 'pending');
                if (pendingNotifs.length > 0) {
                    html += '<div class="notification-group"><h3>Pending</h3>';
                    pendingNotifs.forEach(n => {
                        html += `
                            <div class="full-notification-item pending">
                                <div class="notification-time">${n.timestamp || ''}</div>
                                <div class="notification-main-title">${n.title || 'Pending'}</div>
                                <div class="notification-desc">${n.message || ''}</div>
                                <div class="notification-status-badge pending">Pending</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                const rejectedNotifs = notifications.filter(n => n.status === 'rejected');
                if (rejectedNotifs.length > 0) {
                    html += '<div class="notification-group"><h3>Rejected</h3>';
                    rejectedNotifs.forEach(n => {
                        html += `
                            <div class="full-notification-item rejected">
                                <div class="notification-time">${n.timestamp || ''}</div>
                                <div class="notification-main-title">${n.title || 'Rejected'}</div>
                                <div class="notification-desc">${n.message || ''}</div>
                                <div class="notification-status-badge rejected">Rejected</div>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (notifications.length === 0) {
                    html = '<div style="text-align: center; padding: 60px 20px; color: #999;">No notifications yet</div>';
                }

                if (notifications.length > 0) {
                    html += `
                        <button class="clear-all-btn" onclick="window.clearAllNotifications()">Clear all</button>
                    `;
                }

                notificationsFullContent.innerHTML = html;
            }

            window.clearAllNotifications = function() {
                notifications = [];
                localStorage.removeItem('taskmart_notifications');
                updateNotificationBadge();
                renderFullNotifications();
                showToast('All notifications cleared');
                addDebugLog('🧹 All notifications cleared', 'info');
            };

            // ===== ROUTE TOGGLE =====
            floatingDistanceCard.addEventListener('click', () => {
                if (!drivingData || !walkingData) return;
                
                isDriving = !isDriving;
                routeToggle.classList.toggle('rotated');
                
                if (isDriving) {
                    routeIcon.textContent = 'directions_car';
                    routeDistance.textContent = drivingData.distance;
                    routeDuration.textContent = drivingData.duration;
                } else {
                    routeIcon.textContent = 'directions_walk';
                    routeDistance.textContent = walkingData.distance;
                    routeDuration.textContent = walkingData.duration;
                }
            });

            // ===== NOTIFICATION SYSTEM =====
            function playNotificationSound() {
                if (notificationSound) {
                    notificationSound.currentTime = 0;
                    notificationSound.play().catch(e => console.log('Sound play failed:', e));
                }
                
                notificationBell.classList.add('has-notifications');
                setTimeout(() => {
                    notificationBell.classList.remove('has-notifications');
                }, 500);
            }

            function addNotification(title, message, type = 'info', amount = null, status = null) {
                const notification = {
                    id: Date.now() + Math.random(),
                    title,
                    message,
                    type,
                    amount,
                    status,
                    read: false,
                    timestamp: new Date().toLocaleTimeString()
                };
                
                notifications.unshift(notification);
                updateNotificationBadge();
                
                showToast(message);
                playNotificationSound();
                
                localStorage.setItem('taskmart_notifications', JSON.stringify(notifications));
                addDebugLog(`📢 Notification: ${message}`, 'info');
            }

            function updateNotificationBadge() {
                const unreadCount = notifications.filter(n => !n.read).length;
                if (unreadCount > 0) {
                    notificationBadge.style.display = 'flex';
                    notificationBadge.textContent = unreadCount;
                } else {
                    notificationBadge.style.display = 'none';
                }
            }

            function loadNotifications() {
                const saved = localStorage.getItem('taskmart_notifications');
                if (saved) {
                    try {
                        notifications = JSON.parse(saved);
                        updateNotificationBadge();
                        
                        const unreadCount = notifications.filter(n => !n.read).length;
                        if (unreadCount > 0 && !soundPlayedOnLoad) {
                            setTimeout(() => {
                                playNotificationSound();
                                soundPlayedOnLoad = true;
                            }, 500);
                        }
                    } catch (e) {
                        addDebugLog(`❌ Error loading notifications: ${e.message}`, 'error');
                    }
                }
            }

            function showToast(message) {
                toast.textContent = message;
                toast.className = 'toast show';
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // ===== LOAD PROFILE MENU =====
            fetch('https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/profile-menu.html')
                .then(response => response.text())
                .then(html => {
                    document.getElementById('profile-menu-container').innerHTML = html;
                    const scripts = document.getElementById('profile-menu-container').getElementsByTagName('script');
                    for (let i = 0; i < scripts.length; i++) {
                        const script = document.createElement('script');
                        script.textContent = scripts[i].textContent;
                        document.body.appendChild(script);
                    }
                    
                    // Add click handler for the menu button after content loads
                    setTimeout(() => {
                        const profileMenuBtnFromContent = document.getElementById('profileMenuBtn');
                        if (profileMenuBtnFromContent) {
                            profileMenuBtn.addEventListener('click', () => {
                                profileMenuBtnFromContent.click();
                            });
                        }
                    }, 100);
                })
                .catch(error => addDebugLog(`❌ Failed to load profile menu: ${error.message}`, 'error'));

            profileMenuBtn.addEventListener('click', () => {
                const menuBtn = document.getElementById('profileMenuBtn');
                if (menuBtn) menuBtn.click();
            });

            // ===== CREATE CUSTOM MARKERS - TASK PLANNER STYLE =====
            function createHelperMarker() {
                const container = document.createElement('div');
                container.style.position = 'relative';
                container.style.width = '12px';
                container.style.height = '12px';
                
                const marker = document.createElement('div');
                marker.className = 'helper-marker';
                container.appendChild(marker);
                
                return container;
            }

            function createPosterMarker(isAssigned = false) {
                if (isAssigned) {
                    const container = document.createElement('div');
                    container.style.position = 'relative';
                    container.style.width = '16px';
                    container.style.height = '16px';
                    
                    const marker = document.createElement('div');
                    marker.className = 'assigned-marker';
                    container.appendChild(marker);
                    
                    return container;
                } else {
                    const container = document.createElement('div');
                    container.style.position = 'relative';
                    container.style.width = '12px';
                    container.style.height = '12px';
                    
                    const marker = document.createElement('div');
                    marker.className = 'poster-marker';
                    container.appendChild(marker);
                    
                    return container;
                }
            }

            // ===== MAP INIT =====
            function initMap() {
                if (!window.MAPBOX_TOKEN) {
                    addDebugLog('❌ No Mapbox token', 'error');
                    return;
                }

                mapboxgl.accessToken = window.MAPBOX_TOKEN;

                map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/pmalapile07/cmmhmxzd900e801skap5a047l',
                    center: [28.034088, -26.195246],
                    zoom: 13
                });

                map.on('load', () => {
                    addDebugLog('🗺️ Map loaded successfully', 'success');
                    
                    map.addSource('route', {
                        type: 'geojson',
                        data: {
                            type: 'Feature',
                            geometry: {
                                type: 'LineString',
                                coordinates: []
                            }
                        }
                    });

                    map.addLayer({
                        id: 'route',
                        type: 'line',
                        source: 'route',
                        layout: {
                            'line-join': 'round',
                            'line-cap': 'round'
                        },
                        paint: {
                            'line-color': '#666666',
                            'line-width': 3,
                            'line-opacity': 0.6
                        }
                    });

                    getUserLocation();
                });

                map.on('error', (e) => {
                    addDebugLog(`❌ Map error: ${e.error}`, 'error');
                });
            }

            // ===== GET LOCATION =====
            function getUserLocation() {
                if (navigator.geolocation) {
                    addDebugLog('📍 Getting user location...', 'info');
                    
                    navigator.geolocation.getCurrentPosition(
                        (pos) => {
                            currentLat = pos.coords.latitude;
                            currentLng = pos.coords.longitude;
                            
                            addDebugLog(`📍 Location: ${currentLat}, ${currentLng}`, 'success');
                            
                            map.flyTo({ center: [currentLng, currentLat], zoom: 14 });
                            
                            if (startMarker) startMarker.remove();
                            
                            const helperEl = createHelperMarker();
                            startMarker = new mapboxgl.Marker({ element: helperEl })
                                .setLngLat([currentLng, currentLat])
                                .setPopup(new mapboxgl.Popup().setHTML('<div style="font-family: Manrope; font-weight: 300; padding: 8px;">You</div>'))
                                .addTo(map);

                            fetchTasks();
                        },
                        (error) => {
                            addDebugLog(`❌ Location error: ${error.message}`, 'error');
                            fetchTasks();
                        },
                        { enableHighAccuracy: true, timeout: 10000 }
                    );
                } else {
                    addDebugLog('❌ Geolocation not supported', 'error');
                    fetchTasks();
                }
            }

            // ===== CHECK IF TASK MATCHES USER SKILLS =====
            function taskMatchesSkills(task) {
                if (!userSkills || userSkills.length === 0) return false;
                if (!task.category) return false;
                
                const taskLower = task.category.toLowerCase();
                return userSkills.some(skill => taskLower.includes(skill.toLowerCase()));
            }

            // ===== CHECK IF TASK IS ASSIGNED TO CURRENT USER =====
            function isTaskAssignedToMe(task) {
                return task.assignedHelperId === currentUser?.uid;
            }

            // ===== FETCH TASKS =====
            let lastTaskCount = 0;
            
            async function fetchTasks() {
                try {
                    addDebugLog('📡 ===== FETCHING TASKS =====', 'info');
                    
                    // Show loading state
                    sheetContent.innerHTML = '<div class="skeleton-card"><div class="skeleton-line short"></div><div class="skeleton-line medium"></div></div>';
                    
                    // Get all tasks from all users
                    const tasksSnapshot = await database.ref('tasks').once('value');
                    const allUsersTasks = tasksSnapshot.val() || {};
                    
                    let allTasks = [];
                    let totalTaskCount = 0;
                    
                    // Flatten tasks from all users
                    for (let posterId in allUsersTasks) {
                        const userTasks = allUsersTasks[posterId];
                        if (userTasks) {
                            for (let taskId in userTasks) {
                                const taskData = userTasks[taskId];
                                if (taskData) {
                                    allTasks.push({
                                        id: taskId,
                                        posterId: posterId,
                                        ...taskData
                                    });
                                    totalTaskCount++;
                                }
                            }
                        }
                    }

                    addDebugLog(`📊 TOTAL TASKS IN DATABASE: ${totalTaskCount}`, 'info');
                    
                    if (!currentUser) {
                        addDebugLog('❌ No current user, skipping task filtering', 'error');
                        return;
                    }

                    addDebugLog(`👤 Current user UID: ${currentUser.uid}`, 'info');

                    // Filter out tasks posted by current user
                    const otherUsersTasks = allTasks.filter(task => task.posterId !== currentUser.uid);
                    addDebugLog(`📌 Tasks from other users: ${otherUsersTasks.length}`, 'info');

                    // Categorize tasks
                    inProgressTasks = otherUsersTasks.filter(task => {
                        const isAssigned = task.status === 'assigned' && task.assignedHelperId === currentUser.uid;
                        const isInProgress = task.status === 'in_progress' && task.assignedHelperId === currentUser.uid;
                        const isTraveling = task.status === 'traveling' && task.assignedHelperId === currentUser.uid;
                        return isAssigned || isInProgress || isTraveling;
                    });
                    
                    matchingRequests = otherUsersTasks.filter(task => 
                        task.status === 'matching' && 
                        task.selectedHelperId === currentUser.uid
                    );
                    
                    // Available tasks: status is "open" AND taskState is "current"
                    availableTasks = otherUsersTasks.filter(task => {
                        const isOpen = task.status === 'open';
                        const isCurrent = task.taskState === 'current';
                        return isOpen && isCurrent;
                    });

                    addDebugLog(`📋 AVAILABLE TASKS (open + current): ${availableTasks.length}`, 'info');
                    addDebugLog(`▶️ IN-PROGRESS TASKS (assigned to me): ${inProgressTasks.length}`, 'info');
                    addDebugLog(`🤝 MATCHING REQUESTS: ${matchingRequests.length}`, 'info');

                    availableTasks.sort((a, b) => {
                        const aMatches = taskMatchesSkills(a);
                        const bMatches = taskMatchesSkills(b);
                        if (aMatches && !bMatches) return -1;
                        if (!aMatches && bMatches) return 1;
                        return 0;
                    });

                    renderTasks();
                    addTaskMarkers(availableTasks);
                    
                    addDebugLog('✅ ===== TASK FETCH COMPLETE =====', 'success');
                    
                } catch (error) {
                    addDebugLog(`❌ Error fetching tasks: ${error.message}`, 'error');
                    sheetContent.innerHTML = '<div class="no-tasks">Error loading tasks</div>';
                }
            }

            // ===== CALCULATE ROUTE =====
            async function calculateRoute(taskId) {
                const task = availableTasks.find(t => t.id === taskId);
                if (!task || !task.location || !task.location.lat || !task.location.lng || !currentLat || !currentLng) {
                    showToast('Cannot calculate route');
                    return;
                }

                const taskLat = task.location.lat;
                const taskLng = task.location.lng;

                selectedTaskId = taskId;

                if (endMarker) endMarker.remove();

                const isAssigned = isTaskAssignedToMe(task);
                const posterEl = createPosterMarker(isAssigned);
                endMarker = new mapboxgl.Marker({ element: posterEl })
                    .setLngLat([taskLng, taskLat])
                    .setPopup(new mapboxgl.Popup().setHTML(`<div style="font-family: Manrope; font-weight: 300; padding: 8px;">${task.category || 'Task'}</div>`))
                    .addTo(map);

                const bounds = new mapboxgl.LngLatBounds();
                bounds.extend([currentLng, currentLat]);
                bounds.extend([taskLng, taskLat]);
                map.fitBounds(bounds, { padding: 50 });

                try {
                    const drivingResponse = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/driving/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    const walkingResponse = await fetch(
                        `https://api.mapbox.com/directions/v5/mapbox/walking/${currentLng},${currentLat};${taskLng},${taskLat}?geometries=geojson&access_token=${mapboxgl.accessToken}`
                    );

                    if (drivingResponse.ok && walkingResponse.ok) {
                        const drivingDataJson = await drivingResponse.json();
                        const walkingDataJson = await walkingResponse.json();
                        
                        const drivingRoute = drivingDataJson.routes[0];
                        const walkingRoute = walkingDataJson.routes[0];
                        
                        const drivingDistance = drivingRoute.distance;
                        const drivingDuration = Math.round(drivingRoute.duration / 60);
                        const walkingDistance = walkingRoute.distance;
                        const walkingDuration = Math.round(walkingRoute.duration / 60);

                        let drivingDistanceStr = drivingDistance < 1000 
                            ? Math.round(drivingDistance) + 'm' 
                            : (drivingDistance / 1000).toFixed(1) + 'km';
                            
                        let walkingDistanceStr = walkingDistance < 1000 
                            ? Math.round(walkingDistance) + 'm' 
                            : (walkingDistance / 1000).toFixed(1) + 'km';

                        drivingData = {
                            distance: drivingDistanceStr,
                            duration: drivingDuration + 'min'
                        };
                        
                        walkingData = {
                            distance: walkingDistanceStr,
                            duration: walkingDuration + 'min'
                        };

                        isDriving = true;
                        routeIcon.textContent = 'directions_car';
                        routeDistance.textContent = drivingDistanceStr;
                        routeDuration.textContent = drivingDuration + 'min';
                        routeToggle.classList.remove('rotated');
                        
                        floatingDistanceCard.classList.add('active');

                        map.getSource('route').setData({
                            type: 'Feature',
                            geometry: drivingRoute.geometry
                        });

                        document.querySelectorAll('.task-card').forEach(card => {
                            card.classList.remove('selected');
                        });
                        const selectedCard = document.querySelector(`[data-task-id="${taskId}"]`);
                        if (selectedCard) {
                            selectedCard.classList.add('selected');
                            selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }
                    }
                } catch (error) {
                    addDebugLog(`❌ Route error: ${error.message}`, 'error');
                }
            }

            // ===== RENDER TASKS =====
            function renderTasks() {
                let html = '';

                if (matchingRequests.length > 0) {
                    html += '<div class="matching-section">';
                    html += '<div class="matching-header">You\'ve been selected!</div>';
                    
                    matchingRequests.forEach(task => {
                        html += `
                            <div class="matching-card">
                                <div class="matching-title">${task.category || 'Help needed'}</div>
                                <div class="matching-poster">Posted by: ${task.posterName || 'Someone'}</div>
                                <div class="matching-status">
                                    <span class="material-symbols-outlined">hourglass_empty</span>
                                    Pending confirmation
                                </div>
                                <button class="confirm-btn" onclick="window.confirmMatch('${task.id}')">
                                    Confirm & start
                                </button>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }

                if (inProgressTasks.length > 0) {
                    html += '<div class="in-progress-section">';
                    html += '<div class="in-progress-header">In progress</div>';
                    
                    inProgressTasks.forEach(task => {
                        let statusText = 'Task in progress';
                        if (task.status === 'assigned') statusText = 'Heading to location';
                        else if (task.status === 'traveling') statusText = 'On the way';
                        else if (task.status === 'in_progress') statusText = 'Working on task';
                        
                        html += `
                            <div class="in-progress-card" onclick="window.selectInProgressTask('${task.id}')">
                                <div class="in-progress-title">${task.category || 'Help needed'}</div>
                                <div class="in-progress-meta">
                                    <span>
                                        <span class="material-symbols-outlined">location_on</span>
                                        ${task.address ? task.address.split(',')[0] : 'Nearby'}
                                    </span>
                                    <span>
                                        <span class="material-symbols-outlined">payments</span>
                                        ${task.budget === 'open' ? 'Open' : `R${task.budget}`}
                                    </span>
                                </div>
                                <div class="in-progress-status">${statusText}</div>
                            </div>
                        `;
                    });
                    
                    html += '</div>';
                }

                if (availableTasks.length === 0) {
                    html += '<div class="no-tasks">No tasks available</div>';
                } else {
                    availableTasks.forEach(task => {
                        const taskId = task.id;
                        const budget = task.budget;
                        const isOpenOffer = task.budget === 'open';
                        const posterName = task.posterName || 'Someone';
                        const taskTitle = task.category || 'Help needed';
                        const isMatch = taskMatchesSkills(task);
                        const isAssigned = isTaskAssignedToMe(task);

                        let cardClass = 'task-card';
                        if (isMatch) cardClass += ' matched';
                        if (isAssigned) cardClass += ' assigned';

                        html += `
                            <div class="${cardClass}" data-task-id="${taskId}" onclick="window.selectTask('${taskId}')">
                                <div class="task-price-above ${isOpenOffer ? 'open' : ''}">
                                    ${isOpenOffer ? 'Open to offers' : `R${budget}`}
                                </div>
                                <div class="task-title">${taskTitle}</div>
                                ${isMatch ? '<div class="skill-match">Matches your skills</div>' : ''}
                            </div>
                        `;
                    });
                }

                sheetContent.innerHTML = html;
            }

            window.selectTask = function(taskId) {
                const card = document.querySelector(`[data-task-id="${taskId}"]`);
                if (card) {
                    const wasExpanded = card.classList.contains('expanded');
                    
                    document.querySelectorAll('.task-card').forEach(c => {
                        if (c.dataset.taskId !== taskId) {
                            c.classList.remove('expanded');
                        }
                    });
                    
                    card.classList.toggle('expanded');
                    
                    if (!wasExpanded) {
                        calculateRoute(taskId);
                    } else {
                        floatingDistanceCard.classList.remove('active');
                    }
                }
            };

            window.selectInProgressTask = function(taskId) {
                const task = inProgressTasks.find(t => t.id === taskId);
                if (task && task.location && task.location.lat && task.location.lng) {
                    const taskLat = task.location.lat;
                    const taskLng = task.location.lng;
                    
                    if (startMarker && endMarker) {
                        endMarker.remove();
                    }
                    
                    const isAssigned = isTaskAssignedToMe(task);
                    const posterEl = createPosterMarker(isAssigned);
                    endMarker = new mapboxgl.Marker({ element: posterEl })
                        .setLngLat([taskLng, taskLat])
                        .addTo(map);
                    
                    const bounds = new mapboxgl.LngLatBounds();
                    bounds.extend([currentLng, currentLat]);
                    bounds.extend([taskLng, taskLat]);
                    map.fitBounds(bounds, { padding: 50 });
                    
                    floatingDistanceCard.classList.remove('active');
                }
            };

            window.confirmMatch = async function(taskId) {
                const task = matchingRequests.find(t => t.id === taskId);
                if (!task) return;

                try {
                    await database.ref('tasks/' + task.posterId + '/' + taskId).update({
                        status: 'assigned',
                        assignedHelperId: currentUser.uid,
                        assignedHelperName: currentUser.name,
                        assignedAt: Date.now()
                    });
                    
                    inProgressTasks.unshift(task);
                    matchingRequests = matchingRequests.filter(t => t.id !== taskId);
                    
                    renderTasks();
                    
                    if (task.budget && task.budget !== 'open') {
                        todayEarnings += task.budget;
                        todayEarningsSpan.textContent = `R${todayEarnings}`;
                        localStorage.setItem('taskmart_today_earnings', todayEarnings);
                        
                        addNotification(
                            'Payment received',
                            `You earned R${task.budget}`,
                            'earnings',
                            task.budget
                        );
                    }
                    
                    showToast('Match confirmed! Task is now in progress.');
                    
                } catch (error) {
                    addDebugLog(`❌ Error confirming match: ${error.message}`, 'error');
                }
            };

            function addTaskMarkers(tasks) {
                if (window.taskMarkers) {
                    window.taskMarkers.forEach(marker => marker.remove());
                }
                window.taskMarkers = [];

                tasks.forEach(task => {
                    if (task.location && task.location.lat && task.location.lng) {
                        const lat = task.location.lat;
                        const lng = task.location.lng;
                        
                        const isAssigned = isTaskAssignedToMe(task);
                        const posterEl = createPosterMarker(isAssigned);
                        const marker = new mapboxgl.Marker({ element: posterEl })
                            .setLngLat([lng, lat])
                            .setPopup(new mapboxgl.Popup().setHTML(`
                                <div style="font-family: 'Manrope', sans-serif; font-weight: 300; padding: 8px;">
                                    <strong>${task.category || 'Help needed'}</strong><br>
                                    ${task.budget === 'open' ? 'Open to offers' : 'R' + task.budget}
                                    ${isAssigned ? '<br><span style="color: #10b981;">✓ Assigned to you</span>' : ''}
                                </div>
                            `))
                            .addTo(map);
                        
                        window.taskMarkers.push(marker);
                    }
                });
            }

            onlineToggle.addEventListener('click', () => {
                isOnline = !isOnline;
                statusDot.className = isOnline ? 'status-dot' : 'status-dot offline';
                statusText.textContent = isOnline ? 'Available' : 'Offline';
                showToast(`You are now ${isOnline ? 'available' : 'offline'}`);
                addDebugLog(`🔄 Status changed: ${isOnline ? 'Online' : 'Offline'}`, 'info');
            });

            expandIcon.addEventListener('click', (e) => {
                e.stopPropagation();
                tasksSheet.classList.toggle('expanded');
            });

            sheetHeader.addEventListener('click', (e) => {
                if (e.target === expandIcon) return;
                tasksSheet.classList.toggle('expanded');
            });

            setInterval(() => {
                if (isOnline) {
                    fetchTasks();
                }
            }, 10000);

        })();
    </script>
</body>
</html>
