<!DOCTYPE html>
<html>
<head>
    <title>Firebase Ultimate Test</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h1>Firebase Ultimate Test</h1>
    <div id="output" style="white-space: pre-line; font-family: monospace;"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(msg) {
            output.innerHTML += msg + '\n';
        }

        // PASTE YOUR BRAND NEW CONFIG HERE
        const firebaseConfig = {
            apiKey: "AIzaSyBi_srk36131SlYbhclVqlqsqobJJ917Pg",
            authDomain: "taskmartapp-74d6b.firebaseapp.com",
            projectId: "taskmartapp-74d6b",
            storageBucket: "taskmartapp-74d6b.firebasestorage.app",
            messagingSenderId: "52910279328",
            appId: "1:52910279328:web:f49ed0d56a09e5dead17c5"
        };

        log('1. Firebase loaded: ' + (typeof firebase !== 'undefined'));
        
        try {
            log('2. Attempting to initialize...');
            const app = firebase.initializeApp(firebaseConfig);
            log('3. ✅ Firebase initialized!');
            
            const auth = firebase.auth();
            log('4. ✅ Auth obtained!');
            
            log('5. Testing API key with anonymous sign-in...');
            auth.signInAnonymously()
                .then((result) => {
                    log('6. ✅✅✅ SUCCESS! API key works!');
                    log('User ID: ' + result.user.uid);
                })
                .catch((error) => {
                    log('6. ❌ FAILED!');
                    log('Error code: ' + error.code);
                    log('Error message: ' + error.message);
                    
                    if (error.code === 'auth/api-key-not-valid') {
                        log('\n🔴 THE API KEY IS NOT VALID');
                        log('This means:');
                        log('1. The key is wrong - copy it again from Firebase Console');
                        log('2. Or the key is from a different Firebase project');
                        log('3. Or the key has been restricted/deleted');
                    }
                });
                
        } catch (e) {
            log('❌ Error: ' + e.message);
        }
    </script>
</body>
</html>
