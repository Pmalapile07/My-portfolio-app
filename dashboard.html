<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - TaskMart</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">
    
    <style>
        /* Mobile-first base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            background: #f8fafd;
            min-height: 100vh;
            color: #1e293b;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Profile Section - Mobile first */
        .profile-section {
            background: white;
            border-radius: 20px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 2px 8px rgba(4, 91, 146, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .profile-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #045B92, #FF286F);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 1.25rem;
            flex-shrink: 0;
        }

        .profile-text {
            flex: 1;
        }

        .profile-text h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #045B92;
            margin-bottom: 0.25rem;
        }

        .profile-badge {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            color: #10b981;
        }

        .profile-badge .material-symbols-outlined {
            font-size: 16px !important;
        }

        .profile-settings {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(4, 91, 146, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .profile-settings .material-symbols-outlined {
            color: #045B92;
            font-size: 22px !important;
        }

        /* Stats Grid - Mobile first (2 columns) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            box-shadow: 0 2px 8px rgba(4, 91, 146, 0.05);
        }

        .stat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .stat-title {
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-icon {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon .material-symbols-outlined {
            font-size: 18px !important;
        }

        .stat-icon.active {
            background: rgba(255, 193, 7, 0.1);
            color: #f59e0b;
        }

        .stat-icon.in-progress {
            background: rgba(4, 91, 146, 0.1);
            color: #045B92;
        }

        .stat-icon.completed {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .stat-icon.cancelled {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: 700;
            color: #045B92;
            line-height: 1.2;
        }

        /* Loading State */
        .loading-skeleton {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Recent Task Card */
        .recent-task-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 4px 12px rgba(4, 91, 146, 0.08);
            border: 1px solid rgba(255, 40, 111, 0.1);
        }

        .card-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .task-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #045B92;
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .task-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .category-badge {
            background: rgba(255, 40, 111, 0.1);
            color: #FF286F;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .area-badge {
            background: rgba(4, 91, 146, 0.1);
            color: #045B92;
            padding: 0.25rem 0.75rem;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .area-badge .material-symbols-outlined {
            font-size: 14px !important;
        }

        .task-details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            padding: 1.25rem 0;
            border-top: 1px solid rgba(4, 91, 146, 0.1);
            border-bottom: 1px solid rgba(4, 91, 146, 0.1);
            margin-bottom: 1.25rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .detail-label {
            font-size: 0.65rem;
            color: #94a3b8;
            text-transform: uppercase;
            font-weight: 600;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 700;
            color: #045B92;
        }

        .detail-value.budget {
            color: #FF286F;
        }

        .status-badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            border-radius: 30px;
            font-size: 0.8rem;
            font-weight: 600;
            width: fit-content;
        }

        .status-badge.waiting {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .status-badge.active {
            background: rgba(4, 91, 146, 0.1);
            color: #045B92;
        }

        .status-badge.in-progress {
            background: rgba(255, 40, 111, 0.1);
            color: #FF286F;
        }

        .status-badge.completed {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .status-badge.paused {
            background: rgba(100, 116, 139, 0.1);
            color: #64748b;
        }

        .task-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-primary {
            background: #FF286F;
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            flex: 1;
        }

        .btn-primary:active {
            background: #d61e5b;
        }

        .btn-secondary {
            background: white;
            color: #045B92;
            border: 1px solid rgba(4, 91, 146, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
        }

        .btn-secondary:active {
            border-color: #FF286F;
            color: #FF286F;
        }

        /* Recent Activity */
        .recent-activity-card {
            background: white;
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: 0 2px 8px rgba(4, 91, 146, 0.05);
        }

        .activity-list {
            margin-top: 1rem;
        }

        .activity-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(4, 91, 146, 0.05);
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        .activity-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(4, 91, 146, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #045B92;
            flex-shrink: 0;
        }

        .activity-icon .material-symbols-outlined {
            font-size: 20px !important;
        }

        .activity-content {
            flex: 1;
        }

        .activity-text {
            color: #1e293b;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.2rem;
        }

        .activity-time {
            font-size: 0.7rem;
            color: #94a3b8;
        }

        /* Post New Task Button */
        .post-task-section {
            position: sticky;
            bottom: 1rem;
            z-index: 10;
        }

        .btn-post-task {
            background: #FF286F;
            color: white;
            border: none;
            width: 100%;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 40, 111, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: transform 0.2s;
        }

        .btn-post-task:active {
            transform: scale(0.98);
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #ef4444;
        }

        .error-state .material-symbols-outlined {
            font-size: 48px !important;
            margin-bottom: 1rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #94a3b8;
        }

        .empty-state .material-symbols-outlined {
            font-size: 48px !important;
            margin-bottom: 1rem;
            color: #cbd5e1;
        }

        /* Tablet and Desktop */
        @media (min-width: 640px) {
            .dashboard-container {
                padding: 1.5rem;
            }

            .profile-section {
                padding: 1.5rem;
            }

            .profile-avatar {
                width: 56px;
                height: 56px;
                font-size: 1.5rem;
            }

            .profile-text h1 {
                font-size: 1.25rem;
            }

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 1rem;
            }

            .stat-card {
                padding: 1.25rem;
            }

            .stat-title {
                font-size: 0.75rem;
            }

            .stat-number {
                font-size: 1.75rem;
            }

            .task-title {
                font-size: 1.5rem;
            }

            .btn-post-task {
                width: auto;
                padding: 1rem 2rem;
                margin: 0 auto;
            }

            .post-task-section {
                display: flex;
                justify-content: center;
            }
        }

        @media (min-width: 1024px) {
            .main-grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .recent-task-card {
                margin-bottom: 0;
            }

            .post-task-section {
                position: static;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Profile Section -->
        <div class="profile-section">
            <div class="profile-info">
                <div class="profile-avatar" id="profileAvatar">--</div>
                <div class="profile-text">
                    <h1 id="profileName">Loading...</h1>
                    <div class="profile-badge" id="profileBadge">
                        <span class="material-symbols-outlined">verified</span>
                        <span>Verified Poster</span>
                    </div>
                </div>
            </div>
            <div class="profile-settings" id="settingsBtn">
                <span class="material-symbols-outlined">settings</span>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Active</span>
                    <div class="stat-icon active">
                        <span class="material-symbols-outlined">pending_actions</span>
                    </div>
                </div>
                <div class="stat-number" id="activeCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">In Progress</span>
                    <div class="stat-icon in-progress">
                        <span class="material-symbols-outlined">engineering</span>
                    </div>
                </div>
                <div class="stat-number" id="inProgressCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Completed</span>
                    <div class="stat-icon completed">
                        <span class="material-symbols-outlined">check_circle</span>
                    </div>
                </div>
                <div class="stat-number" id="completedCount">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-header">
                    <span class="stat-title">Cancelled</span>
                    <div class="stat-icon cancelled">
                        <span class="material-symbols-outlined">cancel</span>
                    </div>
                </div>
                <div class="stat-number" id="cancelledCount">0</div>
            </div>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Recent Task Card -->
            <div class="recent-task-card" id="recentTaskCard">
                <div class="card-label">📋 YOUR MOST RECENT TASK</div>
                <div id="recentTaskContent">
                    <!-- Dynamically populated -->
                </div>
            </div>

            <!-- Recent Activity -->
            <div class="recent-activity-card">
                <div class="card-label">⚡ RECENT ACTIVITY</div>
                <div class="activity-list" id="activityList">
                    <!-- Dynamically populated -->
                </div>
            </div>
        </div>

        <!-- Post New Task Button -->
        <div class="post-task-section">
            <button class="btn-post-task" id="postNewTaskBtn">
                <span class="material-symbols-outlined">add</span>
                Post a New Task
            </button>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.origin;

        // Auth helpers
        function getAuthToken() {
            return localStorage.getItem('auth_token');
        }

        function getCurrentUser() {
            const user = localStorage.getItem('taskmart_user');
            return user ? JSON.parse(user) : null;
        }

        function isUserLoggedIn() {
            return !!getAuthToken() && !!getCurrentUser();
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMins / 60);
            const diffDays = Math.floor(diffHours / 24);

            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins} min${diffMins > 1 ? 's' : ''} ago`;
            if (diffHours < 24) return `${diffHours} hour${diffHours > 1 ? 's' : ''} ago`;
            if (diffDays === 1) return 'Yesterday';
            return `${diffDays} days ago`;
        }

        // Fetch user's tasks from MongoDB
        async function fetchUserTasks() {
            const token = getAuthToken();
            const user = getCurrentUser();

            if (!token || !user) {
                window.location.href = '/login.html?returnTo=' + encodeURIComponent(window.location.href);
                return null;
            }

            try {
                const response = await fetch(`${API_BASE_URL}/api/tasks/user/${user.email}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('auth_token');
                        localStorage.removeItem('taskmart_user');
                        window.location.href = '/login.html?returnTo=' + encodeURIComponent(window.location.href);
                        return null;
                    }
                    throw new Error('Failed to fetch tasks');
                }

                const tasks = await response.json();
                return tasks;
            } catch (error) {
                console.error('Error fetching tasks:', error);
                return null;
            }
        }

        // Calculate stats from tasks
        function calculateStats(tasks) {
            const stats = {
                active: 0,
                inProgress: 0,
                completed: 0,
                cancelled: 0
            };

            tasks.forEach(task => {
                switch(task.status) {
                    case 'waiting':
                    case 'posted':
                        stats.active++;
                        break;
                    case 'in-progress':
                    case 'assigned':
                        stats.inProgress++;
                        break;
                    case 'completed':
                        stats.completed++;
                        break;
                    case 'cancelled':
                        stats.cancelled++;
                        break;
                    default:
                        stats.active++;
                }
            });

            return stats;
        }

        // Generate activity items from tasks
        function generateActivity(tasks) {
            const activities = [];
            
            tasks.slice(0, 5).forEach(task => {
                activities.push({
                    icon: 'post_add',
                    text: `Task posted: "${task.taskDescription.substring(0, 30)}${task.taskDescription.length > 30 ? '...' : ''}"`,
                    time: formatDate(task.createdAt || new Date())
                });
            });

            return activities;
        }

        // Update dashboard with real data
        async function updateDashboard() {
            const user = getCurrentUser();
            
            // Update profile
            if (user) {
                document.getElementById('profileName').textContent = `Welcome back, ${user.name.split(' ')[0]}!`;
                document.getElementById('profileAvatar').textContent = user.initials || user.name.substring(0, 2).toUpperCase();
            }

            // Show loading state
            document.getElementById('recentTaskContent').innerHTML = `
                <div style="padding: 2rem; text-align: center;">
                    <div class="loading-skeleton" style="height: 20px; width: 80%; margin: 0 auto 1rem;"></div>
                    <div class="loading-skeleton" style="height: 60px; width: 100%;"></div>
                </div>
            `;

            // Fetch real tasks
            const tasks = await fetchUserTasks();
            
            if (!tasks || tasks.length === 0) {
                // Empty state
                document.getElementById('recentTaskContent').innerHTML = `
                    <div class="empty-state">
                        <span class="material-symbols-outlined">assignment</span>
                        <p>No tasks yet</p>
                        <p style="font-size: 0.9rem; margin-top: 0.5rem;">Post your first task to get started!</p>
                    </div>
                `;
                document.getElementById('activityList').innerHTML = `
                    <div class="empty-state" style="padding: 1rem;">
                        <p>No activity yet</p>
                    </div>
                `;
                return;
            }

            // Calculate stats
            const stats = calculateStats(tasks);
            document.getElementById('activeCount').textContent = stats.active;
            document.getElementById('inProgressCount').textContent = stats.inProgress;
            document.getElementById('completedCount').textContent = stats.completed;
            document.getElementById('cancelledCount').textContent = stats.cancelled;

            // Get most recent task
            const mostRecent = tasks.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];

            // Display most recent task
            document.getElementById('recentTaskContent').innerHTML = `
                <div class="task-title">${mostRecent.taskDescription}</div>
                <div class="task-meta">
                    <span class="category-badge">${mostRecent.category || 'General Task'}</span>
                    <span class="area-badge">
                        <span class="material-symbols-outlined">location_on</span>
                        <span>${mostRecent.location || 'Location not specified'}</span>
                    </span>
                </div>
                <div class="task-details-grid">
                    <div class="detail-item">
                        <span class="detail-label">Budget</span>
                        <span class="detail-value budget">${mostRecent.budgetAmount ? 'R ' + mostRecent.budgetAmount : (mostRecent.budgetType === 'open' ? 'Open to offers' : 'Not set')}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Posted</span>
                        <span class="detail-value">${formatDate(mostRecent.createdAt)}</span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">Status</span>
                        <span class="status-badge ${mostRecent.status || 'waiting'}">${(mostRecent.status === 'waiting' || mostRecent.status === 'posted') ? 'Waiting for offers' : mostRecent.status}</span>
                    </div>
                </div>
                <div class="task-actions">
                    <button class="btn-primary" onclick="viewTaskDetails('${mostRecent._id}')">View Details</button>
                    <button class="btn-secondary" onclick="manageTask('${mostRecent._id}')">Manage Task</button>
                </div>
            `;

            // Generate and display activity
            const activities = generateActivity(tasks);
            document.getElementById('activityList').innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-icon">
                        <span class="material-symbols-outlined">${activity.icon}</span>
                    </div>
                    <div class="activity-content">
                        <div class="activity-text">${activity.text}</div>
                        <div class="activity-time">${activity.time}</div>
                    </div>
                </div>
            `).join('');
        }

        // Navigation functions
        function viewTaskDetails(taskId) {
            window.location.href = `/task-details.html?id=${taskId}`;
        }

        function manageTask(taskId) {
            window.location.href = `/manage-task.html?id=${taskId}`;
        }

        // Event listeners
        document.getElementById('settingsBtn').addEventListener('click', () => {
            window.location.href = '/settings.html';
        });

        document.getElementById('postNewTaskBtn').addEventListener('click', () => {
            window.location.href = '/task-planner.html';
        });

        // Check login and initialize
        if (!isUserLoggedIn()) {
            window.location.href = '/login.html?returnTo=' + encodeURIComponent(window.location.href);
        } else {
            updateDashboard();
        }
    </script>
</body>
</html>
