<head>

    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    
    <!-- Config -->
    <script src="/config.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', sans-serif;
            font-weight: 400;
            color: #1a1a1a;
            background: #000;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined' !important;
            font-weight: normal !important;
            font-style: normal !important;
            font-size: 24px !important;
            line-height: 1 !important;
        }

        html.icons-loaded .material-symbols-outlined {
            visibility: visible;
        }

        /* === FULLSCREEN MAP === */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Blue translucent pulse around center arrow */
        .map-center-pulse {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140px;
            height: 140px;
            background: rgba(0, 62, 113, 0.2);
            border-radius: 50%;
            z-index: 2;
            pointer-events: none;
            animation: pulse 2.2s infinite ease-out;
            box-shadow: 0 0 40px rgba(0, 62, 113, 0.4);
        }

        .map-center-arrow {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-bottom: 32px solid #003E71;
            filter: drop-shadow(0 6px 10px rgba(0,62,113,0.6));
            z-index: 3;
            pointer-events: none;
        }

        .map-center-arrow::after {
            content: '';
            position: absolute;
            top: 12px;
            left: -8px;
            width: 16px;
            height: 16px;
            background: #003E71;
            border-radius: 50%;
            box-shadow: 0 0 20px #003E71;
        }

        @keyframes pulse {
            0% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.8); }
            50% { opacity: 0.4; transform: translate(-50%, -50%) scale(1.4); }
            100% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.8); }
        }

        /* === WHITE CONTAINER (sits above map) === */
        .home-sheet {
            position: absolute;
            bottom: 82px;
            left: 0;
            width: 100%;
            background: white;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
            z-index: 10;
            padding: 24px 20px 24px;
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
        }

        .home-sheet h2 {
            font-size: 1.5rem;
            font-weight: 500;
            color: #000000; /* Black */
            margin-bottom: 16px;
            line-height: 1.2;
            letter-spacing: -0.01em;
        }

        /* Search bar */
        .help-search {
            display: flex;
            align-items: center;
            background: #f5f7fa;
            border-radius: 5px;
            padding: 4px 4px 4px 16px;
            border: 1px solid rgba(0, 62, 113, 0.15);
            transition: all 0.2s;
            cursor: pointer;
        }

        .help-search:active {
            background: #edf0f3;
        }

        .help-search .material-symbols-outlined {
            color: rgba(0, 62, 113, 0.3);
            font-size: 20px !important;
            margin-right: 8px;
        }

        .help-search .search-placeholder {
            flex: 1;
            padding: 14px 0;
            font-size: 0.95rem;
            font-family: 'Manrope', sans-serif;
            font-weight: 600;
            color: #000000;
        }

        .help-search .search-placeholder.faded {
            color: rgba(0, 62, 113, 0.4);
            font-weight: 500;
        }

        /* === BOTTOM NAVIGATION === */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(0, 62, 113, 0.08);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 20px 24px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom, 16px));
            z-index: 20;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.15s;
            flex: 1;
            max-width: 70px;
        }

        .nav-item .material-symbols-outlined {
            font-size: 26px !important;
            transition: all 0.2s;
        }

        .nav-item span:not(.material-symbols-outlined) {
            font-size: 0.65rem;
            font-weight: 500;
            color: #003E71;
            opacity: 0.6;
            transition: all 0.2s;
        }

        .nav-item.active .material-symbols-outlined {
            color: #FF286F !important;
            font-variation-settings: 'FILL' 1;
        }

        .nav-item.active span:not(.material-symbols-outlined) {
            color: #FF286F;
            opacity: 1;
            font-weight: 600;
        }

        .nav-item.inactive .material-symbols-outlined {
            color: #003E71;
            opacity: 0.5;
        }

        /* === CREATE TASK FULL SCREEN (hidden by default) === */
        .create-task-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000000;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .create-task-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.25rem 1.25rem 0.75rem 1.25rem;
            border-bottom: 1px solid rgba(0, 62, 113, 0.08);
            flex-shrink: 0;
        }

        .close-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn .material-symbols-outlined {
            color: #000000 !important;
            font-size: 28px !important;
        }
