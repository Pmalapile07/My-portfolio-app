<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TaskMart · Home</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Firebase SDK (v9.22.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Manrope', sans-serif;
            font-weight: 400;
            font-size: 16px;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.3s ease;
        }

        /* Top icons container */
        .top-icons {
            position: absolute;
            top: 16px;
            left: 0;
            right: 0;
            padding: 0 16px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none;
        }
        
        .map-top-left-icon,
        .map-return-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            pointer-events: auto;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .map-top-left-icon i,
        .map-return-btn i {
            font-size: 24px;
            color: #000;
            transition: color 0.2s ease;
        }
        
        /* Fullscreen icon styles - blended into app */
        .top-icons.fullscreen .map-top-left-icon,
        .top-icons.fullscreen .map-return-btn {
            background: transparent;
            box-shadow: none;
        }
        
        .top-icons.fullscreen .map-top-left-icon i,
        .top-icons.fullscreen .map-return-btn i {
            color: #000;
        }
        
        /* Bottom navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 57px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 20;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
            font-size: 0.7rem;
            background: transparent;
            border: none;
            font-family: 'Manrope', sans-serif;
        }
        
        .nav-item.active { color: #000; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 2px; }
        
        /* BOTTOM SHEET - FLEX COLUMN LAYOUT */
        .bottom-sheet {
            position: fixed;
            bottom: 57px;
            left: 0;
            right: 0;
            background: white;
            z-index: 15;
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            transition: height 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-radius 0.2s ease;
            overflow: hidden;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }
        
        .bottom-sheet.dragging {
            transition: none;
        }
        
        .bottom-sheet.fullscreen {
            border-radius: 0;
            height: calc(100% - 57px) !important;
        }
        
        /* Grabber - hides in fullscreen */
        .sheet-grabber {
            width: 48px;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            margin: 12px auto;
            cursor: grab;
            touch-action: none;
            flex-shrink: 0;
            transition: opacity 0.2s ease, margin 0.2s ease;
        }
        
        .bottom-sheet.fullscreen .sheet-grabber {
            opacity: 0;
            pointer-events: none;
            margin: 0 auto;
        }
        
        .sheet-grabber:active { cursor: grabbing; }
        
        /* Sheet content - proper flex column stacking */
        .sheet-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px 24px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Header */
        .sheet-header {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #1a1a1a;
            margin-bottom: 24px;
            transition: opacity 0.2s ease, margin 0.2s ease;
        }
        
        /* Service cards container */
        .services-container {
            margin-bottom: 24px;
            transition: opacity 0.25s ease, transform 0.25s ease, height 0.25s ease, margin 0.25s ease;
            overflow: hidden;
        }
        
        .service-cards {
            display: flex;
            gap: 12px;
        }
        
        .service-card {
            flex: 1;
            background-color: #f5f5f5;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .service-card.coming-soon {
            position: relative;
            cursor: default;
            opacity: 0.7;
        }
        
        .service-card.coming-soon::after {
            content: 'Soon';
            position: absolute;
            top: -8px;
            right: 12px;
            background: #e0e0e0;
            color: #666;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .service-image {
            width: 70px;
            height: 70px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .service-small-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2px;
        }
        
        .service-main-text {
            font-size: 0.7rem;
            font-weight: 400;
            color: #888;
        }
        
        /* Search bar - always visible */
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 2.5rem 1rem 1.2rem;
            border: none;
            border-radius: 14px;
            background-color: #f5f5f5;
            color: #1a1a1a;
            outline: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
        }
        
        .search-input::placeholder {
            color: #aaa;
        }
        
        .search-circle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-circle-btn .chevron-svg {
            fill: #1a1a1a;
            width: 16px;
            height: 16px;
        }
        
        /* Other pages */
        .page-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            overflow-y: auto;
            display: none;
            padding: 20px;
            padding-bottom: 77px;
        }
        .page-container.active { display: block; }
        
        .create-task-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .create-task-container.active { display: flex; }
        
        .success-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #28a745;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            display: none;
            z-index: 3000;
            font-weight: 500;
            white-space: nowrap;
        }
        
        .tasks-header, .account-header { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
        .empty-state { text-align: center; padding: 3rem; color: #666; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="top-icons" id="topIcons">
        <div class="map-top-left-icon" id="mapTopIcon">
            <i class="ph ph-list"></i>
        </div>
        <div class="map-return-btn" id="mapReturnBtn">
            <i class="ph ph-x"></i>
        </div>
    </div>
    
    <div class="bottom-sheet" id="bottomSheet">
        <div class="sheet-grabber" id="sheetGrabber"></div>
        <div class="sheet-content">
            <h1 class="sheet-header">Let's get it done.</h1>
            
            <div class="services-container" id="servicesContainer">
                <div class="service-cards">
                    <div class="service-card" id="helpersCard">
                        <div class="service-image">
                            <img src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/IMG_5400.png" alt="Helpers">
                        </div>
                        <div class="service-small-text">Helpers</div>
                        <div class="service-main-text">Verified helpers</div>
                    </div>
                    <div class="service-card coming-soon" id="deliveryCard">
                        <div class="service-image">
                            <img src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/CF7B50B9-11E4-414E-86C0-EFC50B182095.png" alt="Delivery">
                        </div>
                        <div class="service-small-text">Delivery</div>
                        <div class="service-main-text">Coming soon</div>
                    </div>
                </div>
            </div>
            
            <div class="search-wrapper">
                <input type="text" class="search-input" id="mainSearchInput" placeholder="I need help with..." readonly>
                <button class="search-circle-btn" id="searchIconBtn">
                    <svg viewBox="0 0 320 512" class="chevron-svg">
                        <path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" id="navHome"><i class="ph ph-house-simple"></i><span>Home</span></button>
        <button class="nav-item" id="navTasks"><i class="ph ph-check-square-offset"></i><span>Tasks</span></button>
        <button class="nav-item" id="navAccount"><i class="ph ph-user"></i><span>Account</span></button>
    </div>
    
    <div class="page-container" id="tasksPage">
        <div class="tasks-header">Your tasks <span id="tasksCount">0</span></div>
        <div id="tasksListContainer"><div class="empty-state">No tasks yet</div></div>
    </div>
    
    <div class="page-container" id="accountPage">
        <div class="account-header">Account</div>
        <div id="accountInfo">
            <div style="margin-bottom: 12px;">Name: <span id="accountName">Guest User</span></div>
            <div style="margin-bottom: 12px;">Email: <span id="accountEmail">Not signed in</span></div>
            <button id="accountLogoutBtn" style="width: 100%; padding: 14px; background: #000; color: white; border: none; border-radius: 12px; margin-top: 20px; cursor: pointer;">Log in</button>
        </div>
    </div>
    
    <div class="create-task-container" id="createTaskContainer">
        <div style="padding: 20px;">
            <button id="closeCreateTaskBtn" style="background: none; border: none; font-size: 24px; cursor: pointer; margin-bottom: 20px;">← Back</button>
            <h3 style="margin: 20px 0 20px 0">Create task</h3>
            <input type="text" id="createTaskInput" placeholder="What do you need help with?" style="width: 100%; padding: 14px; border: 1px solid #e0e0e0; border-radius: 12px; margin-bottom: 20px; font-family: inherit;">
            <button id="nextBtn" style="width: 100%; padding: 14px; background: #000; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;">Post task</button>
        </div>
    </div>
    
    <div class="success-toast" id="successToast"></div>
    
    <script>
        (function() {
            // ========== ENHANCED BOTTOM SHEET SYSTEM ==========
            const sheet = document.getElementById('bottomSheet');
            const grabber = document.getElementById('sheetGrabber');
            const topIcons = document.getElementById('topIcons');
            const returnBtn = document.getElementById('mapReturnBtn');
            const mapEl = document.getElementById('map');
            const servicesContainer = document.getElementById('servicesContainer');
            
            let startY = 0;
            let startHeight = 0;
            let isDragging = false;
            
            // Snap heights
            const COLLAPSED_HEIGHT = 95;     // Grabber + search bar only
            const EXPANDED_HEIGHT = 320;     // Shows header + service cards + search (START HERE)
            const FULLSCREEN_HEIGHT = window.innerHeight - 57;
            
            // IMPORTANT: Start at EXPANDED state, NOT fullscreen
            sheet.style.height = EXPANDED_HEIGHT + 'px';
            
            // Update UI based on current height and state
            function updateUIState(height) {
                const isFullscreen = height >= FULLSCREEN_HEIGHT - 50;
                
                if (isFullscreen) {
                    sheet.classList.add('fullscreen');
                    topIcons.classList.add('fullscreen');
                    mapEl.style.opacity = '0.3';
                    returnBtn.style.opacity = '1';
                    returnBtn.style.pointerEvents = 'auto';
                } else {
                    sheet.classList.remove('fullscreen');
                    topIcons.classList.remove('fullscreen');
                    mapEl.style.opacity = '1';
                    returnBtn.style.opacity = '0';
                    returnBtn.style.pointerEvents = 'none';
                }
                
                // Show/hide services based on height (hide when collapsed)
                if (height < 180) {
                    servicesContainer.style.opacity = '0';
                    servicesContainer.style.transform = 'translateY(-10px)';
                    servicesContainer.style.height = '0';
                    servicesContainer.style.marginBottom = '0';
                } else {
                    servicesContainer.style.opacity = '1';
                    servicesContainer.style.transform = 'translateY(0)';
                    servicesContainer.style.height = 'auto';
                    servicesContainer.style.marginBottom = '24px';
                }
            }
            
            function dragStart(clientY) {
                isDragging = true;
                startY = clientY;
                startHeight = sheet.getBoundingClientRect().height;
                sheet.style.transition = 'none';
                sheet.classList.add('dragging');
                document.body.style.userSelect = 'none';
                document.body.style.cursor = 'grabbing';
            }
            
            function dragMove(clientY) {
                if (!isDragging) return;
                let delta = startY - clientY;
                let newHeight = startHeight + delta;
                newHeight = Math.max(COLLAPSED_HEIGHT, Math.min(FULLSCREEN_HEIGHT, newHeight));
                sheet.style.height = newHeight + 'px';
                updateUIState(newHeight);
            }
            
            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                sheet.classList.remove('dragging');
                sheet.style.transition = 'height 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
                document.body.style.userSelect = '';
                document.body.style.cursor = '';
                
                const currentHeight = sheet.getBoundingClientRect().height;
                const sheetTop = sheet.getBoundingClientRect().top;
                
                // Snap logic - prioritize expanded state as default
                if (sheetTop <= 20 || currentHeight >= FULLSCREEN_HEIGHT - 60) {
                    // DRAG UP → Fullscreen
                    sheet.style.height = FULLSCREEN_HEIGHT + 'px';
                    updateUIState(FULLSCREEN_HEIGHT);
                } else if (currentHeight < 150) {
                    // DRAG DOWN → Collapsed (only grabber + search)
                    sheet.style.height = COLLAPSED_HEIGHT + 'px';
                    updateUIState(COLLAPSED_HEIGHT);
                } else {
                    // DEFAULT → Expanded (shows everything)
                    sheet.style.height = EXPANDED_HEIGHT + 'px';
                    updateUIState(EXPANDED_HEIGHT);
                }
            }
            
            // Touch events
            grabber.addEventListener('touchstart', (e) => { 
                e.preventDefault(); 
                dragStart(e.touches[0].clientY); 
            }, { passive: false });
            
            grabber.addEventListener('touchmove', (e) => { 
                e.preventDefault(); 
                dragMove(e.touches[0].clientY); 
            }, { passive: false });
            
            grabber.addEventListener('touchend', (e) => { 
                e.preventDefault(); 
                dragEnd(); 
            });
            
            // Mouse events
            grabber.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragStart(e.clientY);
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            
            function onMouseMove(e) {
                e.preventDefault();
                dragMove(e.clientY);
            }
            
            function onMouseUp(e) {
                e.preventDefault();
                dragEnd();
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
            
            // Return button - collapses from fullscreen back to expanded
            returnBtn.addEventListener('click', () => {
                sheet.style.height = EXPANDED_HEIGHT + 'px';
                updateUIState(EXPANDED_HEIGHT);
            });
            
            // Click grabber to toggle between collapsed and expanded
            grabber.addEventListener('click', (e) => {
                if (isDragging) return;
                const current = sheet.getBoundingClientRect().height;
                if (current < 150) {
                    // Currently collapsed → expand
                    sheet.style.height = EXPANDED_HEIGHT + 'px';
                    updateUIState(EXPANDED_HEIGHT);
                } else if (current < FULLSCREEN_HEIGHT - 100 && current > 200) {
                    // Currently expanded → collapse
                    sheet.style.height = COLLAPSED_HEIGHT + 'px';
                    updateUIState(COLLAPSED_HEIGHT);
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                const newFullscreen = window.innerHeight - 57;
                const current = sheet.getBoundingClientRect().height;
                if (current > newFullscreen) {
                    sheet.style.height = newFullscreen + 'px';
                    updateUIState(newFullscreen);
                }
            });
            
            // Initialize UI at EXPANDED state
            updateUIState(EXPANDED_HEIGHT);
            
            console.log('✅ Bottom sheet ready - starts at EXPANDED state, drag UP for fullscreen, drag DOWN for collapsed');
            
            // ========== NAVIGATION ==========
            const navHome = document.getElementById('navHome');
            const navTasks = document.getElementById('navTasks');
            const navAccount = document.getElementById('navAccount');
            const tasksPage = document.getElementById('tasksPage');
            const accountPage = document.getElementById('accountPage');
            const createTaskContainer = document.getElementById('createTaskContainer');
            const mainSearchInput = document.getElementById('mainSearchInput');
            const searchIconBtn = document.getElementById('searchIconBtn');
            const closeCreateTaskBtn = document.getElementById('closeCreateTaskBtn');
            const createTaskInput = document.getElementById('createTaskInput');
            const nextBtn = document.getElementById('nextBtn');
            const toast = document.getElementById('successToast');
            
            function setActivePage(page) {
                [navHome, navTasks, navAccount].forEach(btn => btn.classList.remove('active'));
                tasksPage.classList.remove('active');
                accountPage.classList.remove('active');
                createTaskContainer.classList.remove('active');
                
                if (page === 'home') {
                    navHome.classList.add('active');
                    sheet.style.display = 'flex';
                    mapEl.style.display = 'block';
                } else if (page === 'tasks') {
                    navTasks.classList.add('active');
                    sheet.style.display = 'none';
                    mapEl.style.display = 'none';
                    tasksPage.classList.add('active');
                } else if (page === 'account') {
                    navAccount.classList.add('active');
                    sheet.style.display = 'none';
                    mapEl.style.display = 'none';
                    accountPage.classList.add('active');
                }
            }
            
            function openCreateTask() {
                createTaskContainer.classList.add('active');
                sheet.style.display = 'none';
                mapEl.style.display = 'none';
                if (createTaskInput) createTaskInput.focus();
            }
            
            navHome.addEventListener('click', () => setActivePage('home'));
            navTasks.addEventListener('click', () => setActivePage('tasks'));
            navAccount.addEventListener('click', () => setActivePage('account'));
            
            if (mainSearchInput) mainSearchInput.addEventListener('click', openCreateTask);
            if (searchIconBtn) searchIconBtn.addEventListener('click', openCreateTask);
            
            if (closeCreateTaskBtn) {
                closeCreateTaskBtn.addEventListener('click', () => {
                    createTaskContainer.classList.remove('active');
                    sheet.style.display = 'flex';
                    mapEl.style.display = 'block';
                    setActivePage('home');
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    const task = createTaskInput?.value.trim() || 'Task';
                    toast.textContent = `✓ "${task}" posted!`;
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 2000);
                    
                    createTaskContainer.classList.remove('active');
                    sheet.style.display = 'flex';
                    mapEl.style.display = 'block';
                    setActivePage('home');
                    if (createTaskInput) createTaskInput.value = '';
                });
            }
            
            document.getElementById('helpersCard')?.addEventListener('click', () => {
                openCreateTask();
            });
            
            document.getElementById('accountLogoutBtn')?.addEventListener('click', () => {
                toast.textContent = '🔐 Please log in to continue';
                toast.style.display = 'block';
                setTimeout(() => { toast.style.display = 'none'; }, 2000);
            });
            
            // Map initialization
            if (typeof mapboxgl !== 'undefined') {
                mapboxgl.accessToken = 'pk.eyJ1IjoicG1hbGFwaWxlMDciLCJhIjoiY2x3dG43cGt4MDJhNDJxcGtxYTV4cGVmeCJ9.8gq8mhT1rZQcZnGgZl9zCg';
                const map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: [28.034088, -26.195246],
                    zoom: 12
                });
                
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        const lng = pos.coords.longitude;
                        const lat = pos.coords.latitude;
                        map.flyTo({ center: [lng, lat], zoom: 14 });
                        new mapboxgl.Marker({ color: '#000000' }).setLngLat([lng, lat]).addTo(map);
                    }, () => {}, { enableHighAccuracy: true });
                }
            }
        })();
    </script>
</body>
</html>
