<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TaskMart · Home</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    
    <!-- Mapbox GL JS -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    
    <!-- Firebase SDK (v9.22.0) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <!-- Config -->
    <script src="/config.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Manrope', sans-serif;
            font-weight: 400;
            font-size: 16px;
            background: #f5f5f5;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            -webkit-font-smoothing: antialiased;
        }

        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            transition: opacity 0.2s ease;
        }

        /* Top left icon */
        .map-top-left-icon {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: box-shadow 0.2s ease;
        }
        .map-top-left-icon i { font-size: 26px; color: #000; }
        .map-top-left-icon.floating { box-shadow: none; }

        /* Top right return button */
        .map-return-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: opacity 0.2s ease;
            opacity: 0;
            pointer-events: none;
        }
        .map-return-btn i { font-size: 26px; color: #000; }
        .map-return-btn.visible { opacity: 1; pointer-events: auto; }

        /* HOME SHEET - PROPERLY CONTAINED */
        .home-sheet {
            position: absolute;
            bottom: 57px;
            left: 0;
            width: 100%;
            background: white;
            z-index: 10;
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            transition: height 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1), border-radius 0.2s ease;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
        }
        
        .home-sheet.dragging {
            transition: none;
        }
        
        .home-sheet.fullscreen {
            border-radius: 0;
        }
        
        /* Grabber - always visible */
        .grabber {
            width: 48px;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            margin: 12px auto 8px;
            cursor: grab;
            touch-action: none;
            flex-shrink: 0;
        }
        .grabber:active { cursor: grabbing; }
        
        /* Sheet content - flows naturally */
        .sheet-content {
            padding: 0 20px 20px;
            flex-shrink: 0;
        }
        
        .static-header {
            font-family: 'Manrope', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #1a1a1a;
            margin-bottom: 20px;
            letter-spacing: -0.3px;
        }
        
        /* Service cards */
        .service-cards {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .service-card {
            flex: 1;
            background-color: #f5f5f5;
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .service-card.coming-soon {
            position: relative;
            cursor: default;
            opacity: 0.7;
        }
        
        .service-card.coming-soon::after {
            content: 'Soon';
            position: absolute;
            top: -8px;
            right: 12px;
            background: #e0e0e0;
            color: #666;
            font-size: 0.6rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .service-image {
            width: 70px;
            height: 70px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .service-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .service-small-text {
            font-size: 0.9rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 2px;
        }
        
        .service-main-text {
            font-size: 0.7rem;
            font-weight: 400;
            color: #888;
        }
        
        /* Search input */
        .search-container {
            width: 100%;
            margin-top: 4px;
        }
        
        .search-wrapper {
            position: relative;
            width: 100%;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 2.5rem 1rem 1.2rem;
            border: none;
            border-radius: 14px;
            background-color: #f5f5f5;
            color: #1a1a1a;
            outline: none;
            font-family: 'Manrope', sans-serif;
            font-size: 0.95rem;
            cursor: pointer;
        }
        
        .search-input::placeholder {
            color: #aaa;
        }
        
        .search-circle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .search-circle-btn .chevron-svg {
            fill: #1a1a1a;
            width: 16px;
            height: 16px;
        }
        
        /* Bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 57px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 200;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.05);
            padding-bottom: env(safe-area-inset-bottom, 0);
        }
        
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #999;
            transition: color 0.2s;
            font-size: 0.7rem;
            background: transparent;
            border: none;
            font-family: 'Manrope', sans-serif;
        }
        
        .nav-item.active { color: #000; }
        .nav-item i { font-size: 1.4rem; margin-bottom: 2px; }
        
        .notification-dot {
            position: absolute;
            top: -2px;
            right: -4px;
            width: 8px;
            height: 8px;
            background: #000;
            border-radius: 50%;
            display: none;
        }
        .notification-dot.visible { display: block; }
        
        /* Other pages container (tasks, account) */
        .page-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 100;
            overflow-y: auto;
            display: none;
            padding: 20px;
            padding-bottom: 77px;
        }
        .page-container.active { display: block; }
        
        .create-task-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 2000;
            display: none;
            flex-direction: column;
        }
        .create-task-container.active { display: flex; }
        
        /* Quick styles for other elements */
        .tasks-header, .account-header { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.5rem; }
        .task-card { padding: 1rem 0; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .empty-state { text-align: center; padding: 3rem; }
        .success-toast { position: fixed; top: 20px; right: 20px; background: #28a745; color: white; padding: 12px 20px; border-radius: 12px; display: none; z-index: 3000; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 4000; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <div class="map-top-left-icon" id="mapTopIcon">
        <i class="ph ph-list"></i>
    </div>
    
    <div class="map-return-btn" id="mapReturnBtn">
        <i class="ph ph-x"></i>
    </div>
    
    <div class="home-sheet" id="homeSheet">
        <div class="grabber" id="grabber"></div>
        <div class="sheet-content">
            <h2 class="static-header">Let's get it done.</h2>
            
            <div class="service-cards">
                <div class="service-card" id="helpersCard">
                    <div class="service-image">
                        <img src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/IMG_5400.png" alt="Helpers">
                    </div>
                    <div class="service-small-text">Helpers</div>
                    <div class="service-main-text">Verified helpers</div>
                </div>
                <div class="service-card coming-soon" id="deliveryCard">
                    <div class="service-image">
                        <img src="https://raw.githubusercontent.com/Pmalapile07/My-portfolio-app/main/CF7B50B9-11E4-414E-86C0-EFC50B182095.png" alt="Delivery">
                    </div>
                    <div class="service-small-text">Delivery</div>
                    <div class="service-main-text">Coming soon</div>
                </div>
            </div>
            
            <div class="search-container">
                <div class="search-wrapper">
                    <input type="text" class="search-input" id="mainSearchInput" placeholder="I need help with..." readonly>
                    <button class="search-circle-btn" id="searchIconBtn">
                        <svg viewBox="0 0 320 512" class="chevron-svg">
                            <path d="M310.6 233.4c12.5 12.5 12.5 32.8 0 45.3l-192 192c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3L242.7 256 73.4 86.6c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0l192 192z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="bottom-nav" id="bottomNav">
        <button class="nav-item active" id="navHome"><i class="ph ph-house-simple"></i><span>Home</span></button>
        <button class="nav-item" id="navTasks"><i class="ph ph-check-square-offset"></i><span>Tasks</span></button>
        <button class="nav-item" id="navAccount"><i class="ph ph-user"></i><span>Account</span></button>
    </div>
    
    <div class="page-container" id="tasksPage">
        <div class="tasks-header">Your tasks <span id="tasksCount">0</span></div>
        <div id="tasksListContainer"><div class="empty-state">No tasks yet</div></div>
    </div>
    
    <div class="page-container" id="accountPage">
        <div class="account-header">Account</div>
        <div id="accountInfo">
            <div>Name: <span id="accountName">Loading...</span></div>
            <div>Email: <span id="accountEmail">Loading...</span></div>
            <button id="accountLogoutBtn" style="margin-top: 20px; padding: 12px; background: #000; color: white; border: none; border-radius: 12px;">Log out</button>
        </div>
    </div>
    
    <div class="create-task-container" id="createTaskContainer">
        <div style="padding: 20px;">
            <button id="closeCreateTaskBtn" style="background: none; border: none; font-size: 24px;">←</button>
            <h3 style="margin: 20px 0">Create task</h3>
            <input type="text" id="createTaskInput" placeholder="What do you need help with?" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 20px;">
            <button id="nextBtn" style="width: 100%; padding: 14px; background: #000; color: white; border: none; border-radius: 12px;">Post task</button>
        </div>
    </div>
    
    <div class="loading-overlay" id="loadingOverlay"><div style="background: white; padding: 20px; border-radius: 12px;">Loading...</div></div>
    <div class="success-toast" id="successToast"></div>
    
    <script>
        (function() {
            // ========== DRAG SYSTEM - SHEET COVERS FULL MAP, CONTENT FLOWS NATURALLY ==========
            const sheet = document.getElementById('homeSheet');
            const grabber = document.getElementById('grabber');
            const topIcon = document.getElementById('mapTopIcon');
            const returnBtn = document.getElementById('mapReturnBtn');
            const bottomNav = document.getElementById('bottomNav');
            const mapEl = document.getElementById('map');
            
            let startY = 0;
            let startHeight = 0;
            let isDragging = false;
            
            // Height constants
            const MIN_HEIGHT = 100;      // Just shows grabber + part of header
            const MID_HEIGHT = 280;      // Shows header and cards
            const MAX_HEIGHT = window.innerHeight - 57;  // Full screen minus bottom nav
            
            // Set initial height
            sheet.style.height = MID_HEIGHT + 'px';
            
            function updateUIForHeight(height) {
                const sheetRect = sheet.getBoundingClientRect();
                const isFullscreen = sheetRect.top <= 10;
                
                if (isFullscreen) {
                    sheet.classList.add('fullscreen');
                    topIcon.classList.add('floating');
                    returnBtn.classList.add('visible');
                    mapEl.style.opacity = '0.3';
                } else {
                    sheet.classList.remove('fullscreen');
                    topIcon.classList.remove('floating');
                    returnBtn.classList.remove('visible');
                    mapEl.style.opacity = '1';
                }
            }
            
            function dragStart(clientY) {
                isDragging = true;
                startY = clientY;
                startHeight = sheet.getBoundingClientRect().height;
                sheet.style.transition = 'none';
                sheet.classList.add('dragging');
                document.body.style.userSelect = 'none';
            }
            
            function dragMove(clientY) {
                if (!isDragging) return;
                let delta = startY - clientY;
                let newHeight = startHeight + delta;
                newHeight = Math.max(MIN_HEIGHT, Math.min(MAX_HEIGHT, newHeight));
                sheet.style.height = newHeight + 'px';
                updateUIForHeight(newHeight);
            }
            
            function dragEnd() {
                if (!isDragging) return;
                isDragging = false;
                sheet.classList.remove('dragging');
                sheet.style.transition = 'height 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
                document.body.style.userSelect = '';
                
                const currentHeight = sheet.getBoundingClientRect().height;
                const sheetTop = sheet.getBoundingClientRect().top;
                
                // Snap logic
                if (sheetTop <= 40) {
                    // Snap to fullscreen
                    sheet.style.height = MAX_HEIGHT + 'px';
                    updateUIForHeight(MAX_HEIGHT);
                } else if (currentHeight < 180) {
                    // Snap to collapsed/minimal
                    sheet.style.height = MIN_HEIGHT + 'px';
                    updateUIForHeight(MIN_HEIGHT);
                } else {
                    // Snap to mid/default
                    sheet.style.height = MID_HEIGHT + 'px';
                    updateUIForHeight(MID_HEIGHT);
                }
            }
            
            // Touch events
            grabber.addEventListener('touchstart', (e) => { e.preventDefault(); dragStart(e.touches[0].clientY); }, { passive: false });
            grabber.addEventListener('touchmove', (e) => { e.preventDefault(); dragMove(e.touches[0].clientY); }, { passive: false });
            grabber.addEventListener('touchend', (e) => { e.preventDefault(); dragEnd(); });
            
            // Mouse events
            grabber.addEventListener('mousedown', (e) => {
                e.preventDefault();
                dragStart(e.clientY);
                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
            
            function onMouseMove(e) {
                e.preventDefault();
                dragMove(e.clientY);
            }
            
            function onMouseUp(e) {
                e.preventDefault();
                dragEnd();
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
            
            // Return button resets to mid height
            returnBtn.addEventListener('click', () => {
                sheet.style.height = MID_HEIGHT + 'px';
                sheet.classList.remove('fullscreen');
                topIcon.classList.remove('floating');
                returnBtn.classList.remove('visible');
                mapEl.style.opacity = '1';
            });
            
            // Click grabber to toggle between collapsed and mid
            grabber.addEventListener('click', (e) => {
                if (isDragging) return;
                const current = sheet.getBoundingClientRect().height;
                if (current < 150) {
                    sheet.style.height = MID_HEIGHT + 'px';
                    updateUIForHeight(MID_HEIGHT);
                } else if (current > MAX_HEIGHT - 100) {
                    sheet.style.height = MIN_HEIGHT + 'px';
                    updateUIForHeight(MIN_HEIGHT);
                } else {
                    sheet.style.height = MIN_HEIGHT + 'px';
                    updateUIForHeight(MIN_HEIGHT);
                }
            });
            
            // Handle window resize
            window.addEventListener('resize', () => {
                const newMax = window.innerHeight - 57;
                if (sheet.getBoundingClientRect().height > newMax) {
                    sheet.style.height = newMax + 'px';
                }
            });
            
            // ========== SIMPLE NAVIGATION (keep original functionality) ==========
            const navHome = document.getElementById('navHome');
            const navTasks = document.getElementById('navTasks');
            const navAccount = document.getElementById('navAccount');
            const tasksPage = document.getElementById('tasksPage');
            const accountPage = document.getElementById('accountPage');
            const createTaskContainer = document.getElementById('createTaskContainer');
            const mainSearchInput = document.getElementById('mainSearchInput');
            const searchIconBtn = document.getElementById('searchIconBtn');
            const closeCreateTaskBtn = document.getElementById('closeCreateTaskBtn');
            const createTaskInput = document.getElementById('createTaskInput');
            const nextBtn = document.getElementById('nextBtn');
            
            function setActivePage(page) {
                [navHome, navTasks, navAccount].forEach(btn => btn.classList.remove('active'));
                tasksPage.classList.remove('active');
                accountPage.classList.remove('active');
                createTaskContainer.classList.remove('active');
                
                if (page === 'home') {
                    navHome.classList.add('active');
                    sheet.style.display = 'flex';
                } else if (page === 'tasks') {
                    navTasks.classList.add('active');
                    sheet.style.display = 'none';
                    tasksPage.classList.add('active');
                } else if (page === 'account') {
                    navAccount.classList.add('active');
                    sheet.style.display = 'none';
                    accountPage.classList.add('active');
                }
            }
            
            function openCreateTask() {
                createTaskContainer.classList.add('active');
                sheet.style.display = 'none';
                if (createTaskInput) createTaskInput.focus();
            }
            
            navHome.addEventListener('click', () => setActivePage('home'));
            navTasks.addEventListener('click', () => setActivePage('tasks'));
            navAccount.addEventListener('click', () => setActivePage('account'));
            
            if (mainSearchInput) mainSearchInput.addEventListener('click', openCreateTask);
            if (searchIconBtn) searchIconBtn.addEventListener('click', openCreateTask);
            
            if (closeCreateTaskBtn) {
                closeCreateTaskBtn.addEventListener('click', () => {
                    createTaskContainer.classList.remove('active');
                    sheet.style.display = 'flex';
                    setActivePage('home');
                });
            }
            
            if (nextBtn) {
                nextBtn.addEventListener('click', () => {
                    alert('Task posted: ' + (createTaskInput?.value || 'Task'));
                    createTaskContainer.classList.remove('active');
                    sheet.style.display = 'flex';
                    setActivePage('home');
                });
            }
            
            // Mock account logout
            document.getElementById('accountLogoutBtn')?.addEventListener('click', () => {
                alert('Logged out');
            });
            
            // Map initialization (basic)
            if (typeof mapboxgl !== 'undefined') {
                mapboxgl.accessToken = 'pk.eyJ1IjoicG1hbGFwaWxlMDciLCJhIjoiY2x3dG43cGt4MDJhNDJxcGtxYTV4cGVmeCJ9.8gq8mhT1rZQcZnGgZl9zCg';
                const map = new mapboxgl.Map({
                    container: 'map',
                    style: 'mapbox://styles/mapbox/streets-v12',
                    center: [28.034088, -26.195246],
                    zoom: 12
                });
                
                // Add user location marker
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition((pos) => {
                        const lng = pos.coords.longitude;
                        const lat = pos.coords.latitude;
                        map.flyTo({ center: [lng, lat], zoom: 14 });
                        new mapboxgl.Marker({ color: '#000' }).setLngLat([lng, lat]).addTo(map);
                    });
                }
            }
            
            console.log('✅ Drag system ready - sheet covers full map, content flows naturally');
        })();
    </script>
</body>
</html>
