<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Navigation Bar</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ========== MINIMAL FLOATING NAVIGATION ========== */
        .nav-wrapper {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 999999;
            pointer-events: none;
            padding: 0 16px;
        }

        .minimal-nav {
            background: rgba(22, 22, 22, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 34px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: auto;
            animation: navFadeIn 0.4s ease;
        }

        @keyframes navFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
            border-radius: 50%;
            width: 48px;
            height: 48px;
        }

        .nav-btn .material-symbols-outlined {
            font-size: 24px !important;
            transition: all 0.2s ease;
        }

        /* No hover effects - only active state changes */
        .nav-btn.active {
            color: #FF286F;
        }

        .nav-btn.active .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }

        /* Special post button - elevated and minimal */
        .nav-btn.post-btn {
            background: #FF286F;
            color: white;
            width: 56px;
            height: 56px;
            margin-top: -24px;
            box-shadow: 0 8px 16px rgba(255, 40, 111, 0.2);
        }

        .nav-btn.post-btn .material-symbols-outlined {
            font-size: 28px !important;
        }

        .nav-btn.post-btn.active {
            background: #FF286F;
            color: white;
            box-shadow: 0 8px 16px rgba(255, 40, 111, 0.3);
        }

        /* Spacing between icons */
        .nav-btn:not(:last-child) {
            margin-right: 4px;
        }

        /* No labels - clean minimal look */
        .nav-btn span:not(.material-symbols-outlined) {
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .minimal-nav {
                padding: 6px 20px;
            }

            .nav-btn {
                width: 44px;
                height: 44px;
            }

            .nav-btn.post-btn {
                width: 52px;
                height: 52px;
            }

            .nav-btn .material-symbols-outlined {
                font-size: 22px !important;
            }

            .nav-btn.post-btn .material-symbols-outlined {
                font-size: 26px !important;
            }
        }

        /* Hide on specific pages */
        body.hide-nav .nav-wrapper {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Minimal Navigation Bar -->
    <div class="nav-wrapper">
        <nav class="minimal-nav">
            <!-- Home -->
            <button class="nav-btn" onclick="window.parent.navigateTo('home')" id="navHome" data-nav="home">
                <span class="material-symbols-outlined">home</span>
            </button>

            <!-- Notifications -->
            <button class="nav-btn" onclick="window.parent.navigateTo('notifications')" id="navNotifications" data-nav="notifications">
                <span class="material-symbols-outlined">notifications</span>
            </button>

            <!-- Post (Elevated) -->
            <button class="nav-btn post-btn" onclick="window.parent.navigateTo('post')" id="navPost" data-nav="post">
                <span class="material-symbols-outlined">add</span>
            </button>

            <!-- Chat -->
            <button class="nav-btn" onclick="window.parent.navigateTo('chat')" id="navChat" data-nav="chat">
                <span class="material-symbols-outlined">chat</span>
            </button>

            <!-- Profile -->
            <button class="nav-btn" onclick="window.parent.navigateTo('profile')" id="navProfile" data-nav="profile">
                <span class="material-symbols-outlined">person</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            // Update active state based on parent page
            function updateActiveState() {
                try {
                    const parentPath = window.parent.location.pathname;
                    
                    // Remove active class from all buttons
                    document.querySelectorAll('.nav-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });

                    // Set active based on parent page
                    if (parentPath.includes('dashboard.html')) {
                        document.getElementById('navHome')?.classList.add('active');
                    } else if (parentPath.includes('notifications.html')) {
                        document.getElementById('navNotifications')?.classList.add('active');
                    } else if (parentPath.includes('task-planner.html')) {
                        document.getElementById('navPost')?.classList.add('active');
                    } else if (parentPath.includes('chat.html')) {
                        document.getElementById('navChat')?.classList.add('active');
                    } else if (parentPath.includes('profile.html')) {
                        document.getElementById('navProfile')?.classList.add('active');
                    } else if (parentPath.includes('login.html') || parentPath === '/' || parentPath === '/index.html') {
                        document.body.classList.add('hide-nav');
                    } else {
                        document.getElementById('navHome')?.classList.add('active');
                    }
                } catch (e) {
                    console.log('Navigation: Cannot access parent');
                }
            }

            updateActiveState();

            // Listen for messages from parent
            window.addEventListener('message', function(event) {
                if (event.data === 'updateNav') {
                    updateActiveState();
                }
            });
        })();
    </script>
</body>
</html>
