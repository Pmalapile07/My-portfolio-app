<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Blob Navigation</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* ========== LIQUID BLOB NAVIGATION ========== */
        .nav-wrapper {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 999999;
            pointer-events: none;
            padding: 0 16px;
        }

        .liquid-nav {
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: auto;
            position: relative;
        }

        /* The liquid blob that moves between icons */
        .liquid-blob {
            position: absolute;
            width: 56px;
            height: 56px;
            background: #FF286F;
            border-radius: 30px;
            top: 50%;
            transform: translateY(-50%);
            transition: left 0.5s cubic-bezier(0.34, 1.5, 0.64, 1);
            box-shadow: 0 8px 20px rgba(255, 40, 111, 0.4);
            z-index: 0;
            pointer-events: none;
            filter: blur(2px);
            opacity: 0.7;
        }

        /* Inner blob for more liquid effect */
        .liquid-blob::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            background: #FF286F;
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0.4;
            z-index: -1;
            animation: pulseBlob 3s infinite ease-in-out;
        }

        @keyframes pulseBlob {
            0%, 100% {
                transform: scale(1);
                opacity: 0.4;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.2;
            }
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
            width: 56px;
            height: 56px;
            border-radius: 30px;
        }

        .nav-btn .material-symbols-outlined {
            font-size: 24px !important;
            transition: all 0.3s ease;
            position: relative;
            z-index: 3;
        }

        /* Active icon becomes white */
        .nav-btn.active {
            color: white;
        }

        .nav-btn.active .material-symbols-outlined {
            transform: scale(1.1);
            font-variation-settings: 'FILL' 1;
        }

        /* Special post button */
        .nav-btn.post-btn {
            margin-top: -24px;
        }

        .nav-btn.post-btn .material-symbols-outlined {
            font-size: 28px !important;
        }

        /* No labels - clean minimal look */
        .nav-btn span:not(.material-symbols-outlined) {
            display: none;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .liquid-nav {
                padding: 6px 12px;
            }

            .nav-btn {
                width: 48px;
                height: 48px;
                padding: 10px;
            }

            .nav-btn.post-btn {
                width: 52px;
                height: 52px;
            }

            .liquid-blob {
                width: 48px;
                height: 48px;
            }

            .nav-btn .material-symbols-outlined {
                font-size: 22px !important;
            }

            .nav-btn.post-btn .material-symbols-outlined {
                font-size: 26px !important;
            }
        }

        /* Hide on specific pages */
        body.hide-nav .nav-wrapper {
            display: none;
        }

        /* Animation for page transitions */
        @keyframes liquidEntrance {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }

        .liquid-nav {
            animation: liquidEntrance 0.6s cubic-bezier(0.34, 1.5, 0.64, 1);
        }
    </style>
</head>
<body>
    <!-- Liquid Blob Navigation -->
    <div class="nav-wrapper">
        <nav class="liquid-nav" id="liquidNav">
            <!-- The moving liquid blob -->
            <div class="liquid-blob" id="liquidBlob"></div>

            <!-- Home -->
            <button class="nav-btn" onclick="window.parent.navigateTo('home')" id="navHome" data-nav="home">
                <span class="material-symbols-outlined">home</span>
            </button>

            <!-- Notifications -->
            <button class="nav-btn" onclick="window.parent.navigateTo('notifications')" id="navNotifications" data-nav="notifications">
                <span class="material-symbols-outlined">notifications</span>
            </button>

            <!-- Post (Elevated) -->
            <button class="nav-btn post-btn" onclick="window.parent.navigateTo('post')" id="navPost" data-nav="post">
                <span class="material-symbols-outlined">add</span>
            </button>

            <!-- Chat -->
            <button class="nav-btn" onclick="window.parent.navigateTo('chat')" id="navChat" data-nav="chat">
                <span class="material-symbols-outlined">chat</span>
            </button>

            <!-- Profile -->
            <button class="nav-btn" onclick="window.parent.navigateTo('profile')" id="navProfile" data-nav="profile">
                <span class="material-symbols-outlined">person</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            // Position mapping for the liquid blob
            const buttonPositions = {
                home: 0,
                notifications: 1,
                post: 2,
                chat: 3,
                profile: 4
            };

            // Get the nav container and blob
            const nav = document.getElementById('liquidNav');
            const blob = document.getElementById('liquidBlob');
            const buttons = document.querySelectorAll('.nav-btn');

            // Function to move the liquid blob to the active button
            function moveBlobToActive(activeId) {
                const activeButton = document.getElementById(activeId);
                if (!activeButton || !blob || !nav) return;

                // Get positions
                const navRect = nav.getBoundingClientRect();
                const buttonRect = activeButton.getBoundingClientRect();
                
                // Calculate blob position relative to nav
                const blobLeft = buttonRect.left - navRect.left;
                
                // Apply with liquid motion
                blob.style.left = blobLeft + 'px';
                
                // Add a little bounce to the blob
                blob.style.transform = 'translateY(-50%) scale(1.1)';
                setTimeout(() => {
                    blob.style.transform = 'translateY(-50%) scale(1)';
                }, 200);

                // Update active classes
                buttons.forEach(btn => {
                    btn.classList.remove('active');
                });
                activeButton.classList.add('active');
            }

            // Update based on parent page
            function updateActiveState() {
                try {
                    const parentPath = window.parent.location.pathname;
                    
                    let activeId = 'navHome'; // default
                    
                    if (parentPath.includes('dashboard.html')) {
                        activeId = 'navHome';
                    } else if (parentPath.includes('notifications.html')) {
                        activeId = 'navNotifications';
                    } else if (parentPath.includes('task-planner.html')) {
                        activeId = 'navPost';
                    } else if (parentPath.includes('chat.html')) {
                        activeId = 'navChat';
                    } else if (parentPath.includes('profile.html')) {
                        activeId = 'navProfile';
                    } else if (parentPath.includes('login.html') || parentPath === '/' || parentPath === '/index.html') {
                        document.body.classList.add('hide-nav');
                        return;
                    }
                    
                    // Move blob to active button
                    moveBlobToActive(activeId);
                    
                } catch (e) {
                    console.log('Navigation: Cannot access parent');
                }
            }

            // Initialize blob position after a tiny delay to ensure DOM is ready
            setTimeout(() => {
                updateActiveState();
            }, 100);

            // Add click handlers to buttons for smooth liquid motion
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const navId = this.id;
                    
                    // Move blob immediately for instant feedback
                    moveBlobToActive(navId);
                    
                    // The actual navigation will be handled by the parent's navigateTo function
                    // which is called from the onclick attribute
                });
            });

            // Listen for messages from parent
            window.addEventListener('message', function(event) {
                if (event.data === 'updateNav' || event.data?.type === 'navigate') {
                    updateActiveState();
                }
            });

            // Handle window resize - reposition blob
            window.addEventListener('resize', () => {
                const activeBtn = document.querySelector('.nav-btn.active');
                if (activeBtn) {
                    moveBlobToActive(activeBtn.id);
                }
            });

            // Export function for manual updates
            window.updateNavBlob = updateActiveState;
        })();
    </script>
</body>
</html>
