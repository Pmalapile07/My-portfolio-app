<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar Component</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&display=swap">

    <style>
        /* ========== FLOATING MOBILE NAVIGATION BAR ========== */
        .floating-nav-container {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 999999;
            pointer-events: none;
        }

        .floating-nav {
            background: rgba(18, 18, 18, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 8px 16px;
            display: flex;
            align-items: flex-end;
            gap: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            pointer-events: auto;
            animation: navSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes navSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            min-width: 64px;
            position: relative;
            overflow: hidden;
            font-family: 'Manrope', sans-serif;
        }

        .nav-item:hover {
            background: rgba(255, 40, 111, 0.15);
            color: white;
            transform: translateY(-2px);
        }

        .nav-item.active {
            background: #FF286F;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 40, 111, 0.3);
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .nav-icon {
            font-size: 24px !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            margin-bottom: 2px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 0.3px;
            transition: all 0.3s ease;
            opacity: 0.8;
            white-space: nowrap;
        }

        .nav-item.active .nav-label {
            opacity: 1;
            font-weight: 600;
        }

        /* Special styling for post button (center, elevated) */
        .nav-item.post-item {
            background: linear-gradient(145deg, #FF286F, #d61e5b);
            color: white;
            padding: 12px 20px;
            transform: translateY(-16px);
            box-shadow: 0 15px 25px rgba(255, 40, 111, 0.4),
                        0 0 0 2px rgba(255, 255, 255, 0.2) inset;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.4s cubic-bezier(0.34, 1.5, 0.64, 1);
            min-width: 72px;
        }

        .nav-item.post-item:hover {
            transform: translateY(-20px) scale(1.05);
            box-shadow: 0 20px 30px rgba(255, 40, 111, 0.5),
                        0 0 0 3px rgba(255, 255, 255, 0.3) inset;
        }

        .nav-item.post-item:active {
            transform: translateY(-12px) scale(0.98);
        }

        .nav-item.post-item .nav-icon {
            font-size: 28px !important;
            margin-bottom: 2px;
        }

        .nav-item.post-item .nav-label {
            font-size: 11px;
            font-weight: 600;
        }

        /* Ripple effect on click */
        .nav-item::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s ease, height 0.4s ease;
        }

        .nav-item:active::after {
            width: 100px;
            height: 100px;
        }

        /* Active page indicator animation */
        @keyframes activePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 40, 111, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(255, 40, 111, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(255, 40, 111, 0);
            }
        }

        .nav-item.active {
            animation: activePulse 2s infinite;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .floating-nav {
                padding: 6px 12px;
                gap: 2px;
            }

            .nav-item {
                padding: 6px 12px;
                min-width: 52px;
            }

            .nav-item.post-item {
                padding: 10px 16px;
                transform: translateY(-14px);
                min-width: 64px;
            }

            .nav-item.post-item:hover {
                transform: translateY(-16px);
            }

            .nav-icon {
                font-size: 22px !important;
            }

            .nav-item.post-item .nav-icon {
                font-size: 26px !important;
            }

            .nav-label {
                font-size: 9px;
            }
        }

        /* Hide navigation on specified pages */
        body.hide-navigation .floating-nav-container,
        body[data-page="login"] .floating-nav-container,
        body[data-page="index"] .floating-nav-container {
            display: none !important;
        }

        /* Ensure navigation is always on top */
        .floating-nav-container {
            isolation: isolate;
        }
    </style>
</head>
<body>
    <!-- Floating Mobile Navigation Bar -->
    <div class="floating-nav-container">
        <nav class="floating-nav">
            <!-- Home Button -->
            <button class="nav-item" onclick="window.parent.navigateTo('home')" id="navHome" data-nav="home">
                <span class="material-symbols-outlined nav-icon">home</span>
                <span class="nav-label">Home</span>
            </button>

            <!-- Notifications Button -->
            <button class="nav-item" onclick="window.parent.navigateTo('notifications')" id="navNotifications" data-nav="notifications">
                <span class="material-symbols-outlined nav-icon">notifications</span>
                <span class="nav-label">Alerts</span>
            </button>

            <!-- Post Button (Elevated Center) -->
            <button class="nav-item post-item" onclick="window.parent.navigateTo('post')" id="navPost" data-nav="post">
                <span class="material-symbols-outlined nav-icon">add_circle</span>
                <span class="nav-label">Post</span>
            </button>

            <!-- Chat Button -->
            <button class="nav-item" onclick="window.parent.navigateTo('chat')" id="navChat" data-nav="chat">
                <span class="material-symbols-outlined nav-icon">chat</span>
                <span class="nav-label">Chat</span>
            </button>

            <!-- Profile Button -->
            <button class="nav-item" onclick="window.parent.navigateTo('profile')" id="navProfile" data-nav="profile">
                <span class="material-symbols-outlined nav-icon">person</span>
                <span class="nav-label">Profile</span>
            </button>
        </nav>
    </div>

    <script>
        // This script runs inside the iframe/navigation file
        (function() {
            // Function to update active state based on parent page
            function updateActiveState() {
                try {
                    // Get the current page from parent URL
                    const parentPath = window.parent.location.pathname;
                    
                    // Remove active class from all buttons
                    document.querySelectorAll('.nav-item').forEach(item => {
                        item.classList.remove('active');
                    });

                    // Set active based on parent page
                    if (parentPath.includes('dashboard.html')) {
                        document.getElementById('navHome')?.classList.add('active');
                    } else if (parentPath.includes('notifications.html')) {
                        document.getElementById('navNotifications')?.classList.add('active');
                    } else if (parentPath.includes('task-planner.html')) {
                        document.getElementById('navPost')?.classList.add('active');
                    } else if (parentPath.includes('chat.html')) {
                        document.getElementById('navChat')?.classList.add('active');
                    } else if (parentPath.includes('profile.html')) {
                        document.getElementById('navProfile')?.classList.add('active');
                    } else if (parentPath.includes('login.html') || parentPath === '/' || parentPath === '/index.html') {
                        // Hide navigation on login/index pages
                        document.body.classList.add('hide-navigation');
                    } else {
                        // Default to home for any other page
                        document.getElementById('navHome')?.classList.add('active');
                    }
                } catch (e) {
                    console.log('Navigation: Cannot access parent page');
                }
            }

            // Update active state when loaded
            updateActiveState();

            // Listen for messages from parent to update active state
            window.addEventListener('message', function(event) {
                if (event.data === 'updateNavigation') {
                    updateActiveState();
                }
            });
        })();
    </script>
</body>
</html>
