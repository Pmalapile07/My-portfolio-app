<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physical Ball Navigation</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: transparent;
            min-height: 100vh;
        }

        /* ========== PHYSICAL BALL NAVIGATION ========== */
        .nav-wrapper {
            position: fixed;
            bottom: 24px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            z-index: 999999;
            pointer-events: none;
            padding: 0 16px;
        }

        .physical-nav {
            background: rgba(25, 25, 25, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            width: 100%;
            max-width: 440px;
            box-shadow: 
                inset 0 -2px 5px rgba(0, 0, 0, 0.5),
                inset 0 2px 5px rgba(255, 255, 255, 0.1),
                0 10px 20px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            pointer-events: auto;
            position: relative;
        }

        /* The track/groove where the ball sits */
        .ball-track {
            position: absolute;
            top: 50%;
            left: 24px;
            right: 24px;
            height: 40px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            box-shadow: 
                inset 0 2px 5px rgba(0, 0, 0, 0.5),
                inset 0 -1px 2px rgba(255, 255, 255, 0.1);
            z-index: 1;
            pointer-events: none;
        }

        /* The physical ball that rolls */
        .physical-ball {
            position: absolute;
            width: 56px;
            height: 56px;
            background: linear-gradient(145deg, #ffffff, #e0e0e0);
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
            transition: left 0.6s cubic-bezier(0.34, 1.3, 0.64, 1);
            box-shadow: 
                0 4px 10px rgba(0, 0, 0, 0.3),
                inset 0 -3px 5px rgba(0, 0, 0, 0.2),
                inset 0 3px 5px rgba(255, 255, 255, 0.9);
            z-index: 2;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Inner highlight for the ball */
        .physical-ball::after {
            content: '';
            position: absolute;
            top: 8px;
            left: 12px;
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            filter: blur(2px);
        }

        /* The icons sit above the ball */
        .nav-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            padding: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            position: relative;
            z-index: 3;
            width: 60px;
            height: 60px;
            border-radius: 30px;
        }

        .nav-btn .material-symbols-outlined {
            font-size: 24px !important;
            transition: all 0.3s ease;
            position: relative;
            z-index: 4;
        }

        /* When ball is under an icon, that icon lights up */
        .nav-btn.ball-below {
            color: #FF286F;
        }

        .nav-btn.ball-below .material-symbols-outlined {
            transform: scale(1.1);
            filter: drop-shadow(0 0 5px rgba(255, 40, 111, 0.5));
        }

        /* Special post button - sits slightly above */
        .nav-btn.post-btn {
            margin-top: -20px;
        }

        .nav-btn.post-btn .material-symbols-outlined {
            font-size: 28px !important;
            background: #FF286F;
            color: white;
            padding: 8px;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(255, 40, 111, 0.4);
        }

        /* No labels */
        .nav-btn span:not(.material-symbols-outlined) {
            display: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .physical-nav {
                padding: 10px 16px;
            }

            .nav-btn {
                width: 52px;
                height: 52px;
                padding: 10px;
            }

            .physical-ball {
                width: 48px;
                height: 48px;
            }

            .ball-track {
                left: 20px;
                right: 20px;
            }

            .nav-btn .material-symbols-outlined {
                font-size: 22px !important;
            }

            .nav-btn.post-btn .material-symbols-outlined {
                font-size: 26px !important;
                padding: 6px;
            }
        }

        /* Hide on specific pages */
        body.hide-nav .nav-wrapper {
            display: none;
        }

        /* Entrance animation */
        @keyframes rollIn {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .physical-nav {
            animation: rollIn 0.5s ease-out;
        }
    </style>
</head>
<body>
    <!-- Physical Ball Navigation -->
    <div class="nav-wrapper">
        <nav class="physical-nav" id="physicalNav">
            <!-- The track/groove -->
            <div class="ball-track"></div>
            
            <!-- The rolling ball -->
            <div class="physical-ball" id="physicalBall"></div>

            <!-- Home -->
            <button class="nav-btn" onclick="window.parent.navigateTo('home')" id="navHome" data-nav="home">
                <span class="material-symbols-outlined">home</span>
            </button>

            <!-- Notifications -->
            <button class="nav-btn" onclick="window.parent.navigateTo('notifications')" id="navNotifications" data-nav="notifications">
                <span class="material-symbols-outlined">notifications</span>
            </button>

            <!-- Post (Elevated) -->
            <button class="nav-btn post-btn" onclick="window.parent.navigateTo('post')" id="navPost" data-nav="post">
                <span class="material-symbols-outlined">add</span>
            </button>

            <!-- Chat -->
            <button class="nav-btn" onclick="window.parent.navigateTo('chat')" id="navChat" data-nav="chat">
                <span class="material-symbols-outlined">chat</span>
            </button>

            <!-- Profile -->
            <button class="nav-btn" onclick="window.parent.navigateTo('profile')" id="navProfile" data-nav="profile">
                <span class="material-symbols-outlined">person</span>
            </button>
        </nav>
    </div>

    <script>
        (function() {
            // Get elements
            const nav = document.getElementById('physicalNav');
            const ball = document.getElementById('physicalBall');
            const buttons = document.querySelectorAll('.nav-btn');

            // Function to roll the ball to a button
            function rollBallTo(buttonId) {
                const targetButton = document.getElementById(buttonId);
                if (!targetButton || !ball || !nav) return;

                // Get positions
                const navRect = nav.getBoundingClientRect();
                const buttonRect = targetButton.getBoundingClientRect();
                
                // Calculate where the ball should be (center of button)
                const ballLeft = buttonRect.left - navRect.left + (buttonRect.width / 2) - (ball.offsetWidth / 2);
                
                // Apply with physics-based timing
                ball.style.left = ballLeft + 'px';
                
                // Add a little roll effect (rotate the ball slightly)
                ball.style.transform = 'translateY(-50%) rotate(5deg)';
                setTimeout(() => {
                    ball.style.transform = 'translateY(-50%) rotate(0deg)';
                }, 200);

                // Update which button is illuminated
                buttons.forEach(btn => {
                    btn.classList.remove('ball-below');
                });
                targetButton.classList.add('ball-below');
            }

            // Update based on parent page
            function updateActiveState() {
                try {
                    const parentPath = window.parent.location.pathname;
                    
                    let activeId = 'navHome'; // default
                    
                    if (parentPath.includes('dashboard.html')) {
                        activeId = 'navHome';
                    } else if (parentPath.includes('notifications.html')) {
                        activeId = 'navNotifications';
                    } else if (parentPath.includes('task-planner.html')) {
                        activeId = 'navPost';
                    } else if (parentPath.includes('chat.html')) {
                        activeId = 'navChat';
                    } else if (parentPath.includes('profile.html')) {
                        activeId = 'navProfile';
                    } else if (parentPath.includes('login.html') || parentPath === '/' || parentPath === '/index.html') {
                        document.body.classList.add('hide-nav');
                        return;
                    }
                    
                    // Roll ball to active button
                    rollBallTo(activeId);
                    
                } catch (e) {
                    console.log('Navigation: Cannot access parent');
                }
            }

            // Initialize ball position
            setTimeout(() => {
                updateActiveState();
            }, 100);

            // Add click handlers for smooth rolling
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    // Roll ball immediately for physical feedback
                    rollBallTo(this.id);
                });
            });

            // Listen for messages from parent
            window.addEventListener('message', function(event) {
                if (event.data === 'updateNav' || event.data?.type === 'navigate') {
                    updateActiveState();
                }
            });

            // Handle window resize
            window.addEventListener('resize', () => {
                const activeBtn = document.querySelector('.nav-btn.ball-below');
                if (activeBtn) {
                    rollBallTo(activeBtn.id);
                }
            });

            // Export function
            window.rollBallTo = rollBallTo;
        })();
    </script>
</body>
</html>
