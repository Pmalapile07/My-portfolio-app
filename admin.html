<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMart Admin Dashboard</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        body {
            background: #f0f2f5;
            height: 100vh;
            overflow: hidden;
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-container h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .login-container h2 i {
            color: #667eea;
            margin-right: 10px;
        }

        .login-input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .login-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-error {
            color: #e74c3c;
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        /* Main Dashboard */
        #dashboardContainer {
            display: none;
            height: 100vh;
            overflow: hidden;
        }

        .dashboard-layout {
            display: flex;
            height: 100%;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #1a252f 100%);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header {
            padding: 30px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-header h3 {
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h3 i {
            color: #667eea;
        }

        .admin-badge {
            background: rgba(102, 126, 234, 0.2);
            color: #667eea;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            display: inline-block;
        }

        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 15px 25px;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .nav-item i {
            width: 25px;
            margin-right: 15px;
            font-size: 18px;
        }

        .nav-item:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }

        .nav-item.active {
            background: rgba(102, 126, 234, 0.2);
            color: white;
            border-left-color: #667eea;
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .user-details {
            flex: 1;
        }

        .user-name {
            font-weight: 600;
            font-size: 14px;
        }

        .user-email {
            font-size: 12px;
            opacity: 0.7;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .logout-btn:hover {
            background: rgba(231, 76, 60, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            background: #f5f7fa;
            padding: 30px;
        }

        .content-header {
            margin-bottom: 30px;
        }

        .content-header h1 {
            color: #2c3e50;
            font-size: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .content-header p {
            color: #7f8c8d;
            margin-top: 5px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .stat-icon i {
            font-size: 24px;
            color: white;
        }

        .stat-label {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Tables */
        .table-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            width: 300px;
            font-size: 14px;
        }

        .search-box button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background: #5a67d8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px 10px;
            background: #f8f9fa;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
            border-bottom: 2px solid #e0e0e0;
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid #e0e0e0;
            color: #555;
            font-size: 14px;
        }

        tr:hover td {
            background: #f8f9fa;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-danger {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-info {
            background: #d1ecf1;
            color: #0c5460;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            margin: 0 3px;
            transition: opacity 0.3s;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        /* Filters */
        .filters-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-select {
            padding: 10px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            min-width: 150px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            color: #2c3e50;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7f8c8d;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* Loading Spinner */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Image Preview */
        .id-image-preview {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
            margin: 10px 0;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #e0e0e0;
            background: white;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                width: 80px;
            }
            
            .sidebar-header h3 span,
            .nav-item span,
            .user-details,
            .admin-badge {
                display: none;
            }
            
            .nav-item i {
                margin-right: 0;
            }
            
            .main-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Login Overlay -->
    <div id="loginOverlay">
        <div class="login-container">
            <h2><i class="fas fa-shield-alt"></i> Admin Login</h2>
            <input type="email" id="loginEmail" class="login-input" placeholder="Email" value="admin@taskmart.com">
            <input type="password" id="loginPassword" class="login-input" placeholder="Password" value="admin123">
            <button class="login-btn" onclick="handleLogin()">
                <i class="fas fa-sign-in-alt"></i> Login to Dashboard
            </button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div id="dashboardContainer">
        <div class="dashboard-layout">
            <!-- Sidebar -->
            <div class="sidebar">
                <div class="sidebar-header">
                    <h3>
                        <i class="fas fa-tasks"></i>
                        <span>TaskMart Admin</span>
                    </h3>
                    <div class="admin-badge">
                        <i class="fas fa-crown"></i> Administrator
                    </div>
                </div>

                <div class="sidebar-nav">
                    <div class="nav-item active" onclick="switchTab('overview')">
                        <i class="fas fa-chart-pie"></i>
                        <span>Overview</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('users')">
                        <i class="fas fa-users"></i>
                        <span>Users</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('tasks')">
                        <i class="fas fa-tasks"></i>
                        <span>Tasks</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('verifications')">
                        <i class="fas fa-id-card"></i>
                        <span>Verifications</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('reports')">
                        <i class="fas fa-flag"></i>
                        <span>Reports</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('debug')">
                        <i class="fas fa-bug"></i>
                        <span>Debug Logs</span>
                    </div>
                    <div class="nav-item" onclick="switchTab('settings')">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </div>
                </div>

                <div class="sidebar-footer">
                    <div class="user-info" id="adminInfo">
                        <div class="user-avatar" id="adminAvatar">A</div>
                        <div class="user-details">
                            <div class="user-name" id="adminName">Loading...</div>
                            <div class="user-email" id="adminEmail">Loading...</div>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="main-content" id="mainContent">
                <!-- Content will be dynamically loaded here -->
            </div>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modalContainer"></div>

    <script>
        // State Management
        let currentUser = null;
        let authToken = null;
        let currentPage = 1;
        let currentFilters = {};

        // Check for existing session on load
        document.addEventListener('DOMContentLoaded', () => {
            const savedToken = localStorage.getItem('adminToken');
            const savedUser = localStorage.getItem('adminUser');
            
            if (savedToken && savedUser) {
                authToken = savedToken;
                currentUser = JSON.parse(savedUser);
                verifyAndLoadDashboard();
            }
        });

        // Verify token and load dashboard
        async function verifyAndLoadDashboard() {
            try {
                const response = await fetch('/api/auth/verify', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Session expired');
                }

                const data = await response.json();
                
                if (data.user.role !== 'admin') {
                    throw new Error('Not authorized as admin');
                }

                currentUser = data.user;
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                
                // Update admin info
                document.getElementById('adminName').textContent = currentUser.name;
                document.getElementById('adminEmail').textContent = currentUser.email;
                document.getElementById('adminAvatar').textContent = currentUser.initials || currentUser.name.charAt(0);
                
                // Load default tab
                switchTab('overview');
            } catch (error) {
                console.error('Auth failed:', error);
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminUser');
                showLoginError('Session expired. Please login again.');
            }
        }

        // Handle login
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.querySelector('.login-btn');
            
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Login failed');
                }

                if (data.user.role !== 'admin') {
                    throw new Error('Access denied. Admin only.');
                }

                // Save session
                authToken = data.token;
                currentUser = data.user;
                
                localStorage.setItem('adminToken', authToken);
                localStorage.setItem('adminUser', JSON.stringify(currentUser));

                // Show dashboard
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboardContainer').style.display = 'block';
                
                // Update admin info
                document.getElementById('adminName').textContent = currentUser.name;
                document.getElementById('adminEmail').textContent = currentUser.email;
                document.getElementById('adminAvatar').textContent = currentUser.initials || currentUser.name.charAt(0);
                
                // Load overview tab
                switchTab('overview');
            } catch (error) {
                showLoginError(error.message);
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login to Dashboard';
            }
        }

        // Show login error
        function showLoginError(message) {
            const errorDiv = document.getElementById('loginError');
            errorDiv.textContent = message;
            setTimeout(() => {
                errorDiv.textContent = '';
            }, 5000);
        }

        // Handle logout
        function handleLogout() {
            localStorage.removeItem('adminToken');
            localStorage.removeItem('adminUser');
            authToken = null;
            currentUser = null;
            
            document.getElementById('dashboardContainer').style.display = 'none';
            document.getElementById('loginOverlay').style.display = 'flex';
            
            // Clear login form
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginPassword').value = '';
        }

        // Switch between tabs
        function switchTab(tabName) {
            // Update active nav item
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');

            // Load tab content
            switch(tabName) {
                case 'overview':
                    loadOverview();
                    break;
                case 'users':
                    loadUsers();
                    break;
                case 'tasks':
                    loadTasks();
                    break;
                case 'verifications':
                    loadVerifications();
                    break;
                case 'reports':
                    loadReports();
                    break;
                case 'debug':
                    loadDebugLogs();
                    break;
                case 'settings':
                    loadSettings();
                    break;
            }
        }

        // ========== OVERVIEW TAB ==========
        async function loadOverview() {
            const content = document.getElementById('mainContent');
            content.innerHTML = `
                <div class="content-header">
                    <h1><i class="fas fa-chart-pie"></i> Dashboard Overview</h1>
                    <p>Welcome back, ${currentUser.name}! Here's what's happening with TaskMart.</p>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card">
                        <div class="loading-spinner"></div>
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 20px;">
                    <div class="table-container">
                        <div class="table-header">
                            <div class="table-title">Recent Users</div>
                        </div>
                        <div id="recentUsersList">Loading...</div>
                    </div>
                    <div class="table-container">
                        <div class="table-header">
                            <div class="table-title">Recent Tasks</div>
                        </div>
                        <div id="recentTasksList">Loading...</div>
                    </div>
                </div>
            `;

            try {
                const response = await fetch('/api/admin/stats', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load stats');
                
                const stats = await response.json();

                // Update stats grid
                document.getElementById('statsGrid').innerHTML = `
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-users"></i></div>
                        <div class="stat-label">Total Users</div>
                        <div class="stat-value">${stats.users.total}</div>
                        <small>${stats.users.posters} Posters, ${stats.users.helpers} Helpers</small>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-tasks"></i></div>
                        <div class="stat-label">Total Tasks</div>
                        <div class="stat-value">${stats.tasks.total}</div>
                        <small>${stats.tasks.active} Active, ${stats.tasks.completed} Completed</small>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-clock"></i></div>
                        <div class="stat-label">Pending Verifications</div>
                        <div class="stat-value">${stats.system.pendingVerifications}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-flag"></i></div>
                        <div class="stat-label">Open Reports</div>
                        <div class="stat-value">${stats.system.totalReports}</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon"><i class="fas fa-exclamation-triangle"></i></div>
                        <div class="stat-label">Unresolved Errors</div>
                        <div class="stat-value">${stats.system.totalErrors}</div>
                    </div>
                `;

                // Recent users list
                document.getElementById('recentUsersList').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Joined</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${stats.recentUsers.map(user => `

                const response = await fetch(`/api/admin/verifications/${requestId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        status: 'rejected',
                        rejectionReason: reason
                    })
                });

                if (!response.ok) throw new Error('Failed to reject verification');
                
                showNotification('Verification rejected', 'success');
                loadVerifications(currentPage);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        // ========== REPORTS TAB ==========

            currentPage = page;
            
            content.innerHTML = `

                    <h1><i class="fas fa-flag"></i> Reports & Complaints</h1>
                    <p>Manage user reports and complaints</p>
                </div>
                
                <div class="filters-bar">
                    <select class="filter-select" id="reportStatusFilter" onchange="applyReportFilters()">
                        <option value="">All Reports</option>
                        <option value="open">Open</option>
                        <option value="resolved">Resolved</option>
                        <option value="dismissed">Dismissed</option>
                    </select>
                </div>
                
                <div class="table-container">
                    <div class="table-header">
                        <div class="table-title">Reports</div>
                        <div>

        async function loadReportsData(page = 1) {
            try {
                const status = document.getElementById('reportStatusFilter')?.value || '';
                
                let url = `/api/admin/reports?page=${page}&limit=20`;
                if (status) url += `&status=${status}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load reports');
                
                const data = await response.json();
                
                document.getElementById('reportCount').textContent = `Total: ${data.pagination.total} reports`;
                
                document.getElementById('reportsTableBody').innerHTML = data.reports.map(report => `
                    <tr>
                        <td>${report.reporterEmail}</td>
                        <td>${report.reportedUserEmail}</td>
                        <td>${report.reason}</td>
                        <td>
                            <span class="badge ${report.status === 'resolved' ? 'badge-success' : 
                                                report.status === 'dismissed' ? 'badge-info' : 
                                                'badge-warning'}">
                                ${report.status}
                            </span>
                        </td>
                        <td>${new Date(report.createdAt).toLocaleDateString()}</td>
                        <td>
                            <button class="action-btn btn-info" onclick="viewReport('${report._id}')" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            ${report.status === 'open' ? `
                                <button class="action-btn btn-success" onclick="resolveReport('${report._id}')" title="Resolve">
                                    <i class="fas fa-check"></i>
                                </button>
                                <button class="action-btn btn-warning" onclick="dismissReport('${report._id}')" title="Dismiss">
                                    <i class="fas fa-times"></i>
                                </button>
                            ` : ''}
                            <button class="action-btn btn-danger" onclick="warnReportedUser('${report.reportedUserId}')" title="Warn User">
                                <i class="fas fa-exclamation-triangle"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');

                // Pagination
                const pagination = document.getElementById('reportPagination');
                pagination.innerHTML = '';
                
                for (let i = 1; i <= data.pagination.pages; i++) {
                    pagination.innerHTML += `
                        <button class="${i === page ? 'active' : ''}" onclick="loadReports(${i})">${i}</button>
                    `;
                }
            } catch (error) {
                console.error('Error loading reports:', error);
                showNotification('Error loading reports', 'error');
            }
        }

        function applyReportFilters() {
            loadReports(1);
        }

        async function viewReport(reportId) {
            try {
                const response = await fetch(`/api/admin/reports/${reportId}`, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load report details');
                
                const report = await response.json();
                
                let notesHtml = '';
                if (report.adminNotes && report.adminNotes.length > 0) {
                    notesHtml = `
                        <h4>Internal Notes</h4>
                        <ul>
                            ${report.adminNotes.map(note => `<li>${note}</li>`).join('')}
                        </ul>
                    `;
                }
                
                showModal(`
                    <h3>Report Details</h3>
                    <p><strong>Reporter:</strong> ${report.reporterEmail}</p>
                    <p><strong>Reported User:</strong> ${report.reportedUserEmail}</p>
                    <p><strong>Reason:</strong> ${report.reason}</p>
                    <p><strong>Description:</strong> ${report.description}</p>
                    <p><strong>Status:</strong> ${report.status}</p>
                    <p><strong>Reported:</strong> ${new Date(report.createdAt).toLocaleString()}</p>
                    
                    ${notesHtml}
                    
                    <h4>Add Internal Note</h4>
                    <textarea id="reportNote" class="login-input" rows="3" placeholder="Enter note..."></textarea>
                    <button class="action-btn btn-primary" onclick="addReportNote('${report._id}')">Add Note</button>
                `);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        async function addReportNote(reportId) {
            const note = document.getElementById('reportNote').value;
            if (!note) return;
            
            try {
                const response = await fetch(`/api/admin/reports/${reportId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        action: 'add_note',
                        note
                    })
                });

                if (!response.ok) throw new Error('Failed to add note');
                
                showNotification('Note added successfully', 'success');
                closeModal();
                loadReports(currentPage);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        async function resolveReport(reportId) {
            if (!confirm('Mark this report as resolved?')) return;
            
            try {
                const response = await fetch(`/api/admin/reports/${reportId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        action: 'resolve'
                    })
                });

                if (!response.ok) throw new Error('Failed to resolve report');
                
                showNotification('Report resolved successfully', 'success');
                loadReports(currentPage);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        async function dismissReport(reportId) {
            if (!confirm('Dismiss this report?')) return;
            
            try {
                const response = await fetch(`/api/admin/reports/${reportId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        action: 'dismiss'
                    })
                });

                if (!response.ok) throw new Error('Failed to dismiss report');
                
                showNotification('Report dismissed', 'success');
                loadReports(currentPage);
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        async function warnReportedUser(userId) {
            const reason = prompt('Enter warning reason:');
            if (!reason) return;
            
            // You would need to implement a warning system
            alert('Warning system - Feature coming soon');
        }

        // ========== DEBUG LOGS TAB ==========
        async function loadDebugLogs(page = 1) {
            const content = document.getElementById('mainContent');
            currentPage = page;
            
            content.innerHTML = `
                <div class="content-header">
                    <h1><i class="fas fa-bug"></i> Debug Logs</h1>
                    <p>Monitor system errors and failed attempts</p>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                    <div class="table-container">
                        <div class="table-header">
                            <div class="table-title">Error Logs</div>
                        </div>
                        
                        <div class="filters-bar" style="margin-bottom: 15px;">
                            <select class="filter-select" id="errorTypeFilter" onchange="applyDebugFilters()">
                                <option value="">All Error Types</option>
                            </select>
                            
                            <input type="date" id="errorDateFilter" class="filter-select" onchange="applyDebugFilters()">
                            
                            <input type="text" id="errorUserFilter" class="filter-select" placeholder="Filter by User ID" onkeyup="if(event.key === 'Enter') applyDebugFilters()">
                        </div>
                        
                        <div id="errorLogsList">
                            Loading error logs...
                        </div>
                        
                        <div class="pagination" id="errorPagination"></div>
                    </div>
                    
                    <div class="table-container">
                        <div class="table-header">
                            <div class="table-title">Failed Login Attempts</div>
                        </div>
                        
                        <div class="filters-bar" style="margin-bottom: 15px;">
                            <input type="text" id="failedLoginFilter" class="filter-select" placeholder="Filter by email" onkeyup="if(event.key === 'Enter') loadFailedLogins()">
                            <input type="date" id="failedLoginDateFilter" class="filter-select" onchange="loadFailedLogins()">
                        </div>
                        
                        <div id="failedLoginsList">
                            Loading failed login attempts...
                        </div>
                        
                        <div class="pagination" id="failedLoginPagination"></div>
                    </div>
                </div>
            `;

            await loadErrorLogs(page);
            await loadFailedLogins(1);
        }

        async function loadErrorLogs(page = 1) {
            try {
                const errorType = document.getElementById('errorTypeFilter')?.value || '';
                const date = document.getElementById('errorDateFilter')?.value || '';
                const userId = document.getElementById('errorUserFilter')?.value || '';
                
                let url = `/api/admin/error-logs?page=${page}&limit=20`;
                if (errorType) url += `&errorType=${encodeURIComponent(errorType)}`;
                if (date) url += `&startDate=${date}&endDate=${date}`;
                if (userId) url += `&userId=${encodeURIComponent(userId)}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load error logs');
                
                const data = await response.json();
                
                // Populate error type filter
                const typeFilter = document.getElementById('errorTypeFilter');
                if (typeFilter.options.length === 1) {
                    data.errorTypes.forEach(type => {
                        typeFilter.innerHTML += `<option value="${type}">${type}</option>`;
                    });
                }
                
                document.getElementById('errorLogsList').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Type</th>
                                <th>Message</th>
                                <th>User</th>
                                <th>Route</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.logs.map(log => `
                                <tr>
                                    <td>${new Date(log.timestamp).toLocaleString()}</td>
                                    <td><span class="badge badge-danger">${log.errorType}</span></td>
                                    <td>${log.errorMessage.substring(0, 50)}${log.errorMessage.length > 50 ? '...' : ''}</td>
                                    <td>${log.userId || 'N/A'}</td>
                                    <td>${log.route || 'N/A'}</td>
                                    <td>
                                        <span class="badge ${log.resolved ? 'badge-success' : 'badge-warning'}">
                                            ${log.resolved ? 'Resolved' : 'Open'}
                                        </span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;

                // Pagination
                const pagination = document.getElementById('errorPagination');
                pagination.innerHTML = '';
                
                for (let i = 1; i <= data.pagination.pages; i++) {
                    pagination.innerHTML += `
                        <button class="${i === page ? 'active' : ''}" onclick="loadErrorLogs(${i})">${i}</button>
                    `;
                }
            } catch (error) {
                console.error('Error loading error logs:', error);
                document.getElementById('errorLogsList').innerHTML = 'Error loading logs';
            }
        }

        async function loadFailedLogins(page = 1) {
            try {
                const email = document.getElementById('failedLoginFilter')?.value || '';
                const date = document.getElementById('failedLoginDateFilter')?.value || '';
                
                let url = `/api/admin/failed-logins?page=${page}&limit=20`;
                if (email) url += `&email=${encodeURIComponent(email)}`;
                
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load failed logins');
                
                const data = await response.json();
                
                document.getElementById('failedLoginsList').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Email</th>
                                <th>IP Address</th>
                            </tr>
                        </thead>
                        <tbody>

                                    <td>${login.ip || 'N/A'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                console.error('Error loading failed logins:', error);
                document.getElementById('failedLoginsList').innerHTML = 'Error loading failed logins';
            }

        function applyDebugFilters() {
            loadErrorLogs(1);
            loadFailedLogins(1);
        }

        // ========== SETTINGS TAB ==========
        async function loadSettings() {
            const content = document.getElementById('mainContent');
            
            content.innerHTML = `
                <div class="content-header">
                    <h1><i class="fas fa-cog"></i> System Settings</h1>
                    <p>Configure system parameters</p>
                </div>
                
                <div class="table-container">
                    <form onsubmit="saveSettings(event)">
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 10px; font-weight: 600;">Maintenance Mode</label>
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="maintenanceMode"> Enable Maintenance Mode
                            </label>
                            <small style="color: #7f8c8d;">When enabled, users will see a maintenance message</small>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 10px; font-weight: 600;">Developer Mode</label>
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="devMode"> Enable Developer Mode
                            </label>
                            <small style="color: #7f8c8d;">Shows debug information and bypasses some checks</small>
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 10px; font-weight: 600;">Platform Fee (%)</label>
                            <input type="number" id="platformFee" class="login-input" style="width: 200px;" min="0" max="100" step="0.1">
                        </div>
                        
                        <div style="margin-bottom: 20px;">
                            <label style="display: block; margin-bottom: 10px; font-weight: 600;">User Registrations</label>
                            <label style="display: flex; align-items: center; gap: 10px;">
                                <input type="checkbox" id="registrationsEnabled"> Enable New Registrations
                            </label>
                        </div>
                        
                        <button type="submit" class="login-btn" style="width: auto; padding: 10px 30px;">
                            <i class="fas fa-save"></i> Save Settings
                        </button>
                    </form>
                </div>
            `;

            await loadCurrentSettings();
        }

        async function loadCurrentSettings() {
            try {
                const response = await fetch('/api/admin/settings', {
                    headers: {
                        'Authorization': `Bearer ${authToken}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load settings');
                
                const settings = await response.json();
                
                document.getElementById('maintenanceMode').checked = settings.maintenanceMode || false;
                document.getElementById('devMode').checked = settings.devMode || false;
                document.getElementById('platformFee').value = settings.platformFee || 5;
                document.getElementById('registrationsEnabled').checked = settings.registrationsEnabled !== false;
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        async function saveSettings(event) {
            event.preventDefault();
            
            const settings = {
                maintenanceMode: document.getElementById('maintenanceMode').checked,
                devMode: document.getElementById('devMode').checked,
                platformFee: parseFloat(document.getElementById('platformFee').value),
                registrationsEnabled: document.getElementById('registrationsEnabled').checked
            };
            
            try {
                const response = await fetch('/api/admin/settings', {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${authToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(settings)
                });

                if (!response.ok) throw new Error('Failed to save settings');
                
                showNotification('Settings saved successfully', 'success');
            } catch (error) {
                showNotification(error.message, 'error');
            }
        }

        // ========== UTILITY FUNCTIONS ==========
        function showNotification(message, type = 'info') {
            // Create notification element
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                background: ${type === 'success' ? '#27ae60' : type === 'error' ? '#e74c3c' : '#3498db'};
                color: white;
                border-radius: 8px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
                z-index: 3000;
                animation: slideIn 0.3s ease;
            `;
            notification.textContent = message;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    document.body.removeChild(notification);
                }, 300);
            }, 5000);
        }

        function showModal(content) {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h3></h3>
                        <button class="modal-close" onclick="closeModal()">&times;</button>
                    </div>
                    <div class="modal-body">
                        ${content}
                    </div>
                </div>
            `;
            
            document.getElementById('modalContainer').innerHTML = '';
            document.getElementById('modalContainer').appendChild(modal);
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        // Add CSS animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            
            @keyframes slideOut {
                from {
                    transform: translateX(0);
                    opacity: 1;
                }
                to {
                    transform: translateX(100%);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
