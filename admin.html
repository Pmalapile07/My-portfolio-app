<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMart - Complete Verification System</title>
    
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
        }

        /* Profile Menu Styles */
        .profile-menu * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .profile-menu {
            font-family: 'Inter', sans-serif;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .profile-menu .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            z-index: 10000;
            pointer-events: auto;
        }

        .profile-menu .menu-btn .material-symbols-outlined {
            color: #000;
            font-size: 24px;
        }

        /* Modal Overlay */
        .profile-menu .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            justify-content: flex-start;
            z-index: 999999;
            pointer-events: auto;
        }

        .profile-menu .modal-overlay.active {
            display: flex;
        }

        .profile-menu .profile-modal {
            background: white;
            width: 80%;
            max-width: 500px;
            height: 100vh;
            transform: translateX(-100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
            pointer-events: auto;
        }

        .profile-menu .modal-overlay.active .profile-modal {
            transform: translateX(0);
        }

        .profile-menu .full-modal {
            background: white;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000001;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            pointer-events: auto;
        }

        .profile-menu .full-modal.active {
            transform: translateX(0);
        }

        .profile-menu .modal-header {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            gap: 1rem;
            background: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .profile-menu .back-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .profile-menu .back-btn:hover {
            opacity: 1;
        }

        .profile-menu .modal-header h2 {
            font-size: 1.1rem;
            font-weight: 500;
            margin: 0;
        }

        .profile-menu .modal-content {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        /* Profile Info */
        .profile-menu .profile-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .profile-menu .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 1.2rem;
            flex-shrink: 0;
            overflow: hidden;
            cursor: pointer;
        }

        .profile-menu .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-menu .profile-details h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
            font-weight: 500;
        }

        .profile-menu .profile-details p {
            color: #666;
            font-size: 0.85rem;
        }

        /* Menu Items */
        .profile-menu .menu-items-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .profile-menu .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            cursor: pointer;
        }

        .profile-menu .menu-item:hover {
            opacity: 0.7;
        }

        .profile-menu .menu-item-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .profile-menu .menu-item-left .material-symbols-outlined {
            opacity: 0.7;
        }

        .profile-menu .logout-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem 0;
            margin-top: auto;
            cursor: pointer;
            border-top: 1px solid rgba(0,0,0,0.05);
            opacity: 0.7;
        }

        /* Verification Upload Styles */
        .verification-upload-area {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .verification-upload-area:hover {
            border-color: #667eea;
        }

        .verification-upload-area .material-symbols-outlined {
            font-size: 48px;
            color: #999;
            margin-bottom: 1rem;
        }

        .verification-preview {
            margin: 1rem 0;
            position: relative;
            display: inline-block;
        }

        .verification-preview img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .remove-image {
            position: absolute;
            top: -10px;
            right: -10px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verification-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            margin: 1rem 0;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .badge-approved {
            background: #d4edda;
            color: #155724;
        }

        .badge-rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .admin-note {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 8px;
            margin: 1rem 0;
            font-size: 0.9rem;
        }

        /* Admin Panel Styles */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 600;
        }

        .admin-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #ddd;
        }

        .admin-tab {
            padding: 0.75rem 1.5rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .admin-tab.active {
            border-bottom-color: #667eea;
            color: #667eea;
            font-weight: 500;
        }

        .verification-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .verification-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .verification-user {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .verification-user-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .verification-user-info h3 {
            font-size: 1rem;
            margin-bottom: 0.25rem;
        }

        .verification-user-info p {
            color: #666;
            font-size: 0.85rem;
        }

        .verification-documents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin: 1rem 0;
        }

        .document-preview {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0.5rem;
            cursor: pointer;
        }

        .document-preview img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 4px;
        }

        .document-preview p {
            text-align: center;
            margin-top: 0.5rem;
            font-size: 0.85rem;
        }

        .verification-actions {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .approve-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .reject-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
        }

        .rejection-input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 0.5rem 0;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 1rem;
            right: 1rem;
            background: #000;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            text-align: center;
            z-index: 1000000;
            display: none;
            max-width: 400px;
            margin: 0 auto;
        }

        .toast.show {
            display: block;
        }

        /* Loading */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- User Profile Component -->
    <div class="profile-menu">
        <button class="menu-btn" id="profileMenuBtn">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <!-- Main Profile Modal -->
        <div class="modal-overlay" id="profileModalOverlay">
            <div class="profile-modal">
                <div class="modal-content" id="profileModalContent">
                    <div style="text-align:center; padding:2rem;">Loading profile...</div>
                </div>
            </div>
        </div>

        <!-- Verification Upload Modal -->
        <div class="full-modal" id="verificationModal">
            <div class="modal-header">
                <button class="back-btn" id="closeVerificationBtn">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <h2>Identity Verification</h2>
            </div>
            <div class="modal-content" id="verificationModalContent">
                <!-- Content populated by JS -->
            </div>
        </div>

        <!-- Admin Panel Modal -->
        <div class="full-modal" id="adminPanelModal">
            <div class="modal-header">
                <button class="back-btn" id="closeAdminBtn">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <h2>Admin Panel</h2>
            </div>
            <div class="modal-content" id="adminPanelContent">
                <!-- Content populated by JS -->
            </div>
        </div>

        <!-- Image Preview Modal -->
        <div class="full-modal" id="imagePreviewModal">
            <div class="modal-header">
                <button class="back-btn" id="closeImageBtn">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <h2>Document Preview</h2>
            </div>
            <div class="modal-content" style="display: flex; align-items: center; justify-content: center;">
                <img id="previewImage" src="" alt="Document" style="max-width: 100%; max-height: 80vh; object-fit: contain;">
            </div>
        </div>

        <!-- Toast Notification -->
        <div class="toast" id="toast"></div>
    </div>

    <script>
        (function() {
            'use strict';

            const API_BASE_URL = 'https://taskmartapp.onrender.com';

            // DOM Elements
            const menuBtn = document.getElementById('profileMenuBtn');
            const overlay = document.getElementById('profileModalOverlay');
            const content = document.getElementById('profileModalContent');
            
            // Modals
            const verificationModal = document.getElementById('verificationModal');
            const verificationContent = document.getElementById('verificationModalContent');
            const adminModal = document.getElementById('adminPanelModal');
            const adminContent = document.getElementById('adminPanelContent');
            const imageModal = document.getElementById('imagePreviewModal');
            const previewImage = document.getElementById('previewImage');
            
            // Back buttons
            const closeVerification = document.getElementById('closeVerificationBtn');
            const closeAdmin = document.getElementById('closeAdminBtn');
            const closeImage = document.getElementById('closeImageBtn');
            
            const toast = document.getElementById('toast');

            // State
            let currentUser = null;
            let verificationRequests = [];
            let currentDocuments = {
                idDocument: null,
                selfie: null
            };

            // ========== UTILITY FUNCTIONS ==========
            function showToast(message, type = 'success') {
                toast.textContent = message;
                toast.style.background = type === 'error' ? '#ef4444' : '#000';
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 3000);
            }

            function getCurrentUser() {
                try {
                    const user = localStorage.getItem('taskmart_user');
                    return user ? JSON.parse(user) : null;
                } catch (e) {
                    return null;
                }
            }

            function saveUserData(user) {
                localStorage.setItem('taskmart_user', JSON.stringify(user));
                // Also save to localStorage for persistence
                const users = JSON.parse(localStorage.getItem('taskmart_users') || '[]');
                const index = users.findIndex(u => u.email === user.email);
                if (index >= 0) {
                    users[index] = user;
                } else {
                    users.push(user);
                }
                localStorage.setItem('taskmart_users', JSON.stringify(users));
            }

            function getAllUsers() {
                return JSON.parse(localStorage.getItem('taskmart_users') || '[]');
            }

            // ========== VERIFICATION REQUESTS ==========
            function saveVerificationRequest(request) {
                const requests = JSON.parse(localStorage.getItem('verification_requests') || '[]');
                const existing = requests.findIndex(r => r.userEmail === request.userEmail);
                if (existing >= 0) {
                    requests[existing] = request;
                } else {
                    requests.push(request);
                }
                localStorage.setItem('verification_requests', JSON.stringify(requests));
                return request;
            }

            function getVerificationRequests() {
                return JSON.parse(localStorage.getItem('verification_requests') || '[]');
            }

            function updateVerificationStatus(userEmail, status, rejectionReason = '') {
                const requests = getVerificationRequests();
                const request = requests.find(r => r.userEmail === userEmail);
                if (request) {
                    request.status = status;
                    request.rejectionReason = rejectionReason;
                    request.reviewedAt = new Date().toISOString();
                    localStorage.setItem('verification_requests', JSON.stringify(requests));
                }

                // Update user status
                const users = getAllUsers();
                const user = users.find(u => u.email === userEmail);
                if (user) {
                    user.verificationStatus = status;
                    user.adminVerified = status === 'approved';
                    if (rejectionReason) user.rejectionReason = rejectionReason;
                    saveUserData(user);
                }
            }

            // ========== USER FUNCTIONS ==========
            function openModal() {
                currentUser = getCurrentUser();
                if (!currentUser) {
                    alert('Please login first');
                    return;
                }
                overlay.classList.add('active');
                renderProfile();
            }

            function closeModal() {
                overlay.classList.remove('active');
            }

            function openVerificationModal() {
                verificationModal.classList.add('active');
                renderVerificationUpload();
            }

            function openAdminPanel() {
                loadVerificationRequests();
                adminModal.classList.add('active');
            }

            function openImagePreview(imageUrl) {
                previewImage.src = imageUrl;
                imageModal.classList.add('active');
            }

            // ========== RENDER FUNCTIONS ==========
            function renderProfile() {
                const user = currentUser || getCurrentUser();
                if (!user) return;

                const verificationStatus = user.verificationStatus || 'pending';
                let statusBadge = '';
                if (verificationStatus === 'approved') {
                    statusBadge = '<span style="color: #10b981; font-size: 0.85rem;">✓ Verified</span>';
                } else if (verificationStatus === 'rejected') {
                    statusBadge = '<span style="color: #ef4444; font-size: 0.85rem;">✗ Rejected</span>';
                } else {
                    statusBadge = '<span style="color: #f59e0b; font-size: 0.85rem;">⏳ Pending</span>';
                }

                content.innerHTML = `
                    <div class="profile-info">
                        <div class="avatar" id="profileAvatar">
                            ${user.profileImage ? 
                                `<img src="${user.profileImage}" alt="profile">` : 
                                `<span>${user.name ? user.name.substring(0, 2).toUpperCase() : 'U'}</span>`
                            }
                        </div>
                        <div class="profile-details">
                            <h3>${user.name || 'User'}</h3>
                            <p>${user.email || ''}</p>
                            ${statusBadge}
                        </div>
                    </div>

                    <div class="menu-items-container">
                        <div class="menu-items">
                            <div class="menu-item" id="verificationMenuItem">
                                <div class="menu-item-left">
                                    <span class="material-symbols-outlined">verified</span>
                                    <span>Identity Verification</span>
                                </div>
                                <span class="menu-arrow material-symbols-outlined">chevron_right</span>
                            </div>

                            <div class="menu-item" id="adminMenuItem" style="${user.isAdmin ? 'display: flex' : 'display: none'}">
                                <div class="menu-item-left">
                                    <span class="material-symbols-outlined">admin_panel_settings</span>
                                    <span>Admin Panel</span>
                                </div>
                                <span class="menu-arrow material-symbols-outlined">chevron_right</span>
                            </div>
                        </div>

                        <div class="logout-item" id="logoutBtn">
                            <span class="material-symbols-outlined">logout</span>
                            <span>Logout</span>
                        </div>
                    </div>
                `;

                document.getElementById('profileAvatar')?.addEventListener('click', () => {
                    if (user.profileImage) openImagePreview(user.profileImage);
                });

                document.getElementById('verificationMenuItem')?.addEventListener('click', openVerificationModal);
                document.getElementById('adminMenuItem')?.addEventListener('click', openAdminPanel);
                document.getElementById('logoutBtn')?.addEventListener('click', () => {
                    localStorage.removeItem('taskmart_user');
                    window.location.reload();
                });
            }

            function renderVerificationUpload() {
                const user = currentUser || getCurrentUser();
                const requests = getVerificationRequests();
                const existingRequest = requests.find(r => r.userEmail === user.email);

                if (existingRequest && existingRequest.status !== 'rejected') {
                    // Show status
                    verificationContent.innerHTML = `
                        <div style="text-align: center; padding: 2rem;">
                            <span class="material-symbols-outlined" style="font-size: 64px; color: #667eea; margin-bottom: 1rem;">verified</span>
                            <h3 style="margin-bottom: 1rem;">Verification ${existingRequest.status}</h3>
                            <div class="verification-status-badge badge-${existingRequest.status}">
                                ${existingRequest.status === 'approved' ? '✓ Approved' : 
                                  existingRequest.status === 'rejected' ? '✗ Rejected' : '⏳ Pending Review'}
                            </div>
                            ${existingRequest.status === 'rejected' && existingRequest.rejectionReason ? `
                                <div class="admin-note">
                                    <strong>Reason:</strong> ${existingRequest.rejectionReason}
                                </div>
                            ` : ''}
                            ${existingRequest.status === 'rejected' ? `
                                <button class="submit-btn" onclick="window.location.reload()">Submit New Request</button>
                            ` : ''}
                        </div>
                    `;
                    return;
                }

                verificationContent.innerHTML = `
                    <div style="margin-bottom: 2rem;">
                        <h3 style="margin-bottom: 1rem;">Upload Verification Documents</h3>
                        <p style="color: #666; margin-bottom: 2rem;">Please upload a clear photo of your ID and a selfie for verification.</p>
                        
                        <div style="margin-bottom: 2rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">ID Document</label>
                            <div class="verification-upload-area" id="uploadIdBtn">
                                <span class="material-symbols-outlined">upload</span>
                                <p>Click to upload ID (Passport, Driver's License, etc.)</p>
                            </div>
                            <div id="idPreview"></div>
                        </div>

                        <div style="margin-bottom: 2rem;">
                            <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Selfie with ID</label>
                            <div class="verification-upload-area" id="uploadSelfieBtn">
                                <span class="material-symbols-outlined">upload</span>
                                <p>Click to upload selfie holding ID</p>
                            </div>
                            <div id="selfiePreview"></div>
                        </div>

                        <button class="submit-btn" id="submitVerificationBtn" disabled>Submit for Review</button>
                    </div>
                `;

                // Hidden file inputs
                const idInput = document.createElement('input');
                idInput.type = 'file';
                idInput.accept = 'image/*';
                idInput.style.display = 'none';
                idInput.id = 'idFileInput';

                const selfieInput = document.createElement('input');
                selfieInput.type = 'file';
                selfieInput.accept = 'image/*';
                selfieInput.style.display = 'none';
                selfieInput.id = 'selfieFileInput';

                verificationContent.appendChild(idInput);
                verificationContent.appendChild(selfieInput);

                // Upload handlers
                document.getElementById('uploadIdBtn').addEventListener('click', () => idInput.click());
                document.getElementById('uploadSelfieBtn').addEventListener('click', () => selfieInput.click());

                idInput.addEventListener('change', function(e) {
                    if (e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            currentDocuments.idDocument = event.target.result;
                            document.getElementById('idPreview').innerHTML = `
                                <div class="verification-preview">
                                    <img src="${event.target.result}" alt="ID Preview">
                                    <button class="remove-image" onclick="removeDocument('id')">×</button>
                                </div>
                            `;
                            checkSubmitButton();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });

                selfieInput.addEventListener('change', function(e) {
                    if (e.target.files[0]) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            currentDocuments.selfie = event.target.result;
                            document.getElementById('selfiePreview').innerHTML = `
                                <div class="verification-preview">
                                    <img src="${event.target.result}" alt="Selfie Preview">
                                    <button class="remove-image" onclick="removeDocument('selfie')">×</button>
                                </div>
                            `;
                            checkSubmitButton();
                        };
                        reader.readAsDataURL(e.target.files[0]);
                    }
                });

                window.removeDocument = (type) => {
                    if (type === 'id') {
                        currentDocuments.idDocument = null;
                        document.getElementById('idPreview').innerHTML = '';
                        idInput.value = '';
                    } else {
                        currentDocuments.selfie = null;
                        document.getElementById('selfiePreview').innerHTML = '';
                        selfieInput.value = '';
                    }
                    checkSubmitButton();
                };

                function checkSubmitButton() {
                    const btn = document.getElementById('submitVerificationBtn');
                    if (btn) {
                        btn.disabled = !(currentDocuments.idDocument && currentDocuments.selfie);
                    }
                }

                document.getElementById('submitVerificationBtn').addEventListener('click', submitVerification);
            }

            function submitVerification() {
                const user = currentUser || getCurrentUser();
                
                const request = {
                    id: Date.now().toString(),
                    userId: user.email,
                    userEmail: user.email,
                    userName: user.name,
                    documents: {
                        idDocument: currentDocuments.idDocument,
                        selfie: currentDocuments.selfie
                    },
                    status: 'pending',
                    submittedAt: new Date().toISOString()
                };

                saveVerificationRequest(request);
                
                // Update user status
                user.verificationStatus = 'pending';
                user.verificationRequested = true;
                saveUserData(user);

                showToast('Verification submitted successfully!');
                
                setTimeout(() => {
                    verificationModal.classList.remove('active');
                }, 1500);
            }

            // ========== ADMIN FUNCTIONS ==========
            function loadVerificationRequests() {
                const requests = getVerificationRequests();
                renderAdminPanel(requests);
            }

            function renderAdminPanel(requests) {
                const pending = requests.filter(r => r.status === 'pending');
                const reviewed = requests.filter(r => r.status !== 'pending');

                adminContent.innerHTML = `
                    <div class="admin-container">
                        <div class="admin-header">
                            <h1>Verification Requests</h1>
                            <span class="verification-status-badge badge-pending">${pending.length} Pending</span>
                        </div>

                        <div class="admin-tabs">
                            <div class="admin-tab active" data-tab="pending">Pending (${pending.length})</div>
                            <div class="admin-tab" data-tab="reviewed">Reviewed (${reviewed.length})</div>
                        </div>

                        <div id="requestsList">
                            ${renderRequestsList(pending)}
                        </div>
                    </div>
                `;

                // Tab switching
                document.querySelectorAll('.admin-tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        
                        const tabType = tab.dataset.tab;
                        const list = tabType === 'pending' ? pending : reviewed;
                        document.getElementById('requestsList').innerHTML = renderRequestsList(list);
                        
                        // Re-attach event listeners
                        attachRequestListeners();
                    });
                });

                attachRequestListeners();
            }

            function renderRequestsList(requests) {
                if (requests.length === 0) {
                    return '<div style="text-align: center; padding: 3rem; color: #666;">No requests found</div>';
                }

                return requests.map(request => `
                    <div class="verification-card" data-request-id="${request.id}">
                        <div class="verification-header">
                            <div class="verification-user">
                                <div class="verification-user-avatar">
                                    ${request.userName ? request.userName.substring(0, 2).toUpperCase() : 'U'}
                                </div>
                                <div class="verification-user-info">
                                    <h3>${request.userName || 'Unknown'}</h3>
                                    <p>${request.userEmail}</p>
                                    <small>Submitted: ${new Date(request.submittedAt).toLocaleString()}</small>
                                </div>
                            </div>
                            <span class="verification-status-badge badge-${request.status}">
                                ${request.status}
                            </span>
                        </div>

                        ${request.status === 'pending' ? `
                            <div class="verification-documents">
                                <div class="document-preview" data-image="${request.documents?.idDocument}">
                                    <img src="${request.documents?.idDocument}" alt="ID Document">
                                    <p>ID Document</p>
                                </div>
                                <div class="document-preview" data-image="${request.documents?.selfie}">
                                    <img src="${request.documents?.selfie}" alt="Selfie">
                                    <p>Selfie with ID</p>
                                </div>
                            </div>

                            <div class="rejection-section" style="display: none; margin-bottom: 1rem;">
                                <input type="text" class="rejection-input" placeholder="Reason for rejection...">
                            </div>

                            <div class="verification-actions">
                                <button class="approve-btn" onclick="handleApprove('${request.id}')">Approve</button>
                                <button class="reject-btn" onclick="showRejectionInput('${request.id}')">Reject</button>
                            </div>
                        ` : `
                            <div class="admin-note">
                                <strong>Status:</strong> ${request.status}
                                ${request.rejectionReason ? `<br><strong>Reason:</strong> ${request.rejectionReason}` : ''}
                                <br><small>Reviewed: ${new Date(request.reviewedAt).toLocaleString()}</small>
                            </div>
                        `}
                    </div>
                `).join('');
            }

            function attachRequestListeners() {
                // Document preview
                document.querySelectorAll('.document-preview').forEach(el => {
                    el.addEventListener('click', function() {
                        const imageUrl = this.dataset.image;
                        if (imageUrl) openImagePreview(imageUrl);
                    });
                });
            }

            // Admin action handlers
            window.handleApprove = (requestId) => {
                const requests = getVerificationRequests();
                const request = requests.find(r => r.id === requestId);
                
                if (request) {
                    updateVerificationStatus(request.userEmail, 'approved');
                    showToast('Verification approved!');
                    loadVerificationRequests();
                }
            };

            window.showRejectionInput = (requestId) => {
                const card = document.querySelector(`[data-request-id="${requestId}"]`);
                const section = card.querySelector('.rejection-section');
                const actions = card.querySelector('.verification-actions');
                
                section.style.display = 'block';
                actions.innerHTML = `
                    <button class="approve-btn" onclick="confirmReject('${requestId}')">Confirm Reject</button>
                    <button class="reject-btn" onclick="cancelReject('${requestId}')">Cancel</button>
                `;
            };

            window.confirmReject = (requestId) => {
                const card = document.querySelector(`[data-request-id="${requestId}"]`);
                const reason = card.querySelector('.rejection-input').value || 'No reason provided';
                
                const requests = getVerificationRequests();
                const request = requests.find(r => r.id === requestId);
                
                if (request) {
                    updateVerificationStatus(request.userEmail, 'rejected', reason);
                    showToast('Verification rejected');
                    loadVerificationRequests();
                }
            };

            window.cancelReject = (requestId) => {
                loadVerificationRequests(); // Reload to reset UI
            };

            // ========== INITIALIZATION ==========
            function initialize() {
                // Create mock admin user if none exists
                let users = getAllUsers();
                if (users.length === 0) {
                    const adminUser = {
                        name: 'Admin User',
                        email: 'admin@taskmart.com',
                        password: 'admin123',
                        isAdmin: true,
                        adminVerified: true,
                        verificationStatus: 'approved',
                        profileImage: null
                    };
                    saveUserData(adminUser);
                }

                // Check for existing login
                currentUser = getCurrentUser();
            }

            // ========== EVENT LISTENERS ==========
            if (menuBtn) menuBtn.addEventListener('click', openModal);
            
            if (overlay) {
                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) closeModal();
                });
            }

            if (closeVerification) {
                closeVerification.addEventListener('click', () => {
                    verificationModal.classList.remove('active');
                    currentDocuments = { idDocument: null, selfie: null };
                });
            }

            if (closeAdmin) {
                closeAdmin.addEventListener('click', () => {
                    adminModal.classList.remove('active');
                });
            }

            if (closeImage) {
                closeImage.addEventListener('click', () => {
                    imageModal.classList.remove('active');
                });
            }

            // Initialize
            initialize();

            // Expose functions globally
            window.removeDocument = (type) => {}; // Will be overridden
            window.handleApprove = window.handleApprove;
            window.showRejectionInput = window.showRejectionInput;
            window.confirmReject = window.confirmReject;
            window.cancelReject = window.cancelReject;
        })();
    </script>
</body>
</html>
